  </header>

<script>
(()=>{'use strict';
/* ---------- CORE ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const N = x => String(Math.round(x*1000)/1000).replace('-','−');

/* state */
const KEY = 'plus-minus-lab-v1';
let S = { m:{}, tab:'learn', xp:0, best:0, bossRuns:0, hs:{}, chk:{} };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
S.hs = S.hs || {}; S.chk = S.chk || {}; S.m = S.m || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const mast = id => S.m[id] || 0;

const UNITS = { w:'Number Lines', x:'Adding', d:'Subtracting' };
const SKILLS = [
  [1,'w','Hop on the Number Line','🐸'],[2,'w','Distance Between Points','📏'],
  [3,'x','Same Signs','🤝'],[4,'x','Opposite Signs','🪢'],[5,'x','Estimate First','🎯'],
  [6,'d','Keep · Change · Change','🔄'],[7,'d','Subtract Fractions & Decimals','🍕'],[8,'d','Temperature Problems','🌡️']
].map(([id,u,n,e]) => ({id,u,n,e}));
const SK = Object.fromEntries(SKILLS.map(t => [t.id, t]));

/* no test date in the materials: the kicker names the unit instead */
const TEST_DATE = null; /* e.g. new Date(2026, 10, 6) */
function testLine(){
  if (!TEST_DATE) return '<b>Grade 7</b> · Module 2';
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), days = Math.round((TEST_DATE - d0) / 864e5);
  const lab = TEST_DATE.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  if (days < 0) return '<b>Grade 7</b> · Module 2';
  if (days === 0) return '<b>Quiz today!</b> You got this';
  return days === 1 ? `<b>Quiz tomorrow</b> · ${lab}` : `<b>Quiz in ${days} days</b> · ${lab}`;
}

const lvl = () => Math.floor(S.xp / 100) + 1;
const overall = () => Math.round(SKILLS.reduce((s,t) => s + mast(t.id), 0) / SKILLS.length);
function drawRing(){
  const p = overall(), C = 2*Math.PI*17;

const tbl = rows => `<table class="tb">${rows.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

/* number line. o: {min, max, tick, lab, pts:[{x, t, c}], arr:[{a, b, c, t}], w}
   arrows stack above the line in the order given; data-* attributes let the tests read the picture */
const fmtTick = v => (v < 0 ? '−' : '') + String(Math.round(Math.abs(v) * 1000) / 1000);
function nline(o){
  const W = o.w || 320, P = 18, arr = o.arr || [], top = 10 + arr.length * 24, y0 = top + 14, H = y0 + 30;
  const X = v => P + (v - o.min) / (o.max - o.min) * (W - 2 * P);
  const n = Math.round((o.max - o.min) / o.tick), labEvery = Math.max(1, Math.round(o.lab / o.tick));
  let s = `<rect width="${W}" height="${H}" rx="10" fill="var(--surf)"/>`;
  s += `<line x1="6" x2="${W - 6}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-width="2"/><path d="M4 ${y0}l7-5v10zM${W - 4} ${y0}l-7-5v10z" fill="var(--ink)"/>`;
  for (let k = 0; k <= n; k++){
    const v = o.min + k * o.tick, big = k % labEvery === 0, x = X(v).toFixed(1);
    s += `<line x1="${x}" x2="${x}" y1="${y0 - (big ? 7 : 4)}" y2="${y0 + (big ? 7 : 4)}" stroke="var(--ink)" stroke-width="${Math.abs(v) < 1e-9 ? 2.4 : 1.4}"/>`;
    if (big) s += `<text x="${x}" y="${y0 + 21}" font-size="${o.fs || 10.5}" text-anchor="middle" fill="var(--ink)" font-weight="${Math.abs(v) < 1e-9 ? 700 : 400}">${fmtTick(v)}</text>`;
  }
  arr.forEach((a, r) => {
    const y = 12 + r * 24, x1 = X(a.a), x2 = X(a.b), dir = x2 >= x1 ? 1 : -1, c = a.c || 'var(--ink)';
    if (Math.abs(x2 - x1) > 1) s += `<line x1="${x1.toFixed(1)}" x2="${(x2 - dir * 7).toFixed(1)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y}l${-dir * 9} -6v12z" fill="${c}"/>`;
    s += `<circle cx="${x1.toFixed(1)}" cy="${y}" r="3.5" fill="${c}"/><line x1="${x2.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${y + 4}" y2="${y0 - 2}" stroke="${c}" stroke-dasharray="2 3" opacity=".55"/>`;
    if (a.t) s += `<text x="${((x1 + x2) / 2).toFixed(1)}" y="${y - 5}" font-size="11" font-weight="700" text-anchor="middle" fill="${c}">${a.t}</text>`;
  });
  (o.pts || []).forEach(p => { const x = X(p.x).toFixed(1); s += `<circle cx="${x}" cy="${y0}" r="5.5" fill="${p.c || 'var(--ink)'}" stroke="var(--surf)" stroke-width="1.5"/>`; if (p.t) s += `<text x="${x}" y="${y0 - 10}" font-size="13" font-weight="800" text-anchor="middle" fill="${p.c || 'var(--ink)'}">${p.t}</text>`; });
  const data = arr.map(a => `${a.a}>${a.b}`).join(',');
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line" data-arr="${data}" data-pts="${(o.pts || []).map(p => (p.t || '') + '=' + p.x).join(',')}">${s}</svg>`;
}
/* pick a friendly range and tick for a set of values */
function autoLine(vals, extra){
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const span = hi - lo || 1;
  const tick = span <= 6 ? .5 : span <= 14 ? 1 : span <= 30 ? 2 : 5, lab = span <= 6 ? 1 : span <= 14 ? 2 : span <= 30 ? 4 : 10;
  lo = Math.floor(lo / lab) * lab - (lo % lab === 0 ? lab : 0); hi = Math.ceil(hi / lab) * lab + (hi % lab === 0 ? lab : 0);
  return Object.assign({min:lo, max:hi, tick, lab}, extra || {});
}

/* ---------- EXACT NUMBERS: every value is a fraction, so answers never round wrong ---------- */
const gcd = (a,b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a,b] = [b, a % b]; return a || 1; };
const lcm = (a,b) => a / gcd(a,b) * b;
const Q = (n, d=1) => { if (d < 0){ n = -n; d = -d; } const g = gcd(n, d); return {n:n/g, d:d/g}; };
const qadd = (a,b) => Q(a.n*b.d + b.n*a.d, a.d*b.d), qneg = a => Q(-a.n, a.d), qsub = (a,b) => qadd(a, qneg(b)), qabs = a => Q(Math.abs(a.n), a.d);
const qv = a => a.n / a.d, qcmp = (a,b) => a.n*b.d - b.n*a.d;

/* a shown number: {q, k}. k is how it is written: 'i' whole number, 'd' decimal, 'f' fraction or mixed number */
const mk = (q, k) => ({q, k});
const fr = (n,d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const mixed = a => { const w = Math.floor(a.n / a.d), r = a.n % a.d; return r ? (w ? w + fr(r, a.d) : fr(r, a.d)) : String(w); };
const mixedTxt = a => { const w = Math.floor(a.n / a.d), r = a.n % a.d; return r ? (w ? `${w} ${r}/${a.d}` : `${r}/${a.d}`) : String(w); };
const decTxt = a => String(Math.round(qv(a) * 10000) / 10000);
const fmt = x => (x.q.n < 0 ? '−' : '') + (x.k === 'f' ? mixed(qabs(x.q)) : decTxt(qabs(x.q)));
const fmtTxt = x => (x.q.n < 0 ? '−' : '') + (x.k === 'f' ? mixedTxt(qabs(x.q)) : decTxt(qabs(x.q)));
const par = x => x.q.n < 0 ? `(${fmt(x)})` : fmt(x);
const kindOf = (...xs) => xs.some(x => x.k === 'f') ? 'f' : xs.some(x => x.k === 'd') ? 'd' : 'i';
const neg = x => mk(qneg(x.q), x.k), size = x => mk(qabs(x.q), x.k);
const plus = (a,b) => mk(qadd(a.q, b.q), kindOf(a,b)), minus = (a,b) => mk(qsub(a.q, b.q), kindOf(a,b));
const isNeg = x => x.q.n < 0;
/* an expression shown big: terms and the operators between them */
const EX = (ts, ops) => `<span class="ex">${ts.map((t,i) => (i ? ` ${ops[i-1]} ` + par(t) : fmt(t))).join('')}</span>`;
/* the decimal too, when a fraction answer has a short one */
const showAns = x => { const t = fmt(x); if (x.k !== 'f' || x.q.d === 1) return t; let d = x.q.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1 ? `${t} (${(x.q.n < 0 ? '−' : '') + decTxt(qabs(x.q))})` : t; };

/* random numbers to practice with */
function rnum(kind, sign, max){
  let q; max = max || 12;
  if (kind === 'i') q = Q(rnd(1, max + 8));
  else if (kind === 'd'){ const m = pick([10,100,100]); let n; do { n = rnd(m * .3, m * max); } while (n % m === 0 || (m === 100 && n % 10 === 0)); q = Q(n, m); }
  else { const d = pick([2,3,4,5,6,8]), w = rnd(0, max), r = rnd(1, d - 1); q = Q(w * d + r, d); }
  return mk(sign < 0 ? qneg(q) : q, kind);
}
/* two numbers with chosen signs; fractions keep a friendly common denominator; sizes never tie */
function pair(kind, sa, sb, max){
  for (let t = 0; t < 400; t++){
    const a = rnum(kind, sa, max), b = rnum(kind, sb, max);
    if (kind === 'f' && lcm(a.q.d, b.q.d) > 24) continue;
    if (qcmp(qabs(a.q), qabs(b.q)) === 0) continue;
    return [a, b];
  }
}
const sgn = () => Math.random() < .5 ? 1 : -1;

/* step-by-step reasons, written like a teacher would say them */
function whyAdd(a, b){
  const k = kindOf(a,b), s = plus(a,b), A = size(a), B = size(b), f = q => fmt(mk(q, k));
  const den = k === 'f' && a.q.d !== b.q.d ? `Common denominator: ${lcm(a.q.d, b.q.d)}. ` : '';
  if (isNeg(a) === isNeg(b)) return `${den}Same signs: add the sizes. ${f(A.q)} + ${f(B.q)} = ${f(qadd(A.q, B.q))}. Both are ${isNeg(a) ? 'negative' : 'positive'}, so the sum is <b>${fmt(s)}</b>.`;
  const big = qcmp(A.q, B.q) > 0 ? a : b, hi = qcmp(A.q, B.q) > 0 ? A : B, lo = qcmp(A.q, B.q) > 0 ? B : A;
  return `${den}Opposite signs: subtract the sizes. ${f(hi.q)} − ${f(lo.q)} = ${f(qsub(hi.q, lo.q))}. ${fmt(big)} has the bigger size, so the sum is <b>${fmt(s)}</b>.`;
}
const whySub = (a, b) => `Keep · change · change: ${fmt(a)} + ${par(neg(b))}. ` + whyAdd(a, neg(b));

const READY = ['I can add on a number line: right for positive, left for negative.','I can find the distance between two points. It is never negative.','Same signs: I add the sizes and keep the sign.','Opposite signs: I subtract the sizes and use the bigger one’s sign.','I estimate first, then check my answer is close.','I can rewrite subtraction as adding the opposite.','I can subtract decimals, fractions, and mixed numbers.','I can solve temperature problems, even backward ones.'];

/* word match: [word, short meaning] */
const SHORT = {
  'Absolute value':'Distance from 0. Never negative', 'Opposite':'Same distance from 0, other side', 'Sum':'The answer to an addition', 'Difference':'The answer to a subtraction',
  'Distance':'Space between two points', 'Integer':'A whole number or its opposite', 'Rational number':'Can be written as a fraction', 'Zero pair':'A number plus its opposite = 0',
  'Same signs':'Add the sizes. Keep the sign', 'Opposite signs':'Subtract the sizes. Bigger one’s sign', 'Keep · change · change':'Turns − into + the opposite', 'Estimate':'A close answer from rounded numbers'
};
/* step sorter: how to work any a − b */
const STEPS = [
  ['Keep the first number','It stays the same.'],
  ['Change − to +','Subtracting becomes adding.'],
  ['Change the second number to its opposite','5 becomes −5. −9 becomes 9.'],
  ['Compare the signs','Same or opposite?'],

/* ---------- QUESTIONS ---------- */
const MC = o => Object.assign({type:'mc'}, o);
const shufMC = (o, correct, wrongs) => { const all = shuffle([correct, ...wrongs]); return MC(Object.assign(o, {choices:all, answer:all.indexOf(correct)})); };
const NUM = (o, x, extra) => Object.assign({type:'num', blanks:[Object.assign({answer:qv(x.q), show:showAns(x)}, extra || {})]}, o);
const K3 = () => pick(['i','d','d','f','f']);
const POSC = 'var(--pos)', NEGC = 'var(--neg)', GRAYC = 'var(--mut)';
const hopColor = x => isNeg(x) ? NEGC : POSC;
/* a number-line model of a op b, drawn as two hops */
const model = (a, b, op, range) => nline(Object.assign({min:-10, max:10, tick:1, lab:2}, range || {}, {arr:[{a:0, b:qv(a.q), c:GRAYC}, {a:qv(a.q), b:qv(a.q) + (op === '+' ? 1 : -1) * qv(b.q), c:op === '+' ? hopColor(b) : hopColor(neg(b))}]}));

/* 1 · number line hops */
function gLine(){
  const half = Math.random() < .3, kind = half ? 'f' : 'i', unit = half ? 2 : 1, op = Math.random() < .7 ? '+' : '−';
  let a, b, e;
  do { a = mk(Q(rnd(-8*unit, 8*unit), unit), kind); b = mk(Q(rnd(-8*unit, 8*unit), unit), kind); e = op === '+' ? plus(a,b) : minus(a,b); }
  while (!a.q.n || !b.q.n || Math.abs(qv(e.q)) > 10 || !e.q.n);
  if (half){ a.k = b.k = e.k = 'd'; }
  if (Math.random() < .4 && !half && Math.abs(qv(a.q)) <= 5 && Math.abs(qv(b.q)) <= 5){
    const s = op === '+' ? 1 : -1, av = qv(a.q), bv = qv(b.q), ev = qv(e.q);
    const right = nline({min:-10,max:10,tick:1,lab:2,arr:[{a:0,b:av,c:GRAYC},{a:av,b:ev,c:ev > av ? POSC : NEGC}]});
    const wrong = [[{a:0,b:av,c:GRAYC},{a:av,b:av - s*bv,c:-s*bv > 0 ? POSC : NEGC}], [{a:0,b:-av,c:GRAYC},{a:-av,b:-av + s*bv,c:s*bv > 0 ? POSC : NEGC}], [{a:0,b:av,c:GRAYC},{a:0,b:s*bv,c:s*bv > 0 ? POSC : NEGC}]].map(arr => nline({min:-10,max:10,tick:1,lab:2,arr}));
    return Object.assign(shufMC({skill:1, title:'Number line', prompt:`Which model shows ${EX([a,b],[op])}?`, layout:'viz', why:`Start at ${fmt(a)} (gray hop from 0). ${op === '+' ? 'Adding' : 'Subtracting'} ${par(b)} moves ${ev > av ? 'right' : 'left'} ${fmt(size(b))}. You land on <b>${fmt(e)}</b>.`}, right, wrong), {val:qv(e.q)});
  }
  return NUM({skill:1, title:'Number line', prompt:`${EX([a,b],[op])} = ?`, fig:nline({min:-10,max:10,tick:1,lab:2,pts:[{x:qv(a.q), t:'start', c:'var(--x)'}]}), why:`Start at ${fmt(a)}. ${op === '+' ? (isNeg(b) ? 'Adding a negative' : 'Adding a positive') : (isNeg(b) ? 'Subtracting a negative' : 'Subtracting a positive')} moves ${qv(e.q) > qv(a.q) ? 'right ➡️' : 'left ⬅️'} ${fmt(size(b))}. You land on <b>${fmt(e)}</b>.` + model(a, b, op)}, e);
}

/* 2 · distance between two points */
function gDist(){
  if (Math.random() < .65){
    const quarter = Math.random() < .6; let A, B;
    do { A = quarter ? rnd(-11, 11) / 4 : rnd(-9, 9); B = quarter ? rnd(-11, 11) / 4 : rnd(-9, 9); } while (Math.abs(A - B) < (quarter ? .5 : 2) || A === 0 || B === 0);
    if (A > B) [A, B] = [B, A];
    const d = mk(Q(Math.round((B - A) * 4), 4), quarter ? 'd' : 'i'), side = A < 0 && B > 0;
    const fig = quarter ? nline({min:-3, max:3, tick:.25, lab:.5, fs:9.5, pts:[{x:A, t:'A', c:POSC},{x:B, t:'B', c:NEGC}]}) : nline({min:-10, max:10, tick:1, lab:2, pts:[{x:A, t:'A', c:POSC},{x:B, t:'B', c:NEGC}]});
    return NUM({skill:2, title:'Distance', prompt:'What is the distance between point A and point B?', fig, why:`A is at ${N(A)} and B is at ${N(B)}. ${side ? `They are on opposite sides of 0, so add their distances from 0: ${N(-A)} + ${N(B)}` : `Subtract: ${N(B)} − ${A < 0 ? '(' + N(A) + ')' : N(A)}`} = <b>${fmt(d)}</b>. Distance is never negative.`}, d, {post:'units'});
  }
  const kind = pick(['d','f']); let a, b;
  [a, b] = pair(kind, sgn(), sgn(), 9);
  const d = size(minus(b, a));
  return NUM({skill:2, title:'Distance', ctx:`Point A is at <b>${fmt(a)}</b>. Point B is at <b>${fmt(b)}</b>.`, prompt:'How far apart are A and B?', why:`Distance = the size of B − A: ${fmt(b)} − ${par(a)} = ${fmt(minus(b,a))}. Distance is never negative: <b>${fmt(d)}</b>.`}, d, {post:'units'});
}

/* 3 · same signs */
function gSame(){
  const k = K3(), s = Math.random() < .75 ? -1 : 1, [a, b] = pair(k, s, s), e = plus(a,b);
  return NUM({skill:3, title:'Same signs', prompt:`${EX([a,b],['+'])} = ?`, why:whyAdd(a,b)}, e);
}

/* 4 · opposite signs */
function gOpp(){
  const k = K3(), s = sgn(), [a, b] = pair(k, s, -s), e = plus(a,b);
  if (Math.random() < .25) return MC({skill:4, title:'Which sign?', prompt:`Is ${EX([a,b],['+'])} positive or negative?`, choices:['➕ Positive','➖ Negative'], answer:isNeg(e) ? 1 : 0, layout:'g2', why:`${fmt(qcmp(qabs(a.q), qabs(b.q)) > 0 ? a : b)} has the bigger size, so the sum is ${isNeg(e) ? 'negative' : 'positive'}: <b>${fmt(e)}</b>.`, val:qv(e.q)});
  return NUM({skill:4, title:'Opposite signs', prompt:`${EX([a,b],['+'])} = ?`, why:whyAdd(a,b)}, e);
}

/* 5 · estimate first */
const near = x => { const v = qv(x.q); return v < 0 ? -Math.round(-v) : Math.round(v); };
function gEst(){
  for (;;){
    const k = pick(['d','f']), op = Math.random() < .65 ? '+' : '−', [a, b] = pair(k, sgn(), sgn(), 14);
    const fa = Math.abs(qv(a.q)) % 1, fb = Math.abs(qv(b.q)) % 1;
    if (fa === 0 || fb === 0 || Math.abs(fa - .5) < .01 || Math.abs(fb - .5) < .01) continue;
    const ra = near(a), rb = near(b), est = op === '+' ? ra + rb : ra - rb, e = op === '+' ? plus(a,b) : minus(a,b);
    const cands = [-est, op === '+' ? ra - rb : ra + rb, Math.abs(ra) + Math.abs(rb), est + 3, est - 3, -(Math.abs(ra) + Math.abs(rb))];
    const wr = []; cands.forEach(c => { if (wr.length < 3 && c !== est && !wr.includes(c)) wr.push(c); });
    if (wr.length < 3) continue;
    const lab = v => 'about ' + N(v);
    return Object.assign(shufMC({skill:5, title:'Estimate', prompt:`Best estimate for ${EX([a,b],[op])}?`, layout:'g2', why:`Round each number: ${fmt(a)} ≈ ${N(ra)} and ${fmt(b)} ≈ ${N(rb)}. ${N(ra)} ${op} ${rb < 0 ? '(' + N(rb) + ')' : N(rb)} = <b>${N(est)}</b>. The exact answer, ${fmt(e)}, is close.`}, lab(est), wr.map(lab)), {est, val:qv(e.q)});
  }
}

/* 6 · keep · change · change */
function gKCC(){
  const r = Math.random(), k = r < .4 ? 'i' : pick(['i','d']), [a, b] = pair(k, sgn(), sgn());
  if (r < .4){
    const v = minus(a,b), w = [mk(qsub(b.q, a.q), k), plus(a,b), neg(plus(a,b))];
    if (new Set([v, ...w].map(x => qv(x.q))).size < 4) return gKCC();
    return Object.assign(shufMC({skill:6, title:'Subtract', prompt:`Evaluate ${EX([a,b],['−'])}`, layout:'g2', why:whySub(a,b)}, fmt(v), w.map(fmt)), {val:qv(v.q)});
  }
  if (r < .7){
    const ch = [`${fmt(a)} + ${par(neg(b))}`, `${fmt(neg(a))} + ${par(b)}`, `${fmt(a)} + ${par(b)}`, `${fmt(neg(a))} + ${par(neg(b))}`];
    return Object.assign(shufMC({skill:6, title:'Add the opposite', prompt:`Which addition expression equals ${EX([a,b],['−'])}?`, why:`Keep ${fmt(a)}, change − to +, change ${par(b)} to its opposite ${par(neg(b))}: <b>${ch[0]}</b>.`}, ch[0], ch.slice(1)), {kcc:[qv(a.q), qv(b.q)]});
  }
  const ch = [`${fmt(a)} + ${par(neg(b))}`, `${fmt(neg(b))} + ${par(a)}`, `${fmt(b)} − ${par(a)}`, `${fmt(a)} + ${par(b)}`, `${fmt(neg(a))} − ${par(b)}`];

      if (sel === w){ [lb, b].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); x.disabled = true; }); sel = null; if (--left4 === 0){ r++; if (r * 4 >= rounds.length){ const s = sw.stop(); cleanup = null; bump(LAB.matchSkill, 10); timeResult(box, 'match', 'Word Match', s, exit, () => matchGame(box, exit), `${miss} miss${miss === 1 ? '' : 'es'}`); } else setTimeout(deal, 350); } }
      else { miss++; sw.add(2); [lb, b].forEach(x => x.classList.add('bad','shake')); setTimeout(() => [lb, b].forEach(x => x.classList.remove('bad','shake')), 450); toast('+2 seconds'); }
    }}, SHORT[w]); right.append(b); });
    area.replaceChildren(h('div',{class:'lbl'}, `Round ${r + 1} of ${Math.ceil(rounds.length / 4)}`), h('div',{class:'grid2'}, left, right));
  };

}
function stepGame(box, exit){
  const clock = h('b',{}), slots = h('div',{class:'ord'}), pk = h('div',{class:'pick'}); let nxt = 0, miss = 0; const sw = stopwatch(clock); cleanup = sw.kill;
  const paint = () => slots.replaceChildren(...STEPS.map((s,k) => h('div',{class:'slot' + (k < nxt ? ' good' : '')}, h('i',{}, k + 1), k < nxt ? s[0] : '')));
  shuffle(STEPS.map((s,i) => i)).forEach(i => { const b = h('button',{style:'min-height:48px',onclick:() => {
    if (i === nxt){ b.remove(); nxt++; paint(); if (nxt === STEPS.length){ const s = sw.stop(); cleanup = null; bump(LAB.stepSkill, 8); timeResult(box, 'steps', 'Step Sorter', s, exit, () => stepGame(box, exit), `${miss} miss${miss === 1 ? '' : 'es'}`); } }
    else { miss++; sw.add(2); b.classList.add('bad','shake'); setTimeout(() => b.classList.remove('bad','shake'), 450); toast('+2 seconds'); }
  }}, STEPS[i][0]); pk.append(b); });
  box.replaceChildren(backBtn('Games', () => { sw.kill(); cleanup = null; exit(); }), h('div',{class:'row sp'}, h('span',{class:'hint'},`Tap the ${STEPS.length} steps in order. Wrong tap = +2s.`), clock), slots, pk);
  paint();
}
