<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Practice math, rescue sheep, grow an endless meadow and beat the Neon Wizard G.O.A.T.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flock Quest">
<meta name="theme-color" content="#D8E7CE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D2B21" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Flock Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lexend:wght@400;600;700&display=swap">
<style>
/* Layout: a calm sage workspace. Soft leaf-green ground with two blurred hills behind the page, a rounded window-chrome header holding the Classic / Mult·Div switch, one column sized for a 375x667 phone, thumb-height tab bar. Blue means positive, dusty rose means negative, soft butter marks every answer. */
:root{
  --bg:#E7EFE2; --hill1:#D3E3C7; --hill2:#C5D9B8; --surf:#F8FBF5; --chrome:#D8E7CE; --soft:#DCEAD1; --ink:#1F2D22; --mut:#5B6E5D; --line:#CEDCC5; --on:#FFFFFF;
  --w:#4B8A3C; --wt:#E0EED6; --x:#2E7F68; --xt:#D5EBE2; --d:#7656B0; --dt:#E9E1F5;
  --pos:#3F7F45; --post:#DCEBD6; --neg:#7656B0; --negt:#E9E1F5;
  --hl:#F1E39C; --hlk:#1F2D22; --cta:#A8C995; --ctak:#1F2D22;
  --ok:#2C7A4B; --okt:#D8EED4; --no:#A8503B; --not:#F4E4D6; --shadow:rgba(31,45,34,.07);
  --fd:'Quicksand',ui-rounded,system-ui,sans-serif; --fb:'Lexend',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111914; --hill1:#17221A; --hill2:#1C2B20; --surf:#18231B; --chrome:#1D2B21; --soft:#21321F; --ink:#E2ECDF; --mut:#9BAF9C; --line:#2B3B2F; --on:#111914;
  --w:#9DD18A; --wt:#24361F; --x:#7DC9B0; --xt:#173531; --d:#BBA0EA; --dt:#2E2547;
  --pos:#8FD08F; --post:#1F3321; --neg:#BBA0EA; --negt:#2E2547;
  --hl:#D8C870; --hlk:#1F2D22; --cta:#88AE76; --ctak:#111914;
  --ok:#6CCB8E; --okt:#173A26; --no:#EBA181; --not:#47281E; --shadow:rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111914; --hill1:#17221A; --hill2:#1C2B20; --surf:#18231B; --chrome:#1D2B21; --soft:#21321F; --ink:#E2ECDF; --mut:#9BAF9C; --line:#2B3B2F; --on:#111914;
  --w:#9DD18A; --wt:#24361F; --x:#7DC9B0; --xt:#173531; --d:#BBA0EA; --dt:#2E2547;
  --pos:#8FD08F; --post:#1F3321; --neg:#BBA0EA; --negt:#2E2547;
  --hl:#D8C870; --hlk:#1F2D22; --cta:#88AE76; --ctak:#111914;
  --ok:#6CCB8E; --okt:#173A26; --no:#EBA181; --not:#47281E; --shadow:rgba(0,0,0,.25); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-inline:16px;padding-block:0 84px;background-color:var(--bg);background-image:radial-gradient(140% 60% at 112% 4%,var(--hill2) 0 30%,transparent 62%),radial-gradient(120% 55% at -18% 96%,var(--hill1) 0 34%,transparent 66%);background-attachment:fixed;color:var(--ink);font:16px/1.4 var(--fb);touch-action:manipulation;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin-inline:auto}
.u-w{--ac:var(--w);--at:var(--wt)}.u-x{--ac:var(--x);--at:var(--xt)}.u-d{--ac:var(--d);--at:var(--dt)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:-16px;padding:8px 16px 8px;display:flex;flex-direction:column;gap:6px;background:var(--chrome);border-bottom:1px solid var(--line);border-radius:0 0 20px 20px;box-shadow:0 2px 10px var(--shadow)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modebar{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--bg)}
.modebar button{flex:1 1 0;min-height:34px;border:0;border-radius:999px;background:transparent;color:var(--mut);font-weight:700;font-size:14px}
.modebar button b{font:700 15px var(--fd);margin-right:4px}
.modebar button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.modebar button.on b{color:var(--w)}
.kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kick b{color:var(--w)}
.top h1{font-size:23px;line-height:1.05;font-weight:700}
.lv{font-size:11px;font-weight:700;color:var(--mut);text-align:right;line-height:1.25;white-space:nowrap}
.ring{position:relative;width:42px;height:42px;flex:none}
.ring svg{width:42px;height:42px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--fb)}
main{padding-block:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;min-width:0;box-shadow:0 1px 2px var(--shadow)}
.pad{padding:12px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.c{text-align:center}
.big-out{font:600 21px/1.2 var(--fd);color:var(--ac,var(--ink));text-align:center;min-height:26px}
.hl{background:var(--hl);color:var(--hlk);border-radius:6px;padding:0 6px;font-weight:700}
.fx{display:block;width:100%;height:auto}
svg text{font-family:var(--fb)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.chip{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 12px;border-radius:20px;border:2px solid transparent;background:var(--at,var(--bg));color:var(--ink);font-weight:700;line-height:1.2}
.chip.sel,button.chip.on{border-color:var(--ac,var(--ink))}
.btn{min-height:48px;padding:0 16px;border:0;border-radius:14px;background:var(--ac,var(--ink));color:var(--on);font-weight:700;font-size:16px}
.btn.ghost{background:var(--at,var(--surf));color:var(--ink);border:1px solid var(--line)}
.btn.hlb{background:var(--cta);color:var(--ctak)}
.btn:disabled{opacity:.4}
.back{min-height:38px;align-self:flex-start;padding:0 14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.seg button{flex:1 1 0;min-height:38px;padding:0 6px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:var(--chrome);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;border:0;background:none;border-radius:12px;font-size:11px;font-weight:700;color:var(--mut)}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);background:var(--surf)}
nav button.on svg{stroke:var(--w)}

/* Learn */
.unit h2{font-size:15px;color:var(--ac);display:flex;align-items:center;gap:8px;padding-top:4px}
.unit h2::after{content:"";flex:1;height:1px;background:var(--line)}
.tp{overflow:hidden;scroll-margin-top:64px}
.tp>button{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border:0;background:none;text-align:left;font-weight:700;font-size:16px}
.ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--at);font-size:19px}
.tp .dot{margin-left:auto;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.tp .dot.m{background:var(--ok);border-color:var(--ok)}
.tp .dot.h{border-color:var(--ac);background:linear-gradient(90deg,var(--ac) 50%,transparent 50%)}
.tp .body{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.stage{border-radius:14px;background:var(--at);overflow:hidden}
.rule{padding:9px 12px;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:700;text-align:center;font-size:15px;border:1px solid var(--line)}
input[type=range]{width:100%;height:34px;accent-color:var(--ac,var(--x))}
.tile{min-height:52px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surf);font-weight:700;line-height:1.2;text-align:center;display:grid;place-items:center;font-size:15px}
.tile.sel{border-color:var(--ac,var(--ink));background:var(--at,var(--bg))}
.tile.good{border-color:var(--ok);background:var(--okt)}.tile.bad{border-color:var(--no);background:var(--not)}
.tile.dim{opacity:.35}
.def{padding:12px;border-radius:14px;background:var(--at);display:flex;flex-direction:column;gap:4px;min-height:92px}
.def b{font:600 20px var(--fd);color:var(--ac)}
.num-t{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.num-t span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surf);border:2px solid var(--line);font:600 20px var(--fd);transition:transform .25s}
.num-t span.mid{background:var(--hl);border-color:var(--hlk);color:var(--hlk)}
.num-t span.mo{border-color:var(--ac);background:var(--at)}

/* Cards */
.fc{perspective:1000px;height:260px;position:relative;touch-action:pan-y}
.fc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;border-radius:20px;border:2px solid var(--ac);background:var(--surf);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:var(--at)}
.face .q{font:600 30px/1.1 var(--fd)}
.face .a{font:700 19px/1.3 var(--fb)}
.face .tapn{position:absolute;bottom:10px;font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac,var(--x));border-radius:99px;transition:width .3s}

/* Practice engine */
.dots{display:flex;gap:3px}
.dots i{flex:1;height:7px;border-radius:99px;background:var(--line)}
.dots i.g{background:var(--ok)}.dots i.b{background:var(--no)}.dots i.c{background:var(--ink)}.dots i.m{background:var(--x)}
.ctx{padding:10px 12px;border-radius:14px;background:var(--at);display:flex;flex-direction:column;gap:6px;font-size:15px}
.pq{font:600 19px/1.22 var(--fd)}
.opt{display:block;width:100%;min-height:48px;padding:8px 14px;text-align:left;border:2px solid var(--line);background:var(--surf);border-radius:14px;font-weight:700;font-size:16px;line-height:1.25}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.good{border-color:var(--ok);background:var(--okt)}
.opt.bad{border-color:var(--no);background:var(--not)}
.opts{display:grid;gap:8px}
.opts.g2{grid-template-columns:1fr 1fr}.opts.g2 .opt{text-align:center;padding:8px 6px;font-size:15px}
.opts.big .opt{min-height:72px;font-size:18px;text-align:center}
.ord{display:flex;flex-direction:column;gap:5px}
.ord .slot{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border-radius:12px;border:2px dashed var(--line);font-weight:700}
.ord .slot i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--at,var(--bg));font-size:13px;flex:none}
.ord .slot.full{border-style:solid;border-color:var(--ac,var(--ink));background:var(--surf)}
.ord .slot.good{border-color:var(--ok);background:var(--okt)}.ord .slot.bad{border-color:var(--no);background:var(--not)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:42px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font-weight:700;font-size:15px}
.pick button.sel{border-color:var(--ink);background:var(--hl);color:var(--hlk)}
.pick button.good{border-color:var(--ok);background:var(--okt)}.pick button.bad{border-color:var(--no);background:var(--not)}
.pick button:disabled{opacity:.35}
.blank{min-width:64px;min-height:42px;padding:4px 12px;border-radius:12px;border:2px dashed var(--mut);background:var(--surf);font:600 19px var(--fd);color:var(--ink);vertical-align:middle}
.blank.on{border:2px solid var(--w);box-shadow:0 0 0 3px var(--wt)}
.blank.good{border:2px solid var(--ok);background:var(--okt)}.blank.bad{border:2px solid var(--no);background:var(--not)}
.blank:empty::before{content:"?";color:var(--mut)}
.fld{display:flex;align-items:center;gap:8px;font-weight:700}
.fld .lab{min-width:62px}.fld .post{font-weight:700}
.flds3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flds3 .fld{flex-direction:column;align-items:stretch;gap:3px}.flds3 .fld .lab{min-width:0;font-size:13px;text-align:center;color:var(--mut)}.flds3 .blank{width:100%;min-width:0}
.pick.g2{display:grid;grid-template-columns:1fr 1fr}.pick.g2 button{font-size:14px;line-height:1.2}
.pad4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad4 button{min-height:40px;border-radius:12px;background:var(--surf);border:2px solid var(--line);font:600 20px var(--fd)}
.pad4 button:active{background:var(--cta);color:var(--ctak)}
.pad4 .sm{font-size:15px}
.padhint{font-size:12px;color:var(--mut);text-align:center}
.fb{padding:10px 12px;border-radius:14px;font-weight:700}
.fb.good{background:var(--okt);border:2px solid var(--ok)}
.fb.bad{background:var(--not);border:2px solid var(--no)}
table.tb{border-collapse:collapse;font-weight:700;margin:2px auto}
.tb th,.tb td{border:1px solid var(--mut);padding:4px 9px;text-align:center;min-width:40px}
.tb th{background:var(--bg);font-family:var(--fd);font-weight:600}
.hpbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.hpbar i{display:block;height:100%;background:var(--no);transition:width .5s}
.score{font:700 58px/1 var(--fd);text-align:center}
.mrow{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center;padding:8px 12px}
.mrow .nm{font-weight:700;font-size:15px;line-height:1.2}
.pct{font-size:13px;font-weight:700;text-align:right;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:700;font-size:15px}
.chk:last-child{border-bottom:0}
.chk i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:15px}
.chk.on i{background:var(--ok);border-color:var(--ok);color:var(--on)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.78em;margin-inline:1px}
.fr i{font-style:normal;padding:0 2px}.fr i:first-child{border-bottom:2px solid currentColor}
.ex{font:700 26px/1.25 var(--fd);white-space:nowrap}
.exs{font:700 20px/1.3 var(--fd)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.opts.viz .opt{padding:4px 6px}
.work{font:600 17px/1.5 var(--fd);display:flex;flex-direction:column;gap:2px}
.work .on{background:var(--hl);color:var(--hlk);border-radius:6px;padding:0 4px}
.kcc{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.kcc span{min-width:58px;min-height:58px;padding:4px 10px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line);background:var(--surf);font:800 26px var(--fd);transition:all .25s}
.kcc span.k{border-color:var(--ok);background:var(--okt)}.kcc span.c{border-color:var(--hlk);background:var(--hl);color:var(--hlk)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .35s}@keyframes pp{50%{transform:scale(1.06)}}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:9px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;max-width:90vw}
:focus-visible{outline:3px solid var(--w);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Flock Quest: meadow, herd, bosses, missions ---- */
:root{--sky1:#CDE6EE;--sky2:#EEF5E1;--gr1:#8DBF74;--gr2:#6FA85C;--hlA:#A9CD92;--hlB:#BBD7A6;--lv:#C9BCE6;--wool:#F6F1E3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1B2742;--sky2:#2B3C4B;--gr1:#3F6C40;--gr2:#335B37;--hlA:#2D5239;--hlB:#36613F;--lv:#4A3F78}}
:root[data-theme="dark"]{--sky1:#1B2742;--sky2:#2B3C4B;--gr1:#3F6C40;--gr2:#335B37;--hlA:#2D5239;--hlB:#36613F;--lv:#4A3F78}
.subj{align-self:flex-start;min-height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surf);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.subj i{font-style:normal;color:var(--mut)}
nav button{font-size:10.5px;letter-spacing:-.1px;min-width:0}
nav button svg{width:22px;height:22px}
.sheetwrap{position:fixed;inset:0;z-index:30;display:grid;place-items:end center;background:rgba(14,26,16,.55);padding:16px}
.sheet{width:min(420px,100%);max-height:88vh;overflow:auto;background:var(--surf);color:var(--ink);border-radius:22px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.sheet h2{font-size:23px}
.sheet .art{width:132px;margin-inline:auto}
.card input[type=text],.sheet input[type=text]{min-height:48px;border-radius:12px;border:2px solid var(--line);padding:0 12px;font:600 18px var(--fb);text-align:center;background:var(--bg);color:var(--ink)}
.subjlist{display:flex;flex-direction:column;gap:8px;text-align:left}
.subjlist button{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700;text-align:left}
.subjlist button.on{border-color:var(--w);background:var(--wt)}
.subjlist small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.subjlist .em{font-size:24px;width:32px;text-align:center}
.pins{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-inline:-2px;scroll-snap-type:x proximity}
.pin{flex:none;width:84px;min-height:92px;padding:8px 4px;border:1px solid var(--line);border-radius:14px;background:var(--surf);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;scroll-snap-align:start;text-align:center;line-height:1.15}
.pin .sh{width:46px;height:40px}
.pin.lock{opacity:.55}.pin.ready{border-color:var(--w);background:var(--wt);box-shadow:0 0 0 2px var(--w) inset}.pin.done{border-color:var(--d)}
.pin small{font-weight:600;color:var(--mut);font-size:10px}
.mission .scene{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--dt);color:var(--d);font-size:12px;font-weight:700}
/* meadow */

.world{position:relative;height:290px}
.world>svg.bg{position:absolute;left:0;top:0;height:100%;display:block}
.sheep{position:absolute;width:78px;height:68px;padding:0;border:0;background:none;transition:left 2.4s linear;touch-action:manipulation}
.sheep svg{width:100%;height:100%;overflow:visible;transition:transform .2s}

@keyframes zz{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg)}}

.sheep.nap .eyes{display:none}.sheep:not(.nap) .shut{display:none}

.carebar{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.rgrid .e{font-size:26px;display:block}.rgrid .lk{opacity:.4;filter:grayscale(1)}

.hpbar{height:14px}
.stage{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:end;gap:6px;min-height:150px;padding:8px;border-radius:16px;background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%,var(--gr1) 62%);overflow:hidden}
.stage .bs{width:100%;max-width:130px;margin-inline:auto}
.stage .hit{animation:hit .5s}.stage .lunge{animation:lunge .5s}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(9px) rotate(3deg)}50%{transform:translateX(-7px) rotate(-3deg)}}
@keyframes lunge{0%,100%{transform:translateX(0)}40%{transform:translateX(-22px)}}
.stage .fxt{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:700 18px var(--fd);background:var(--surf);color:var(--ink);padding:2px 12px;border-radius:99px;box-shadow:0 1px 4px var(--shadow);min-width:90px;text-align:center}
.hpseg{display:flex;gap:3px}.hpseg i{flex:1;height:12px;border-radius:4px;background:var(--w);transition:background .3s,transform .3s}.hpseg i.gone{background:var(--line);transform:scaleY(.6)}

.ol{text-decoration:overline;text-decoration-thickness:2px}
.lab2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

<body>

<div class="wrap">
  <header class="top">
    <div class="toprow">
      <div><div class="kick" id="kick">Grade 7 · Module 2</div><h1 id="h1">Flock Quest</h1></div>
      <div class="row" style="flex-wrap:nowrap;gap:8px"><div class="lv" id="lv"></div><div class="ring" id="ring"></div></div>

</div>
<nav id="nav" aria-label="Sections"></nav>
<div class="toast" id="toast" hidden></div>
<div class="sheetwrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>
<script>
(()=>{'use strict';
/* ---------- CORE ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const N = x => String(Math.round(x*10000)/10000).replace('-','−');

/* state */
const KEY = 'flock-quest-v1', OLD_KEY = 'plus-minus-lab-v1';
let S = { m:{}, tab:'learn', xp:0, best:0, bossRuns:0, hs:{}, chk:{}, subject:'math' };
let imported = false;
try {
  const r = localStorage.getItem(KEY);
  if (r) S = Object.assign(S, JSON.parse(r));
  else { const o = localStorage.getItem(OLD_KEY); if (o){ const old = JSON.parse(o); ['m','xp','best','bossRuns','hs','chk','chkM','gp','boss','mode'].forEach(k => { if (old[k] != null) S[k] = old[k]; }); imported = !!(S.xp || Object.keys(S.m || {}).length); } }
} catch(e){}
S.hs = S.hs || {}; S.chk = S.chk || {}; S.m = S.m || {}; S.subject = S.subject || 'math';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const mast = id => S.m[id] || 0;

/* two topics share one page: 'c' Classic (add & subtract) and 'm' Mult·Div. Each topic fills MODES[k]; setMode() points these at it. */
const MODES = {}, HOOKS = {xp:[]};
let MODE = 'c', UNITS, SKILLS, GUIDE, PARTS, LAB, CARDS, GAMES, SHORT, STEPS, READY, buildBoss;
const UNITS_C = { w:'Number Lines', x:'Adding', d:'Subtracting' };
const SKILLS_C = [
  [1,'w','Hop on the Number Line','🐸'],[2,'w','Distance Between Points','📏'],
  [3,'x','Same Signs','🤝'],[4,'x','Opposite Signs','🪢'],[5,'x','Estimate First','🎯'],
  [6,'d','Keep · Change · Change','🔄'],[7,'d','Subtract Fractions & Decimals','🍕'],[8,'d','Temperature Problems','🌡️']
].map(([id,u,n,e]) => ({id,u,n,e}));
const SK = {}; /* every skill of both topics, by id */
const addSkills = list => list.forEach(t => SK[t.id] = t);
addSkills(SKILLS_C);

/* no test date in the materials: the kicker names the unit instead */
const TEST_DATE = null; /* e.g. new Date(2026, 10, 6) */
function testLine(){
  if (!TEST_DATE) return LAB.kick;
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), days = Math.round((TEST_DATE - d0) / 864e5);
  const lab = TEST_DATE.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  if (days < 0) return '<b>Grade 7</b> · Module 2';
  if (days === 0) return '<b>Quiz today!</b> You got this';
  return days === 1 ? `<b>Quiz tomorrow</b> · ${lab}` : `<b>Quiz in ${days} days</b> · ${lab}`;
}

const lvl = () => Math.floor(S.xp / 100) + 1;
const overall = () => { const ids = Object.keys(SK); return Math.round(ids.reduce((s,id) => s + mast(id), 0) / ids.length); };
function drawRing(){
  const p = overall(), C = 2*Math.PI*17;
  $('#ring').innerHTML = `<svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="17" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="21" cy="21" r="17" fill="none" stroke="var(--w)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><b>${p}%</b>`;
  $('#ring').setAttribute('role','img'); $('#ring').setAttribute('aria-label','Overall mastery ' + p + ' percent');
  $('#lv').innerHTML = `Level ${lvl()}<br>${S.xp} XP`;
  $('#kick').innerHTML = kickText();
  $('#h1').textContent = 'Flock Quest';
}
const bossStat = (k) => { S.boss = S.boss || {c:{best:S.best || 0, runs:S.bossRuns || 0}, m:{best:0, runs:0}}; k = k || MODE; return S.boss[k] || (S.boss[k] = {best:0, runs:0}); };
const chk = () => MODE === 'c' ? (S.chk = S.chk || {}) : MODE === 'm' ? (S.chkM = S.chkM || {}) : (S.chkD = S.chkD || {});
const gpKey = k => MODE === 'c' ? k : MODE + ':' + k;
function setMode(m){
  const M = MODES[m] ? m : 'c', X = MODES[M]; MODE = M; S.mode = M;
  ({units:UNITS, skills:SKILLS, guide:GUIDE, parts:PARTS, lab:LAB, cards:CARDS, games:GAMES, short:SHORT, steps:STEPS, ready:READY, boss:buildBoss} = X);
  document.documentElement.dataset.mode = M;
  document.querySelectorAll('#modebar button').forEach(b => { const on = b.dataset.m === M; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
}
function buildModebar(){
  const bar = $('#modebar');
  [['c','<b>±</b> Add · Sub'],['m','<b>×÷</b> Mult · Div'],['d','<b>0.3̄</b> Decimals']].forEach(([k, lab]) => bar.append(h('button',{'data-m':k,html:lab,onclick:() => { if (k === MODE) return; if (cleanup){ cleanup(); cleanup = null; } setMode(k); save(); drawRing(); go(VIEWS[S.tab] ? S.tab : 'learn'); toast({c:'Add & subtract', m:'Multiply & divide', d:'Dividing & decimals'}[k]); }})));
}
function bump(id, d){ S.m[id] = Math.max(0, Math.min(100, mast(id) + d)); save(); drawRing(); }
function xp(n){ const was = lvl(); S.xp += n; save(); drawRing(); HOOKS.xp.forEach(f => f(n)); if (lvl() > was) toast('Level up! Level ' + lvl()); }
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1600); }

const ICONS = {
  learn:'<path d="M12 3v9M7.5 7.5h9M7.5 18h9"/>',
  meadow:'<path d="M7.5 16.5a3 3 0 0 1-.3-5.9 4 4 0 0 1 7.4-1.6 3.3 3.3 0 0 1 2.6 5.5z"/><path d="M9.5 16.5v3.5M14.5 16.5v3.5"/>',
  guide:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  boss:'<path d="M6 3v18M6 4h11l-2 4 2 4H6"/>',
  games:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/>',
  me:'<path d="M5 19V11M12 19V5M19 19v-5"/>'
};
const TABS = [['learn','Learn'],['guide','Study'],['boss','Boss'],['meadow','Meadow'],['games','Games'],['me','Progress']];
const VIEWS = {};
let cleanup = null;
function go(tab){
  if (cleanup){ cleanup(); cleanup = null; }
  S.tab = tab; save();
  document.querySelectorAll('#nav button').forEach(b => { const on = b.dataset.t === tab; b.classList.toggle('on', on); on ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'); });
  const v = $('#view'); v.replaceChildren(); if (SUBJ_SHELL(tab)) VIEWS.shell(v, tab); else VIEWS[tab](v);
  window.scrollTo(0,0);
}
function buildNav(){
  const n = $('#nav');
  TABS.forEach(([k,l]) => n.append(h('button',{'data-t':k,onclick:()=>go(k)}, h('span',{html:`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`}), l)));
}
function seg(items, cur, fn){
  const el = h('div',{class:'seg'});
  items.forEach(([k,l]) => el.append(h('button',{class:k===cur?'on':'',onclick:ev => { el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === ev.currentTarget)); fn(k); }}, l)));
  return el;
}
const backBtn = (label, fn) => h('button',{class:'btn ghost back',onclick:fn}, '← ' + label);
const tbl = rows => `<table class="tb">${rows.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;

/* number line. o: {min, max, tick, lab, pts:[{x, t, c}], arr:[{a, b, c, t}], w}
   arrows stack above the line in the order given; data-* attributes let the tests read the picture */
const fmtTick = v => (v < 0 ? '−' : '') + String(Math.round(Math.abs(v) * 1000) / 1000);
function nline(o){
  const W = o.w || 320, P = 18, arr = o.arr || [], top = 10 + arr.length * 24, y0 = top + 14, H = y0 + 30;
  const X = v => P + (v - o.min) / (o.max - o.min) * (W - 2 * P);
  const n = Math.round((o.max - o.min) / o.tick), labEvery = Math.max(1, Math.round(o.lab / o.tick));
  let s = `<rect width="${W}" height="${H}" rx="10" fill="var(--surf)"/>`;
  s += `<line x1="6" x2="${W - 6}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-width="2"/><path d="M4 ${y0}l7-5v10zM${W - 4} ${y0}l-7-5v10z" fill="var(--ink)"/>`;
  for (let k = 0; k <= n; k++){
    const v = o.min + k * o.tick, big = k % labEvery === 0, x = X(v).toFixed(1);
    s += `<line x1="${x}" x2="${x}" y1="${y0 - (big ? 7 : 4)}" y2="${y0 + (big ? 7 : 4)}" stroke="var(--ink)" stroke-width="${Math.abs(v) < 1e-9 ? 2.4 : 1.4}"/>`;
    if (big) s += `<text x="${x}" y="${y0 + 21}" font-size="${o.fs || 10.5}" text-anchor="middle" fill="var(--ink)" font-weight="${Math.abs(v) < 1e-9 ? 700 : 400}">${fmtTick(v)}</text>`;
  }
  arr.forEach((a, r) => {
    const y = 12 + r * 24, x1 = X(a.a), x2 = X(a.b), dir = x2 >= x1 ? 1 : -1, c = a.c || 'var(--ink)';
    if (Math.abs(x2 - x1) > 1) s += `<line x1="${x1.toFixed(1)}" x2="${(x2 - dir * 7).toFixed(1)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M${x2.toFixed(1)} ${y}l${-dir * 9} -6v12z" fill="${c}"/>`;
    s += `<circle cx="${x1.toFixed(1)}" cy="${y}" r="3.5" fill="${c}"/><line x1="${x2.toFixed(1)}" x2="${x2.toFixed(1)}" y1="${y + 4}" y2="${y0 - 2}" stroke="${c}" stroke-dasharray="2 3" opacity=".55"/>`;
    if (a.t) s += `<text x="${((x1 + x2) / 2).toFixed(1)}" y="${y - 5}" font-size="11" font-weight="700" text-anchor="middle" fill="${c}">${a.t}</text>`;
  });
  (o.pts || []).forEach(p => { const x = X(p.x).toFixed(1); s += `<circle cx="${x}" cy="${y0}" r="5.5" fill="${p.c || 'var(--ink)'}" stroke="var(--surf)" stroke-width="1.5"/>`; if (p.t) s += `<text x="${x}" y="${y0 - 10}" font-size="13" font-weight="800" text-anchor="middle" fill="${p.c || 'var(--ink)'}">${p.t}</text>`; });
  const data = arr.map(a => `${a.a}>${a.b}`).join(',');
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line" data-arr="${data}" data-pts="${(o.pts || []).map(p => (p.t || '') + '=' + p.x).join(',')}">${s}</svg>`;
}
/* pick a friendly range and tick for a set of values */
function autoLine(vals, extra){
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); const span = hi - lo || 1;
  const tick = span <= 6 ? .5 : span <= 14 ? 1 : span <= 30 ? 2 : 5, lab = span <= 6 ? 1 : span <= 14 ? 2 : span <= 30 ? 4 : 10;
  lo = Math.floor(lo / lab) * lab - (lo % lab === 0 ? lab : 0); hi = Math.ceil(hi / lab) * lab + (hi % lab === 0 ? lab : 0);
  return Object.assign({min:lo, max:hi, tick, lab}, extra || {});
}

/* ---------- EXACT NUMBERS: every value is a fraction, so answers never round wrong ---------- */
const gcd = (a,b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a,b] = [b, a % b]; return a || 1; };
const lcm = (a,b) => a / gcd(a,b) * b;
const Q = (n, d=1) => { if (d < 0){ n = -n; d = -d; } const g = gcd(n, d); return {n:n/g, d:d/g}; };
const qadd = (a,b) => Q(a.n*b.d + b.n*a.d, a.d*b.d), qneg = a => Q(-a.n, a.d), qsub = (a,b) => qadd(a, qneg(b)), qabs = a => Q(Math.abs(a.n), a.d);
const qv = a => a.n / a.d, qcmp = (a,b) => a.n*b.d - b.n*a.d;

/* a shown number: {q, k}. k is how it is written: 'i' whole number, 'd' decimal, 'f' fraction or mixed number */
const mk = (q, k) => ({q, k});
const fr = (n,d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const mixed = a => { const w = Math.floor(a.n / a.d), r = a.n % a.d; return r ? (w ? w + fr(r, a.d) : fr(r, a.d)) : String(w); };
const mixedTxt = a => { const w = Math.floor(a.n / a.d), r = a.n % a.d; return r ? (w ? `${w} ${r}/${a.d}` : `${r}/${a.d}`) : String(w); };
const decTxt = a => String(Math.round(qv(a) * 10000) / 10000);
const fmt = x => (x.q.n < 0 ? '−' : '') + (x.k === 'f' ? mixed(qabs(x.q)) : decTxt(qabs(x.q)));
const fmtTxt = x => (x.q.n < 0 ? '−' : '') + (x.k === 'f' ? mixedTxt(qabs(x.q)) : decTxt(qabs(x.q)));
const par = x => x.q.n < 0 ? `(${fmt(x)})` : fmt(x);
const kindOf = (...xs) => xs.some(x => x.k === 'f') ? 'f' : xs.some(x => x.k === 'd') ? 'd' : 'i';
const neg = x => mk(qneg(x.q), x.k), size = x => mk(qabs(x.q), x.k);
const plus = (a,b) => mk(qadd(a.q, b.q), kindOf(a,b)), minus = (a,b) => mk(qsub(a.q, b.q), kindOf(a,b));
const isNeg = x => x.q.n < 0;
/* an expression shown big: terms and the operators between them */
const EX = (ts, ops) => `<span class="ex">${ts.map((t,i) => (i ? ` ${ops[i-1]} ` + par(t) : fmt(t))).join('')}</span>`;
/* the decimal too, when a fraction answer has a short one */
const showAns = x => { const t = fmt(x); if (x.k !== 'f' || x.q.d === 1) return t; let d = x.q.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1 ? `${t} (${(x.q.n < 0 ? '−' : '') + decTxt(qabs(x.q))})` : t; };

/* 16 · multiply fractions, decimals and mixed numbers */
function gRat(){
  for (;;){
    const t = pick(['ff','fi','di','dd','mi','mm','three']); let xs, st = 'p';
    if (t === 'ff'){ const b = pick([2,3,4,5,6,8]), d = pick([2,3,4,5,6,8]); xs = [mk(Q(rnd(1,b-1) * sgn(), b),'f'), mk(Q(rnd(1,d-1) * sgn(), d),'f')]; st = pick(['dot','p']); }
    else if (t === 'fi'){ const b = pick([2,3,4,5,6,8]); xs = [mk(Q(rnd(1,b-1) * sgn(), b),'f'), I(pick([b, 2*b, 3*b, rnd(2,12)]) * sgn())]; st = pick(['dot','p']); }
    else if (t === 'di'){ xs = [mk(Q(rnd(2,99) * sgn(), 100),'d'), I(rnd(2,9) * sgn())]; if (xs[0].q.d === 1) continue; }
    else if (t === 'dd'){ xs = [mk(Q(rnd(1,9) * sgn(), 10),'d'), mk(Q(rnd(11,59) * sgn(), 10),'d')]; if (xs[1].q.d === 1) continue; }
    else if (t === 'mi'){ const d = pick([2,3,4,5,8]); xs = [mk(Q((rnd(1,5) * d + rnd(1,d-1)) * sgn(), d),'f'), I(pick([d, 2*d, 4, 6, 8, 12, 20]) * sgn())]; if (Math.random() < .5) xs.reverse(); }
    else if (t === 'mm'){ const b = pick([2,4]), d = pick([2,3,4,5,6]); xs = [mk(Q((rnd(1,3) * b + rnd(1,b-1)) * sgn(), b),'f'), mk(Q((rnd(1,4) * d + rnd(1,d-1)) * sgn(), d),'f')]; }
    else { xs = [I(rnd(2,4) * sgn()), mk(Q(5 * sgn(), 10),'d'), I(rnd(2,6) * sgn())]; st = 'pp'; }
    if (!negs(xs)) continue;
    const v = times(...xs); if ((v.k === 'f' && v.q.d > 60) || Math.abs(qv(v.q)) > 80) continue;
    return NUM({skill:16, title:'Multiply rationals', prompt:`${MXex(xs, st)} = ?`, why:`${signWhy(xs)} Sizes: ${xs.map(x => fmt(size(x))).join(' × ')} = ${fmt(size(v))}. Answer: <b>${showAns(v)}</b>.` + (t === 'mi' || t === 'mm' ? ' Tip: break the mixed number into whole + fraction and distribute.' : '')}, v);
  }
}

/* 17 · dividing integers */
function gDiv(){

  if (r < .7) return NUM({skill:17, title:'Divide', prompt:`${DVex(I(p), I(y))} = ?`, why:`${p < 0 === y < 0 ? 'Same signs → positive' : 'Different signs → negative'}. ${Math.abs(p)} ÷ ${Math.abs(y)} = ${Math.abs(x)}. Check: ${N(y)} × ${x < 0 ? '(' + N(x) + ')' : N(x)} = ${N(p)} ✓. Answer: <b>${N(x)}</b>.`}, I(x));
  if (r < .85){
    const fx = Math.abs(x) === Math.abs(y) ? x + 1 : x; if (!fx) return gDiv();
    const P = fx * y, st = [[`${N(P)} ÷ ${y < 0 ? '(' + N(y) + ')' : N(y)} = ${N(fx)}`, true], [`${N(P)} ÷ ${fx < 0 ? '(' + N(fx) + ')' : N(fx)} = ${N(y)}`, true], [`${N(P)} ÷ ${-y < 0 ? '(' + N(-y) + ')' : N(-y)} = ${N(fx)}`, false], [`${N(-P)} ÷ ${fx < 0 ? '(' + N(fx) + ')' : N(fx)} = ${N(y)}`, false]];
    const o = shuffle([0,1,2,3]);
    return {type:'multi', all:true, skill:17, title:'Fact family', prompt:`<span class="exs">(${N(fx)})(${N(y)}) = ${N(P)}</span>. Which division facts are true? Choose <b>all</b> that apply.`, choices:o.map(i => st[i][0]), correct:o.map((i,j) => st[i][1] ? j : -1).filter(j => j >= 0), pick:1, why:`Undo the multiplication: ${N(P)} ÷ ${N(y)} = ${N(fx)} and ${N(P)} ÷ ${N(fx)} = ${N(y)}. Dividing uses the same sign rules.`, facts:true};
  }
  const k = rnd(2,12);
  if (Math.random() < .5) return shufMC({skill:17, title:'Zero rules', prompt:`What is <span class="ex">0 ÷ (−${k})</span>?`, layout:'g2', why:`0 split into any number of groups is <b>0</b>, because −${k} × 0 = 0.`}, '0', [`−${k}`, `${k}`, 'Undefined']);
  return shufMC({skill:17, title:'Zero rules', prompt:`What is <span class="ex">−${k} ÷ 0</span>?`, layout:'g2', why:`No number times 0 makes −${k}, so dividing by 0 is <b>undefined</b>.`}, 'Undefined', ['0', `−${k}`, `${k}`]);
}

const nz = (lo, hi) => { let v = 0; while (!v) v = rnd(lo, hi) * sgn(); return v; };
const P = v => v < 0 ? `(${N(v)})` : N(v);
const sfr = (n, d, neg) => (neg ? '−' : '') + fr(n, d);

/* bar-notation answer choices for a repeating decimal p/q. Every wrong choice is a different number. */
const val12 = e => { const d = e.pre.slice(); while (d.length < 12 && e.rep.length) d.push(...e.rep); while (d.length < 12) d.push(0); return e.w + '.' + d.slice(0, 12).join(''); };
function barChoices(p, q, neg){
  const e = expand(p, q), right = barTxt(e, neg), rv = val12(e), all = e.pre.concat(e.rep), cands = [];
  const mkc = (w, pre, rep) => ({txt:barTxt({w, pre, rep}, neg), v:val12({w, pre, rep})});
  cands.push(mkc(e.w, [], all));                                                           /* bar over everything */
  let tail = all.slice(); while (tail.length < 4) tail = tail.concat(e.rep);
  cands.push(mkc(e.w, tail.slice(0, 4), []));                                              /* just cut off */
  cands.push(mkc(e.w, e.pre.concat(e.rep.slice(0, -1)), e.rep.slice(-1)));                 /* bar on the last digit only */
  if (e.pre.length) cands.push(mkc(e.w, e.pre.slice(0, -1), [e.pre[e.pre.length - 1]].concat(e.rep))); /* bar starts too early */
  cands.push(mkc(e.w, e.pre, [e.rep[0]]));                                                 /* bar on the first digit only */
  cands.push(mkc(e.w, e.pre.concat(e.rep), []));                                           /* one loop, no bar */
  const wrongs = [], seen = new Set([right]); cands.forEach(c => { if (c.v !== rv && !seen.has(c.txt) && wrongs.length < 3){ seen.add(c.txt); wrongs.push(c.txt); } });
  for (let k = 1; wrongs.length < 3; k++){ const c = mkc(e.w + k, e.pre, e.rep).txt; if (!seen.has(c)){ seen.add(c); wrongs.push(c); } }
  const choices = shuffle([right, ...wrongs]);
  return {choices, answer:choices.indexOf(right), right, e};
}

      why: top ? `What number times 0 makes ${N(n)}? None. Dividing by 0 is <b>undefined</b>.` : `What number times ${P(n)} makes 0? Zero. So 0 ÷ ${P(n)} = <b>0</b>.`});
  }

    const set = shuffle(right).slice(0, 3).map(c => [c, true]).concat(shuffle(wrong).slice(0, 3).map(c => [c, false])), o = shuffle(set);
    return {type:'multi', all:true, skill:21, title:'Choose all', prompt:`Which are equal to ${fr('−' + p, q)}? Choose <b>all</b> that apply.`, choices:o.map(c => c[0]), correct:o.map((c, i) => c[1] ? i : -1).filter(i => i >= 0), pick:1,

  }

/* 22 · fractions and decimals both ways */
const DENS = [2, 4, 5, 8, 10, 16, 20, 25, 40, 50, 60, 80, 100, 125];
function decFrac(p, q){ const g = gcd(p, q), pp = p / g, qq = q / g; let pow = 10; while (pow % qq) pow *= 10; return {pp, qq, k:pow / qq, pow}; }
function gFD(){
  const t = pick([0, 0, 1, 1, 2, 3, 4]), neg = Math.random() < .45;
  if (t === 0){
    const w = Math.random() < .35 ? rnd(1, 9) : 0, n = rnd(1, 99), cent = n % 10 === 0 ? n + 1 : n;
    const x = mk(Q((neg ? -1 : 1) * (w * 100 + cent), 100), 'f'), dec = (neg ? '−' : '') + w + '.' + String(cent).padStart(2, '0');
    return NUM({skill:22, title:'Decimal → fraction', prompt:`Write <b>${dec}</b> as a fraction${w ? ' or mixed number' : ''} in simplest form.`, why:`Say it with place value: ${dec} = ${neg ? '−' : ''}${w ? w : ''}${fr(cent, 100)}. Then cancel shared factors: <b>${showAns(x)}</b>.`}, x);
  }
  if (t === 1 || t === 4){
    let p, q; do { q = pick(DENS); p = rnd(1, q * 2); } while (!stops(q / gcd(p, q)) || p % q === 0);
    const x = mk(Q((neg ? -1 : 1) * p, q), 'd'), d = decFrac(p, q);
    return NUM({skill:22, title:t === 4 ? 'Long division' : 'Fraction → decimal', prompt:`Write ${sfr(p, q, neg)} as a decimal.<div class="hint">${t === 4 ? 'Try long division: ' + p + ' ÷ ' + q + '.' : 'Make the bottom 10, 100 or 1,000.'}</div>`,
      why:(g => `${g > 1 ? fr(p, q) + ' = ' + fr(d.pp, d.qq) + '. ' : ''}${fr(d.pp, d.qq)} = ${fr(d.pp * d.k, d.pow)} (multiply top and bottom by ${d.k}) = <b>${N(qv(x.q))}</b>.`)(gcd(p, q))}, x);
  }
  if (t === 2){
    const qs = [2, 4, 5, 8, 20, 25, 40, 50]; let q = pick(qs), p; do { p = rnd(1, q * 2 - 1); } while (gcd(p, q) !== 1); const d = decFrac(p, q);
    return {type:'num', skill:22, title:'Decimal fraction', prompt:`Write ${fr(p, q)} as a decimal fraction: ${fr(p, q)} = ${fr('□', d.pow)}.`,
      blanks:[{answer:d.k, show:String(d.k), label:'Multiply top and bottom by'}, {answer:p * d.k, show:String(p * d.k), label:'New top number'}],
      why:`${q} × ${d.k} = ${d.pow}. Do the same to the top: ${p} × ${d.k} = ${p * d.k}. So ${fr(p, q)} = ${fr(p * d.k, d.pow)}.`};
  }
  const good = [[1, 2], [3, 4], [7, 8], [9, 20], [11, 25], [3, 16], [7, 40], [13, 50]], bad = [[1, 3], [5, 6], [2, 7], [4, 9], [7, 12], [8, 15], [5, 11], [9, 14], [3, 22]];
  const [gp, gq] = pick(good), ws = shuffle(bad).slice(0, 3), all = shuffle([[gp, gq, true], ...ws.map(([p, q]) => [p, q, false])]);
  return MC({skill:22, title:'Which can be a decimal fraction?', prompt:'Only one of these has a decimal fraction (10, 100, 1,000…) in its family. Which?', choices:all.map(([p, q]) => fr(p, q)), answer:all.findIndex(c => c[2]), layout:'g2',
    why:`Factor the bottoms. ${gq} = ${factorTxt(gq)} has only 2s and 5s, so it can become a power of 10. ${ws.map(([, q]) => q + ' = ' + factorTxt(q)).join(', ')} each have another factor.`});
}

/* 23 · stops or loops, and bar notation */
const LQ = [3, 6, 7, 9, 11, 12, 15, 18, 22, 24, 30, 33, 45, 48, 60, 66, 99], SQ = [2, 4, 5, 8, 10, 16, 20, 25, 40, 50, 80, 125];
function frac(wantStops){
  for (;;){ const q = pick(wantStops ? SQ : LQ), p = rnd(1, q * 2); if (gcd(p, q) === 1 && p !== q && stops(q) === wantStops) return [p, q]; }
}
function gTR(){
  const t = pick([0, 0, 1, 2, 2, 3]);
  if (t === 0){
    const kinds = shuffle([true, true, false, false]), rows = kinds.map(s => { const [p, q] = frac(s), neg = Math.random() < .4; return {h:sfr(p, q, neg), opts:['🛑 Stops', '🔁 Loops'], a:s ? 0 : 1}; });
    return {type:'rows', skill:23, title:'Stops or loops?', prompt:'Does the decimal for each fraction stop (terminate) or loop (repeat)?', rows, why:'Simplify, then factor the bottom. Only 2s and 5s → it <b>stops</b>. Any other prime factor → it <b>loops</b>.'};
  }
  if (t === 1){
    const s = Math.random() < .5, [p, q] = frac(s), f = factorTxt(q), other = f.split(' · ').filter(v => v !== '2' && v !== '5')[0];
    const right = s ? `Stops. ${q} = ${f}, only 2s and 5s.` : `Loops. ${q} = ${f}, and ${other} is not a 2 or a 5.`;
    const wr = s ? ['Loops. Big denominators always loop.', 'Loops. Its denominator is even.', 'Stops. The top is smaller than the bottom.'] : ['Stops. Its denominator is odd.', 'Stops. Every fraction stops eventually.', `Stops. ${q} has a 5 in it.`];
    const all = shuffle([right, ...wr.slice(0, 3)]);
    return MC({skill:23, title:'Explain it', prompt:`Without long division: does ${fr(p, q)} stop or loop?`, choices:all, answer:all.indexOf(right), layout:'big', why:`${q} = ${f}. ${s ? 'Only 2s and 5s, so it stops.' : `${other} is another prime factor, so it loops.`}`});
  }
  if (t === 2){
    let p, q, e; do { [p, q] = frac(false); e = expand(p, q); } while (e.rep.length > 4 || e.pre.length > 2);
    const neg = Math.random() < .4, c = barChoices(p, q, neg);
    return MC({skill:23, title:'Bar notation', prompt:`Write ${sfr(p, q, neg)} as a decimal. Use bar notation.`, choices:c.choices, answer:c.answer, layout:'g2',
      why:`Long division: ${p} ÷ ${q} = ${plainDec({w:e.w, pre:e.pre.concat(e.rep, e.rep), rep:[]}, neg)}… The remainders repeat, so the block <b>${e.rep.join('')}</b> loops: ${c.right}.`});
  }

  return NUM({skill:23, title:'Stops: write it', prompt:`${sfr(p, q, neg)} stops. Write it as a decimal.`, why:`${fr(p, q)}: ${p} ÷ ${q} = <b>${N(qv(x.q))}</b>.`}, x);
}

function battleStage(B, oks, pct){
  const hero = herdHero(), n = oks.length, heroHp = 5;
  const bossSeg = h('div',{html:oneSeg(n)}), heroSeg = h('div',{html:oneSeg(heroHp,'me')});
  const bsEl = h('div',{class:'bs',html:B.art}), hsEl = h('div',{class:'bs',style:'max-width:110px',html:sheepSVG(hero)}), fxt = h('div',{class:'fxt'},'Battle!');
  const stage = h('div',{class:'stage','aria-label':'Battle replay'}, fxt, h('div',{}, hsEl), h('div',{}, bsEl));
  const wrap = h('div',{class:'col'}, stage, h('div',{class:'grid2'}, h('div',{}, h('div',{class:'lbl'},'Your sheep'), heroSeg), h('div',{}, h('div',{class:'lbl'}, B.name), bossSeg)));
  let k = 0, hits = 0, miss = 0;
  const step = () => {
    if (!stage.isConnected) return;
    if (k >= n){ fxt.textContent = pct >= 90 ? 'Victory! 🌟' : pct >= 70 ? 'So close!' : 'Regroup!'; return; }
    const ok = oks[k++], el = ok ? bsEl : hsEl; el.classList.remove('hit', 'lunge'); void el.offsetWidth;
    if (ok){ hits++; bossSeg.querySelectorAll('i')[hits - 1].classList.add('gone'); bsEl.classList.add('hit'); fxt.textContent = pick(['Baa-bam!', 'Direct hit!', 'Wool power!', 'Nice one!']); }
    else { miss++; if (miss <= heroHp) heroSeg.querySelectorAll('i')[miss - 1].classList.add('gone'); hsEl.classList.add('hit'); bsEl.classList.add('lunge'); fxt.textContent = pick(['Ouch!', 'Dodge!', 'He hit back!']); }
    setTimeout(step, 420);
  };
  setTimeout(step, 300);
  return wrap;
}

/* ---- daily care, streaks, hay ---- */
function dailyCheck(){
  const f = S.fl, t = dayStr(); if (f.day === t) return;
  const gap = Math.max(1, dayGap(f.day, t));
  const happy = f.fed >= 50 && f.water >= 50;
  f.fed = clamp(f.fed - 20 * gap, 0, 100); f.water = clamp(f.water - 25 * gap, 0, 100);
  f.hay = Math.min(30, f.hay + 3 + (happy && gap === 1 ? 2 : 0)); f.day = t; save();
  toast(happy && gap === 1 ? 'Happy herd! +5 free hay 🌾' : 'Daily hay delivered: +3 🌾');
}
HOOKS.xp.push(n => {
  const f = S.fl; if (!f) return; const t = dayStr();
  f.xpAcc += n; while (f.xpAcc >= 20){ f.xpAcc -= 20; f.hay = Math.min(30, f.hay + 1); }
  if (f.lastPrac !== t){ f.streak = f.lastPrac && dayGap(f.lastPrac, t) === 1 ? f.streak + 1 : 1; f.lastPrac = t;
    if (f.streak % 3 === 0){ f.hay = Math.min(30, f.hay + 5); setTimeout(() => toast(`${f.streak}-day streak! +5 hay 🔥`), 900); } }
  const prev = f.wearSeen || 0; const now = wearOpen(S.xp).length + DECOR.filter(d => S.xp >= d[0]).length;
  if (now > prev && prev){ setTimeout(() => toast('New reward unlocked! See Progress 🎁'), 1500); } f.wearSeen = now; save();
});
