<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2nd grade · Math">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meow Math">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15241C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Meow Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a calm sapphire-blue room with soft star sparkles. A rounded blue header (name, star count, her first kitten), one white card at a time, big thumb-size buttons, five tabs at the bottom. Drawing marks look like pencil; red means "too many", green means "missing". The Litter is a little room where her kittens wander, nap, play and eat. */
:root{
  --bg:#3552A3; --bg2:#2A4389; --chrome:#24397A; --chrome-ink:#F3F6FF; --chrome-mut:#B9C6F0;
  --surf:#FFFFFF; --soft:#EEF2FF; --cell:#F6F8FF; --line:#D5DDF7; --ink:#1D2752; --mut:#5C6896;
  --pink:#F48FBF; --pinkt:#FDE6F1; --gold:#FFCF5A; --sky:#7FA6F5;
  --h100:#E9E3FB; --h10:#FCE4EF; --h1:#E2F0FB;
  --pencil:#2B3463; --ok:#1E9A55; --okt:#DDF5E7; --no:#D93A4A; --not:#FDE3E5; --shadow:rgba(14,24,62,.22);
  --wall:#DCE6FF; --floor:#F3E3CF; --trim:#B9C8F2; --brw:#C9A27F;
  --fd:'Fredoka',ui-rounded,system-ui,sans-serif; --fb:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#152049; --bg2:#0F183A; --chrome:#1B2858; --chrome-ink:#EEF2FF; --chrome-mut:#9FB0E3;
  --surf:#1E2A5A; --soft:#26346B; --cell:#22305F; --line:#34447E; --ink:#EEF2FF; --mut:#A9B6E3;
  --pink:#F49BC6; --pinkt:#4A2340; --gold:#FFD36B; --sky:#8FB2FA;
  --h100:#2C2F6A; --h10:#3A2A55; --h1:#203F63;
  --pencil:#E6EBFF; --ok:#5ED394; --okt:#173D2B; --no:#FF7A86; --not:#4A1F28; --shadow:rgba(0,0,0,.4); --wall:#2A3A73; --floor:#3A3150; --trim:#3D4F8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#152049; --bg2:#0F183A; --chrome:#1B2858; --chrome-ink:#EEF2FF; --chrome-mut:#9FB0E3;
  --surf:#1E2A5A; --soft:#26346B; --cell:#22305F; --line:#34447E; --ink:#EEF2FF; --mut:#A9B6E3;
  --pink:#F49BC6; --pinkt:#4A2340; --gold:#FFD36B; --sky:#8FB2FA;
  --h100:#2C2F6A; --h10:#3A2A55; --h1:#203F63;
  --pencil:#E6EBFF; --ok:#5ED394; --okt:#173D2B; --no:#FF7A86; --not:#4A1F28; --shadow:rgba(0,0,0,.4); --wall:#2A3A73; --floor:#3A3150; --trim:#3D4F8F; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:700 17px/1.4 var(--fb);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(3px 3px at 12% 18%,rgba(255,255,255,.55),transparent 60%),radial-gradient(2px 2px at 78% 12%,rgba(255,255,255,.5),transparent 60%),radial-gradient(2.5px 2.5px at 88% 46%,rgba(255,255,255,.45),transparent 60%),radial-gradient(2px 2px at 22% 64%,rgba(255,255,255,.4),transparent 60%),radial-gradient(3px 3px at 60% 82%,rgba(255,255,255,.4),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:0 -16px 14px;padding:10px 16px;display:flex;align-items:center;gap:10px;background:var(--chrome);color:var(--chrome-ink);border-radius:0 0 22px 22px;box-shadow:0 4px 14px var(--shadow)}
.top .kick{font:700 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--chrome-mut)}
.top h1{margin:0;font:700 27px/1 var(--fd);letter-spacing:.01em}
.top h1 b{color:var(--pink);font-weight:700}
.top .grow{flex:1;min-width:0}
.stars{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font:700 20px var(--fd)}
.stars i{font-style:normal}
.stars.bump{animation:starBump .5s ease-out}
@keyframes starBump{0%{transform:scale(1)}25%{transform:scale(1.3) rotate(-6deg)}50%{transform:scale(1.2) rotate(6deg)}75%{transform:scale(1.1) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.star-fly{position:fixed;left:50%;top:50%;font-size:64px;line-height:1;z-index:9999;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.3);transition:transform .38s cubic-bezier(.2,1.4,.4,1),opacity .2s}
@media (max-width:400px){.top{gap:7px}.top h1{font-size:23px}.stars{font-size:17px;padding:5px 9px}}
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.shopc{margin:0;padding:12px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.shopart{height:112px;display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:14px;overflow:hidden}
.shopc .btn{min-height:46px;font-size:19px}
.shopc.owned{opacity:.8}
.sc-body{display:flex;gap:10px;align-items:flex-start}
.sc-list{width:58px;flex:none;display:flex;flex-direction:column;text-align:center;padding:4px 0;border-right:2px dashed var(--line)}
.sc-li{font:700 18px/1.55 var(--fd);color:var(--mut)}
.sc-li.new{color:var(--pink);font-weight:800;animation:numPop .4s ease-out}
.sc-main{flex:1;min-width:0}
.sc-flash{animation:scFlash 1s ease-out}
@keyframes scFlash{0%,100%{background:var(--surf);box-shadow:0 6px 18px var(--shadow)}25%,65%{background:var(--okt);box-shadow:0 0 0 5px var(--ok)}}
.pet{width:46px;height:46px;flex:none;border-radius:50%;border:2px dashed var(--chrome-mut);background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0}
.pet svg{width:34px;height:34px}
.pet.has{border-style:solid;border-color:var(--pink);background:var(--surf);overflow:hidden}
.pet.has svg{width:44px;height:44px;margin-top:6px}

/* cards and buttons */
.card{background:var(--surf);border-radius:22px;padding:16px;box-shadow:0 6px 18px var(--shadow);margin-bottom:14px}
h2{margin:0 0 4px;font:600 22px var(--fd)}
.hint{color:var(--mut);font-weight:700;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:18px;background:var(--pink);color:#2A1030;font:600 22px var(--fd);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;min-height:46px;font-size:18px;width:auto;padding:0 16px}
.skill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surf);border-radius:22px;padding:16px;box-shadow:0 6px 18px var(--shadow);margin-bottom:12px}
.skill .ico{width:62px;height:62px;flex:none;border-radius:18px;background:var(--pinkt);display:grid;place-items:center;font-size:34px}
.skill b{display:block;font:600 22px var(--fd)}
.skill .go{margin-left:auto;font:700 26px var(--fd);color:var(--pink)}
.soon{text-align:center;padding:28px 16px}
.soon .big{font-size:56px;line-height:1.1}

/* the place value chart */
.eq{text-align:center;font:600 38px/1.1 var(--fd);margin:0 0 10px;letter-spacing:.02em}
.eq span{color:var(--pink)}
.pv{display:grid;grid-template-columns:58px repeat(3,1fr) 46px;gap:6px;align-items:stretch}
.pv .hd{text-align:center;font:600 18px var(--fd);color:var(--mut);padding:2px 0}
.pv .num{display:grid;place-items:center;font:600 22px var(--fd);border-radius:14px;background:var(--soft)}
.cell{min-height:80px;border:2px solid var(--line);border-radius:14px;padding:4px 2px;display:grid;place-items:center}
.cell.c100{background:var(--h100)}.cell.c10{background:var(--h10)}.cell.c1{background:var(--h1)}
.cell:active{filter:brightness(.95)}
.cell svg{width:100%;height:58px;display:block}
.cell.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.cell.fix{border-color:var(--no)}
.erase{border:0;border-radius:14px;background:var(--soft);display:grid;place-items:center;padding:0}
.erase svg{width:28px;height:28px}
.legend{display:flex;justify-content:center;gap:16px;font-size:14px;color:var(--mut);margin-top:6px}
.legend b{font-weight:800}
.banner{margin:10px 0 0;padding:8px 10px;border-radius:16px;text-align:center;font:600 19px var(--fd)}
.banner.good{background:var(--okt);color:var(--ok)}
.banner.bad{background:var(--not);color:var(--no)}
.acts{margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}

/* bottom tabs (6 tabs) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--chrome);border-radius:22px 22px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px var(--shadow)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;border-radius:14px;font-size:11px;font-weight:800;color:var(--chrome-mut)}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--chrome-ink);background:rgba(255,255,255,.12)}
nav button.on svg{stroke:var(--pink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--surf);padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
/* the litter: a little room for her kittens */
.house-vp{position:relative;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;border-radius:22px;box-shadow:0 6px 18px var(--shadow);margin-bottom:10px;scrollbar-width:none;overscroll-behavior-x:contain}
.house-vp::-webkit-scrollbar{display:none}
.room{position:relative;display:flex;height:262px;background:linear-gradient(180deg,var(--wall) 0 104px,var(--floor) 104px);user-select:none;-webkit-user-select:none}
.room .rm{flex:1;position:relative;scroll-snap-align:start;height:100%}
.room .rm+.rm{border-left:6px solid var(--trim)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.chipb.tool{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 6px;font-size:16px}
.house-vp.decor-on .it{outline:2px dashed var(--pink);outline-offset:3px;cursor:grab;touch-action:none}
.house-vp .it.drag{cursor:grabbing;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.house-vp.decor-on .cat,.house-vp.laser-on .cat{pointer-events:none}
.house-vp.laser-on{touch-action:none;cursor:crosshair}
.cat.chase{transition:left .7s ease-out,top .7s ease-out}
.laser{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#FF2D3D;box-shadow:0 0 12px 6px rgba(255,45,61,.55);z-index:500;pointer-events:none}
.ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid var(--gold);z-index:5;pointer-events:none;animation:ripple .9s ease-out forwards}
@keyframes ripple{to{transform:scale(7);opacity:0}}
.room .base{position:absolute;left:0;right:0;top:100px;height:8px;background:var(--trim)}
.room .win{position:absolute;left:7%;top:16px;width:74px;height:58px;border-radius:10px;background:linear-gradient(180deg,#9CC7FF,#D9ECFF);border:5px solid var(--surf);box-shadow:0 2px 0 var(--trim)}
.room .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--surf)}
.room .it{position:absolute;line-height:1;z-index:2}
.room .it svg{display:block}
.room .emo{font-size:34px}
.room .fly{animation:flutter 2.4s ease-in-out infinite alternate}
@keyframes flutter{to{transform:translate(10px,-8px) rotate(8deg)}}
.cat{position:absolute;width:60px;height:60px;transition:left 2.2s ease-in-out,top 2.2s ease-in-out;padding:0;border:0;background:none}
.cat .in{width:100%;height:100%;transform-origin:50% 100%}
.cat.flip .in{transform:scaleX(-1)}
.cat svg{width:100%;height:100%;display:block;overflow:visible}
.cat.walk svg{animation:hop .3s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-3px) rotate(2deg)}}
.cat .tl{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.5s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.cat .shut{display:none}.cat.sleep .eyes{display:none}.cat.sleep .shut{display:inline}
.cat.purr svg{animation:purr .1s linear 10}
@keyframes purr{50%{transform:translateX(1.5px)}}
.cat.jump svg{animation:jump .6s ease-out}
@keyframes jump{40%{transform:translateY(-16px)}}
.cat .tag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font:800 11px/1.4 var(--fb);background:var(--surf);color:var(--ink);border-radius:999px;padding:0 7px;white-space:nowrap;box-shadow:0 1px 3px var(--shadow)}
.cat.sel .tag{background:var(--pink);color:#2A1030}
.bub{position:absolute;top:-18px;left:50%;font-size:20px;pointer-events:none;animation:float 1.8s ease-out forwards;white-space:nowrap}
@keyframes float{from{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-22px)}}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dock .btn{min-height:54px;font-size:19px}
.dock .btn[disabled]{opacity:.5;box-shadow:none}
.dress{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipb{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--soft);font:700 16px var(--fb);color:var(--ink)}
.chipb.on{background:var(--pinkt);border-color:var(--pink)}
.bar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--pink))}
.rw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rw div{border-radius:14px;background:var(--soft);padding:8px 2px 6px;text-align:center;font:700 11px/1.2 var(--fb);color:var(--mut)}
.rw div b{display:block;font-size:26px;line-height:1.2;filter:grayscale(1);opacity:.45}
.rw div.got{background:var(--pinkt);color:var(--ink)}.rw div.got b{filter:none;opacity:1}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(10,16,40,.55);display:grid;place-items:center;padding:20px}
.sheet{width:100%;max-width:360px;text-align:center;margin:0;animation:pop .3s ease-out}
.sheet .art{width:120px;height:120px;margin:0 auto 4px}
.sheet .art svg{width:100%;height:100%}
.sheet input{width:100%;min-height:54px;margin:12px 0;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font:600 24px var(--fd);text-align:center;padding:0 12px}
.sheet input:focus{outline:none;border-color:var(--pink)}
@media (prefers-reduced-motion:reduce){.cat,.cat .tl,.cat.walk svg,.room .fly,.bub{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:360px){.eq{font-size:34px}.pv{grid-template-columns:50px repeat(3,1fr) 42px}}
/* club tab */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:28px 40px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:16px;background:var(--soft)}
.lb-row.me{background:var(--pinkt)}
.lb-row .rnk{font:800 15px var(--fd);color:var(--mut);text-align:center}
.lb-row .nm{font:700 15px/1.2 var(--fb);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sc{font:800 17px var(--fd);color:var(--gold);text-shadow:0 1px 3px var(--shadow);white-space:nowrap}
.lb-row .bd{font-size:13px;color:var(--mut)}
.lb-pin{margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.toggle-row{display:flex;gap:6px;margin-bottom:10px}
.toggle-row button{flex:1;min-height:40px;border:2px solid var(--line);border-radius:12px;background:var(--soft);font:700 15px var(--fb);color:var(--ink)}
.toggle-row button.on{background:var(--pink);border-color:var(--pink);color:#2A1030}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{min-height:52px;border:0;border-radius:14px;background:var(--soft);font:700 22px var(--fd);color:var(--ink)}
.keypad button:active{background:var(--pinkt)}
.code-display{font:800 32px var(--fd);letter-spacing:.15em;text-align:center;padding:10px;border-radius:16px;background:var(--soft);min-height:54px;margin:10px 0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:4px;vertical-align:middle}
.sync-dot.pending{background:var(--gold);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.4}}
.hint-pulse{animation:hintGlow .55s ease-in-out infinite alternate!important}
@keyframes hintGlow{to{box-shadow:0 0 0 7px rgba(244,143,191,.65);transform:scale(1.08)}}
nav button{font-size:10px}
/* answer blank → digit reveal */
.ans-box{display:flex;justify-content:center;gap:10px;margin:12px 0 0;padding:8px 0}
.ans-dig{text-align:center;min-width:52px}
.ans-slot{height:48px;min-width:52px;display:flex;align-items:flex-end;justify-content:center;font:800 36px/1 var(--fd);border-bottom:3px solid var(--line);padding:0 6px;color:var(--ink);transition:border-color .3s}
.ans-slot.on{border-color:var(--ok);color:var(--ok)}
.ans-lab{font:600 12px var(--fd);color:var(--mut);margin-top:3px;text-align:center}
.ans-num{display:inline-block}
.ans-num.pop{animation:numPop .4s ease-out}
@keyframes numPop{0%{transform:scale(.4) translateY(14px);opacity:0}70%{transform:scale(1.12) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
/* sum row */
.pv-sep{grid-column:1/-1;height:2px;background:var(--line);border-radius:2px;margin:4px 0}
.cell.sum{min-height:60px;border-style:dashed;opacity:0;transition:opacity .4s}
.cell.sum.in{opacity:1}
.carry-badge{font:800 11px var(--fd);color:var(--gold);text-align:center;min-height:14px;line-height:1.3}
/* skill categories */
.skill-cat{font:700 12px var(--fb);color:var(--chrome-mut);text-transform:uppercase;letter-spacing:.08em;margin:8px 4px 2px}
/* skip counting — speed round */
.sc-choice{flex:1;max-width:118px;min-width:0;height:94px;border:4px solid var(--line);border-radius:22px;background:var(--soft);font:800 40px/1 var(--fd);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.sc-choice:active{background:var(--pinkt);border-color:var(--pink)}
.sc-celeb{position:relative;height:52px;overflow:visible;pointer-events:none}
.sc-float{position:absolute;left:50%;transform:translateX(-50%);font-size:44px;line-height:1;animation:floatUp .85s ease-out forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-64px)}}
/* number sense — SVG branching tree (addition) */
.ns2-row{display:flex;justify-content:center;align-items:center;gap:10px;min-height:60px;margin:2px 0}
.ns2-root{min-width:72px;padding:0 12px;height:56px;border:3px solid var(--line);border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--fd);cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
.ns2-root.open{border-color:var(--ok);background:var(--okt);cursor:default}
.ns2-op{font:800 28px/1 var(--fd);color:var(--mut);padding:0 4px}
.ns2-leaves{display:flex;gap:6px}
.ns2-leaf{min-width:46px;height:48px;border:3px solid var(--line);border-radius:14px;background:var(--cell);display:flex;align-items:center;justify-content:center;font:800 22px/1 var(--fd);padding:0 4px;cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
.ns2-leaf.tens{border-color:var(--ok);color:var(--ok)}
.ns2-leaf.ones{border-color:#a855f7;color:#a855f7}
.ns2-leaf.sel{background:var(--pinkt);border-color:var(--pink);color:var(--ink)}
.ns2-leaf.paired{opacity:.38;cursor:default}
.ns2-leaf.auto{cursor:default;border-style:dashed;border-color:var(--pink);background:var(--pinkt);color:var(--pink)}
.ns2-sum{font:700 17px/1.4 var(--fd);padding:5px 9px;border-radius:12px;cursor:default;border-bottom:3px solid currentColor;user-select:none;transition:opacity .4s;white-space:nowrap}
.ns2-sum.tens{color:var(--ok)}
.ns2-sum.ones{color:#a855f7}
.ns2-sum.ready{cursor:pointer}
.ns2-sum.tapped{opacity:.42;cursor:default}
.ns2-final{font:800 36px/1 var(--fd);text-align:center;border-radius:18px;border:3px solid var(--ok);background:var(--okt);color:var(--ok);padding:12px 24px;transition:opacity .5s}
/* number sense — subtraction variant */
.ns-trees{display:flex;gap:16px;justify-content:center;align-items:flex-start;margin:12px 0}
.ns-root{min-height:56px;border:3px solid var(--line);border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font:800 30px/1 var(--fd);cursor:pointer;transition:border-color .25s,background .25s;user-select:none;padding:0 12px}
.ns-root.ready{border-color:var(--gold);background:var(--pinkt)}
.ns-root.open{border-color:var(--ok);background:var(--okt);cursor:default}
.ns-branches{display:flex;gap:6px}
.ns-leaf{min-width:52px;min-height:52px;border:3px solid var(--line);border-radius:14px;background:var(--cell);display:flex;align-items:center;justify-content:center;font:800 22px/1 var(--fd);padding:0 6px;cursor:pointer;transition:border-color .2s,background .2s;user-select:none}
.ns-leaf.sel{border-color:var(--pink);background:var(--pinkt)}
.ns-leaf.conflict{border-color:var(--gold);animation:pulse 1s ease-in-out infinite alternate}
.ns-sub-min{text-align:center;font:800 50px/1 var(--fd);flex:1;padding-top:6px}
.ns-steps{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.ns-step{display:flex;align-items:center;justify-content:center;gap:8px;font:700 22px/1.3 var(--fd);opacity:0;transition:opacity .4s}
.ns-step.show{opacity:1}
.ns-step b{color:var(--no)}.ns-step i{font-style:normal;color:var(--ok);font-weight:800}
/* nsSub — expansion + boss battle */
.ns-ones-badge{display:inline-block;font:700 18px var(--fb);text-align:center;margin-top:4px;padding:2px 10px;border-radius:8px;border:2px dashed var(--line);min-width:30px}
.ns-drop-line{width:3px;height:22px;margin:0 auto;background:repeating-linear-gradient(to bottom,var(--mut) 0,var(--mut) 5px,transparent 5px,transparent 10px)}
.ns2-leaf.blink,.ns-ones-badge.blink{animation:blinkAmber .55s ease-in-out infinite alternate;border-color:var(--gold);color:var(--gold)}
.ns2-leaf.blink-green,.ns-ones-badge.blink-green{animation:blinkGreen .55s ease-in-out infinite alternate;border-color:var(--ok);color:var(--ok)}
@keyframes blinkAmber{0%{opacity:1}100%{opacity:.25}}
@keyframes blinkGreen{0%{background:var(--cell)}100%{background:var(--okt)}}
.ns-boss-num{font:800 60px/1 var(--fd);display:inline-block;padding:8px 20px;border:4px solid var(--pink);border-radius:24px;background:var(--soft);min-width:110px;text-align:center;margin-bottom:12px}
.ns-boss-num.hurt{animation:bossHurt .35s ease-out}
@keyframes bossHurt{0%,100%{transform:scale(1)}35%{transform:scale(1.12)}70%{transform:scale(0.94)}}
.ns-boss-num.sm{font-size:44px;padding:6px 12px;min-width:0;margin-bottom:0}
.ns-row2{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.ns-row2 .ns-attacker{min-width:46px;height:50px;font-size:22px;padding:0 6px;cursor:default}
.ns-row2 .ns-attacker.ready{cursor:pointer}
.ns-dig{display:inline-block;border-radius:8px}
.ns-dig.blink,.ns-attacker.blink{animation:blinkAmber .55s ease-in-out infinite alternate;border-color:var(--gold);color:#E08A00}
.ns-dig.blink-green,.ns-attacker.blink-green{animation:blinkGreen .55s ease-in-out infinite alternate;border-color:var(--ok);color:var(--ok)}
.ns-attack-row{display:flex;justify-content:center;gap:12px;margin:4px 0}
.ns-attacker{min-width:56px;height:56px;border:3px solid var(--line);border-radius:14px;background:var(--cell);display:flex;align-items:center;justify-content:center;font:800 24px/1 var(--fd);user-select:none}
.ns-attacker.ready{border-color:var(--ok);background:var(--okt);cursor:pointer;animation:pulse .7s ease-in-out infinite alternate}
.ns-attacker.waiting{opacity:.3;cursor:default;pointer-events:none}
.ns-hit-label{position:absolute;font:800 30px/1 var(--fd);color:var(--no);transform:translateX(-50%);pointer-events:none;animation:hitFloat .95s ease-out forwards;z-index:20}
@keyframes hitFloat{0%{opacity:1;transform:translateX(-50%) translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-58px)}}

<body>


<div class="app">
  <header class="top">
    <div class="grow"><div class="kick">Grade 2 · Math</div><h1>Meow <b>Math</b></h1></div>
    <div class="stars" id="starBox" aria-label="Stars"><i>⭐</i><span id="starN">0</span></div>
    <div class="stars" id="fishBox" aria-label="Fish"><i>🐟</i><span id="fishN">0</span></div>
    <button class="pet" id="petSlot" aria-label="My kittens"></button>
  </header>
  <main id="view"></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheetwrap" hidden><div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>

<script>
(() => {
'use strict';
/* ---------- cloud config (inlined by build.sh) ---------- */
const __CFG__ = {"apiUrl": "https://ye4s7c5kf8.execute-api.us-west-2.amazonaws.com", "userPoolId": "us-west-2_LuiGQus4J", "clientId": "4tuo3rkbgh9rh0da2qtmeck9bc", "region": "us-west-2"};
const CLOUD_ACTIVE = !!((__CFG__.apiUrl||'') && (__CFG__.userPoolId||'') && (__CFG__.clientId||''));
const CLOUD_API = __CFG__.apiUrl || null;
const CLOUD_REGION = __CFG__.region || null;
const CLOUD_POOL = __CFG__.userPoolId || null;
const CLOUD_CLIENT = __CFG__.clientId || null;

/* ---------- saved progress (on this phone only) ---------- */
const KEY = 'kitty-math-g2-v1';
const fresh = () => ({tab:'learn', stars:0, solved:0, pv:{i:0, cur:null}, pvs:{i:0, cur:null}, skip:{i:0, cur:null}, ns:{i:0, cur:null}, nss:{i:0, cur:null}, deco:{}, fish:0, shop:{}, run:0, area:{}, catAreas:[], cats:[], got:0, sel:0, food:0, treats:0, water:0, streak:0, day:''});
let S = fresh();
// Initial state loaded from KEY; if signed in, overwritten below after syncMeta is restored
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(fresh(), s); } catch (e) {}
let _hintTimer=null;
const _ch=()=>{clearTimeout(_hintTimer);document.querySelectorAll('.hint-pulse').forEach(e=>e.classList.remove('hint-pulse'));};
const _sh=()=>{_hintTimer=setTimeout(()=>document.querySelectorAll('.hint-target').forEach(e=>e.classList.add('hint-pulse')),2000);};
function markNext(...els){_ch();document.querySelectorAll('.hint-target').forEach(e=>e.classList.remove('hint-target'));els.forEach(e=>e&&e.classList.add('hint-target'));_sh();}
document.addEventListener('click',()=>{_ch();_sh();},true);
/* ---------- per-player localStorage key ---------- */
let activeKey = KEY; // updated after sign-in
const loadState = k => {
  try { const s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && typeof s === 'object') return s; } catch (e) {}
  return null;
};

const save = () => { try { localStorage.setItem(activeKey, JSON.stringify(S)); } catch (e) {} syncSoon(); };

/* ---------- CLOUD: auth + sync (inert when CLOUD_ACTIVE is false) ---------- */
const SYNC_KEY = 'meow-sync-v1';
let syncMeta = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null') || {}; } catch (e) { return {}; } })();
const saveSyncMeta = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncMeta)); } catch (e) {} };

const cognitoUrl = () => `https://cognito-idp.${CLOUD_REGION}.amazonaws.com/`;
async function cognitoCall(target, body) {
  const r = await fetch(cognitoUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-amz-json-1.1', 'X-Amz-Target': `AWSCognitoIdentityProviderService.${target}` },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw Object.assign(new Error(data.message || target), { code: data.__type || 'Error' });
  return data;
}

function clientMerge(remote) {
  /* mirrors the server merge.ts logic */
  const L = S, R = remote;
  const stars = Math.max(L.stars, R.stars), solved = Math.max(L.solved, R.solved), got = Math.max(L.got, R.got);
  const area = { ...L.area }; for (const [k, v] of Object.entries(R.area || {})) area[k] = Math.max(area[k] || 0, v);
  const catAreas = [...new Set([...(L.catAreas || []), ...(R.catAreas || [])])];
  const len = Math.max((L.cats || []).length, (R.cats || []).length);
  const cats = Array.from({ length: len }, (_, i) => {
    const lc = (L.cats || [])[i], rc = (R.cats || [])[i];
    if (!lc) return { ...rc }; if (!rc) return { ...lc };
    return { name: lc.name || rc.name, coat: lc.coat, wear: [...new Set([...(lc.wear || []), ...(rc.wear || [])])] };
  });
  const useR = !L.day || R.day > L.day;
  const streak = useR ? R.streak : L.streak, day = useR ? R.day : L.day;
  const useCareR = !L._updatedAt || (R._updatedAt && R._updatedAt > L._updatedAt);
  const food = useCareR ? R.food : L.food, treats = useCareR ? R.treats : L.treats, water = useCareR ? R.water : L.water;
  return { ...L, stars, solved, area, catAreas, cats, got, streak, day, food, treats, water };
}

let syncTimer = null, syncDirty = false;
function syncSoon() {
  if (!CLOUD_ACTIVE || !syncMeta.playerId) return;
  syncDirty = true; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 3000);
}
async function syncNow() {
  if (!CLOUD_ACTIVE || !syncMeta.playerId) return;
  const tok = await CLOUD.getToken(); if (!tok) return;
  const { stars, solved, area, catAreas, cats, got, food, treats, water, streak, day } = S;
  const doc = { stars, solved, area, catAreas, cats, got, food, treats, water, streak, day };
  try {
    const r = await fetch(`${CLOUD_API}/v1/players/${syncMeta.playerId}/progress`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` },
      body: JSON.stringify({ doc, baseRev: syncMeta.rev || 0 }),
    });
    if (r.ok) {
      const data = await r.json();
      syncMeta.rev = data.rev; saveSyncMeta();
      const merged = clientMerge(data.doc);
      Object.assign(S, merged); S._updatedAt = data.doc._updatedAt || new Date().toISOString();
      grant(); try { localStorage.setItem(activeKey, JSON.stringify(S)); } catch (e) {}
      syncDirty = false; paintStars(); paintPet(); paintSyncDot();
    } else if (r.status === 401) { await CLOUD.refresh(); }
  } catch (e) { /* offline — will retry on next save */ }
}
function paintSyncDot() {
  const d = document.getElementById('syncDot'); if (!d) return;
  d.className = 'sync-dot' + (syncDirty ? ' pending' : '');
}

const CLOUD = {
  get idToken()      { return syncMeta.idToken || null; },
  get refreshTok()   { return syncMeta.refreshToken || null; },
  get playerId()     { return syncMeta.playerId || null; },
  get signedIn()     { return !!(syncMeta.idToken && syncMeta.playerId); },

  async getToken() {
    if (!syncMeta.idToken) return null;
    // ID tokens last 1 hour; refresh if within 2 min of expiry
    if (syncMeta.idTokenExp && Date.now() / 1000 > syncMeta.idTokenExp - 120) {
      return await this.refresh();
    }
    return syncMeta.idToken;
  },

  async refresh() {
    if (!syncMeta.refreshToken) return null;
    try {
      const d = await cognitoCall('InitiateAuth', {
        AuthFlow: 'REFRESH_TOKEN_AUTH', ClientId: CLOUD_CLIENT,
        AuthParameters: { REFRESH_TOKEN: syncMeta.refreshToken },
      });
      const ar = d.AuthenticationResult;
      syncMeta.idToken = ar.IdToken; syncMeta.idTokenExp = ar.ExpiresIn ? Date.now() / 1000 + ar.ExpiresIn : 0;
      saveSyncMeta(); return syncMeta.idToken;
    } catch (e) { syncMeta.idToken = null; saveSyncMeta(); return null; }
  },

  async signIn(email, password) {
    const d = await cognitoCall('InitiateAuth', {
      AuthFlow: 'USER_PASSWORD_AUTH', ClientId: CLOUD_CLIENT,
      AuthParameters: { USERNAME: email, PASSWORD: password },
    });
    const ar = d.AuthenticationResult;
    syncMeta.idToken = ar.IdToken; syncMeta.refreshToken = ar.RefreshToken;
    syncMeta.idTokenExp = ar.ExpiresIn ? Date.now() / 1000 + ar.ExpiresIn : 0;
    saveSyncMeta();
    return ar;
  },

  async signUp(email, password) {
    return cognitoCall('SignUp', { ClientId: CLOUD_CLIENT, Username: email, Password: password });
  },

  async confirmSignUp(email, code) {
    return cognitoCall('ConfirmSignUp', { ClientId: CLOUD_CLIENT, Username: email, ConfirmationCode: code });
  },

  async forgotPassword(email) {
    return cognitoCall('ForgotPassword', { ClientId: CLOUD_CLIENT, Username: email });
  },

  async confirmForgotPassword(email, code, password) {
    return cognitoCall('ConfirmForgotPassword', { ClientId: CLOUD_CLIENT, Username: email, ConfirmationCode: code, Password: password });
  },

  async listPlayers() {
    const tok = await this.getToken(); if (!tok) return [];
    const r = await fetch(`${CLOUD_API}/v1/players`, { headers: { Authorization: `Bearer ${tok}` } });
    if (!r.ok) return []; const d = await r.json(); return d.players || [];
  },

  async createPlayer() {
    const tok = await this.getToken(); if (!tok) throw new Error('not_signed_in');
    const r = await fetch(`${CLOUD_API}/v1/players`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` }, body: '{}',
    });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'create_player_failed'); }
    return r.json();
  },

  async linkPlayer(pid) {
    // Set the active player and upload current local progress
    const oldKey = activeKey;
    activeKey = pid === '__local__' ? KEY : `${KEY}:${pid}`;
    syncMeta.playerId = pid === '__local__' ? null : pid; saveSyncMeta();
    if (pid !== '__local__') {
      // Upload existing local save (merge will keep the best)
      await syncNow();
    } else {
      // Load from local key
      const saved = loadState(activeKey); if (saved) Object.assign(S, saved);
      grant(); paintStars(); paintPet();
    }
  },

  signOut() {
    syncMeta = {}; saveSyncMeta();
    activeKey = KEY;
    const saved = loadState(KEY); if (saved) { Object.assign(S, fresh()); Object.assign(S, saved); }
    grant(); paintStars(); paintPet(); go('club');
  },

  async deleteAccount() {
    const tok = await this.getToken(); if (!tok) throw new Error('not_signed_in');
    const r = await fetch(`${CLOUD_API}/v1/account`, { method: 'DELETE', headers: { Authorization: `Bearer ${tok}` } });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'delete_failed'); }
    this.signOut();
  },

  async listClubs(pid) {
    const tok = await this.getToken(); if (!tok) return [];
    const r = await fetch(`${CLOUD_API}/v1/players/${pid}/clubs`, { headers: { Authorization: `Bearer ${tok}` } });
    if (!r.ok) return []; const d = await r.json(); return d.clubs || [];
  },

  async createClub(name) {
    const tok = await this.getToken(); if (!tok) throw new Error('not_signed_in');
    const r = await fetch(`${CLOUD_API}/v1/clubs`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` },
      body: JSON.stringify({ name }),
    });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'create_failed'); }
    return r.json();
  },

  async joinClub(code, pid) {
    const tok = await this.getToken(); if (!tok) throw new Error('not_signed_in');
    const r = await fetch(`${CLOUD_API}/v1/clubs/join`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` },
      body: JSON.stringify({ inviteCode: code.toUpperCase(), playerId: pid }),
    });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'join_failed'); }
    return r.json();
  },

  async leaveClub(clubId, pid) {
    const tok = await this.getToken(); if (!tok) throw new Error('not_signed_in');
    const r = await fetch(`${CLOUD_API}/v1/clubs/${clubId}/members/${pid}`, {
      method: 'DELETE', headers: { Authorization: `Bearer ${tok}` },
    });
    if (!r.ok) { const d = await r.json(); throw new Error(d.error || 'leave_failed'); }
  },

  async leaderboard(clubId, pid, period) {
    const tok = await this.getToken(); if (!tok) return null;
    const r = await fetch(`${CLOUD_API}/v1/clubs/${clubId}/leaderboard?playerId=${pid}&period=${period}`, {
      headers: { Authorization: `Bearer ${tok}` },
    });
    if (!r.ok) return null; return r.json();
  },
};

/* ---------- parent gate: "What is 7 × 8?" ---------- */
function parentGate(onPass) {
  const q = [[3,4],[4,5],[5,6],[6,7],[7,8],[8,9],[9,6],[4,8]][Math.floor(Math.random()*8)];
  const ans = String(q[0]*q[1]), entered = {v:''};
  const disp = h('div', {class:'code-display', style:'letter-spacing:0;font-size:28px'}, '?');
  const keypad = h('div', {class:'keypad'});
  const updateDisp = () => { disp.textContent = entered.v || '?'; };
  for (let i = 1; i <= 9; i++) keypad.append(h('button', {onclick: () => { if (entered.v.length < 3) { entered.v += i; updateDisp(); } }}, String(i)));
  keypad.append(h('button', {onclick: () => { entered.v = entered.v.slice(0,-1); updateDisp(); }}, '⌫'));
  keypad.append(h('button', {onclick: () => { if (entered.v.length < 3) { entered.v += '0'; updateDisp(); } }}, '0'));
  keypad.append(h('button', {class:'btn ok', style:'border-radius:14px', onclick: () => {
    if (entered.v === ans) { sheet.hidden = true; onPass(); }
    else { disp.style.color = 'var(--no)'; entered.v = ''; setTimeout(() => { disp.style.color = ''; disp.textContent = '?'; }, 700); }
  }}, '✓'));
  sheetBox.replaceChildren(h('h2', {id:'sheetT'}, `Ask a grown-up: ${q[0]} × ${q[1]} = ?`), h('div', {class:'hint'}, 'Type the answer to continue.'), disp, keypad);
  sheet.hidden = false;
}

/* stars from before kittens existed all came from Draw to Add */
if (S.solved && !Object.keys(S.area).length) S.area['pv-add'] = S.solved;

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, at, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(at || {})){ if (v == null || v === false) continue; if (k === 'html') el.innerHTML = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? '' : v); }
  kids.flat().filter(x => x != null && x !== false).forEach(k => el.append(k));
  return el;
}
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
let toastT; const toast = t => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1600); };
let starPending = 0, fishPending = 0;
const paintStars = () => { $('#starN').textContent = S.stars - starPending; const fe = $('#fishN'); if (fe) fe.textContent = (S.fish || 0) - fishPending; };
/* an earned star or fish pops in at the middle of the screen, flies up to its counter, and the counter bumps as it lands */
function flyToken(emoji, box, kind, n, delay){
  const hold = d => { if (kind === 'star') starPending = Math.max(0, starPending + d); else fishPending = Math.max(0, fishPending + d); paintStars(); };
  hold(n);
  const el = h('div', {class:'star-fly'}, emoji);
  const launch = () => {
    document.body.append(el);
    const r = box.getBoundingClientRect(), dx = r.left + r.width / 2 - innerWidth / 2, dy = r.top + r.height / 2 - innerHeight / 2;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translate(-50%,-50%) scale(1.7)'; }));
    setTimeout(() => { el.style.transition = 'transform .75s cubic-bezier(.45,0,.75,.5)'; el.style.transform = `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.4)`; }, 380);
    setTimeout(() => {
      el.remove(); hold(-n);

/* ---------- place value marks ---------- */
const PLACES = [['100s','c100','hundreds'],['10s','c10','tens'],['1s','c1','ones']];
const digits = n => [Math.floor(n / 100), Math.floor(n / 10) % 10, n % 10];
/* draw `have` pencil marks; after checking, extra marks get a red X and missing marks are drawn in green */
function marks(have, want, checked){
  const shown = checked ? Math.max(have, want) : have, W = 80, gap = 7.2, gg = 5, used = shown ? (shown - 1) * gap + (shown > 5 ? gg : 0) : 0, x0 = (W - used) / 2;
  let s = '';
  for (let j = 0; j < shown; j++){
    const x = (x0 + j * gap + (j >= 5 ? gg : 0)).toFixed(1), miss = checked && j >= have, extra = checked && j >= want && j < have;
    const col = miss ? 'var(--ok)' : extra ? 'var(--no)' : 'var(--pencil)', tilt = (j % 3 - 1) * .8;
    s += `<line class="${miss ? 'pop' : ''}" x1="${x}" y1="10" x2="${(+x + tilt).toFixed(1)}" y2="52" stroke="${col}" stroke-width="${miss ? 4.2 : 3.6}" stroke-linecap="round"${miss ? ' data-m="add"' : ''}${extra ? ' opacity=".55"' : ''}/>`;
    if (extra) s += `<line x1="${(+x + 4).toFixed(1)}" y1="14" x2="${(+x - 4).toFixed(1)}" y2="48" stroke="var(--no)" stroke-width="3.4" stroke-linecap="round" data-m="cross"/>`;
  }
  return `<svg viewBox="0 0 80 62" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${s}</svg>`;
}
const ERASER = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 21l11-11a3 3 0 014 0l5 5a3 3 0 010 4l-7 7H11z" fill="var(--pink)"/><path d="M6 21l5-5 9 9-1 1h-8z" fill="var(--surf)" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 21l11-11a3 3 0 014 0l5 5a3 3 0 010 4l-7 7H11z" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 28h16" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round"/></svg>';

/* pre-drawn marks with X overlays for subtraction */
function subMarks(total, crossed){
  if(total<=0) return '';
  const W=80, gap=7.2, gg=5, used=total<=1?0:(total-1)*gap+(total>5?gg:0), x0=(W-used)/2;
  let s='';
  for(let j=0;j<total;j++){
    const x=(x0+j*gap+(j>=5?gg:0)).toFixed(1), t=(j%3-1)*.8, out=j<crossed;
    s+=`<line x1="${x}" y1="10" x2="${(+x+t).toFixed(1)}" y2="52" stroke="${out?'var(--mut)':'var(--pencil)'}" stroke-width="3.6" stroke-linecap="round"${out?' opacity=".35"':''}/>`;
    if(out){
      s+=`<line x1="${(+x-7).toFixed(1)}" y1="8" x2="${(+x+7).toFixed(1)}" y2="54" stroke="var(--no)" stroke-width="2.6" stroke-linecap="round"/>`;
      s+=`<line x1="${(+x+7).toFixed(1)}" y1="8" x2="${(+x-7).toFixed(1)}" y2="54" stroke="var(--no)" stroke-width="2.6" stroke-linecap="round"/>`;
    }
  }
  return `<svg viewBox="0 0 80 62" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${s}</svg>`;
}

/* ---------- problems: the worksheet's two first, then new ones like them ---------- */
const WORKSHEET = [[39, 136], [126, 66]];
function makeProblem(){
  for (;;){
    const big = 100 + rnd(1, 89), small = rnd(11, 89), carry = Math.random() < .8;
    if (big % 10 === 0 || small % 10 === 0 || big + small > 199) continue;
    if (carry !== (big % 10 + small % 10 >= 10)) continue;
    if (S.pv.cur && S.pv.cur.includes(big)) continue;
    return Math.random() < .5 ? [small, big] : [big, small];
  }
}
const nextProblem = () => { const i = S.pv.i || 0; S.pv.cur = i < WORKSHEET.length ? WORKSHEET[i].slice() : makeProblem(); S.pv.i = i + 1; save(); };

/* ---------- Learn · skill 1: draw on the place value chart ---------- */
function drawToAdd(v){
  if (!S.pv.cur) nextProblem();
  const [a, b] = S.pv.cur, rows = [a, b], want = rows.map(digits);
  // per-column raw sums before carry propagation
  const colSum = [0,1,2].map(k => want[0][k] + want[1][k]);
  const c1  = colSum[2] >= 10 ? 1 : 0;              // ones → tens carry
  const c10 = (colSum[1] + c1) >= 10 ? 1 : 0;       // tens → hundreds carry
  const answer = a + b, ansD = digits(answer);

  let have = [[0,0,0],[0,0,0]], checked = false;
  const cells = [[],[]], sumCells = [], carryBadges = [];
  const banner = h('div', {class:'banner', hidden:true});
  const lbl = (r,k) => `${rows[r]}, ${PLACES[k][2]}: ${have[r][k]} mark${have[r][k]===1?'':'s'}`;
  const paint = () => cells.forEach((row,r) => row.forEach((c,k) => {
    c.innerHTML = marks(have[r][k], want[r][k], checked); c.setAttribute('aria-label', lbl(r,k));
    c.classList.toggle('right', checked && have[r][k]===want[r][k]); c.classList.toggle('fix', checked && have[r][k]!==want[r][k]);
  }));

  /* answer blank: underlines that fill in with the actual digits after checking */
  const ansBox = h('div', {class:'ans-box', 'aria-live':'polite'});
  const ansSlots = ansD.map((_,i) => {
    const slot = h('div', {class:'ans-slot'});
    ansBox.append(h('div', {class:'ans-dig'}, slot, h('div', {class:'ans-lab'}, PLACES[i][0])));
    return slot;
  });
  const revealAns = () => ansD.forEach((d,i) => setTimeout(() => {
    const sp = h('span', {class:'ans-num pop'}, String(d));
    ansSlots[i].replaceChildren(sp); ansSlots[i].classList.add('on');
  }, 300 + i*160));

  /* build SVG for sum cells: n marks total, first carryOut in gold */
  const sumSVG = (n, carryOut) => {
    if (n <= 0) return '';
    const W=80, gap=n<=9 ? 7.2 : Math.min(7.2, 72/Math.max(n-1,1));
    const gg=n>5&&n<=9 ? 5 : 0, used=n<=1 ? 0 : (n-1)*gap+gg, x0=(W-used)/2;
    let s='';
    for (let j=0; j<n; j++){
      const gold=j<carryOut, x=(x0+j*gap+(j>=5&&n<=9?gg:0)).toFixed(1), t=(j%3-1)*.8;
      s+=`<line x1="${x}" y1="10" x2="${(+x+t).toFixed(1)}" y2="52" stroke="${gold?'var(--gold)':'var(--pencil)'}" stroke-width="${gold?4.2:3.6}" stroke-linecap="round"/>`;
    }
    return `<svg viewBox="0 0 80 62" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  };

  /* animate: marks clones fly from cells to sum row, then carry badges, then answer pops */
  const animateSolution = () => {
    PLACES.forEach((_,k) => {
      const tgt=sumCells[k], tR=tgt.getBoundingClientRect();
      [0,1].forEach(r => {
        const src=cells[r][k], svg=src.querySelector('svg'); if(!svg) return;
        const sR=src.getBoundingClientRect();
        const fly=document.createElement('div');
        fly.style.cssText=`position:fixed;left:${sR.left}px;top:${sR.top}px;width:${sR.width}px;height:${sR.height}px;pointer-events:none;z-index:50;transition:transform .7s ease-in-out,opacity .7s ease-in-out;overflow:hidden;`;
        fly.innerHTML=svg.outerHTML;
        document.body.appendChild(fly);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          const dy=tR.top-sR.top+(r===1?tR.height*.12:0);
          fly.style.transform=`translate(${tR.left-sR.left}px,${dy}px)`;
          fly.style.opacity='0';
        }));
        setTimeout(()=>fly.remove(), 780);
      });
    });

    // sum cells appear with combined raw marks; carry groups highlighted in gold
    setTimeout(()=>{
      PLACES.forEach((_,k)=>{
        const co = k===2 ? c1*10 : k===1 ? c10*10 : 0;
        sumCells[k].innerHTML=sumSVG(colSum[k], co);
        sumCells[k].classList.add('in');
      });
      if (c1)  carryBadges[1].textContent='+1 carry';
      if (c10) carryBadges[0].textContent='+1 carry';
    }, 740);

    // fade each sum cell to show the final answer digit's marks (after carry)
    setTimeout(()=>{
      PLACES.forEach((_,k)=>{
        sumCells[k].style.opacity='0';
        setTimeout(()=>{ sumCells[k].innerHTML=sumSVG(ansD[k],0); sumCells[k].style.opacity='1'; }, 360);
      });
    }, 1300);

    // pop in the answer number
    setTimeout(revealAns, 1900);
  };

  /* grid */
  const grid=h('div',{class:'pv',role:'group','aria-label':'Place value chart'},
    h('div'), PLACES.map(p=>h('div',{class:'hd'},p[0])), h('div'));

  rows.forEach((n,r)=>{
    let pressTimer=null, didLong=false;
    grid.append(h('div',{class:'num'},String(n)));
    PLACES.forEach((p,k)=>{
      const c=h('button',{class:'cell '+p[1]});
      c.addEventListener('click',()=>{
        if(checked||didLong){didLong=false;return;}
        if(have[r][k]>=9){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');toast('9 is the most in one box!');return;}
        have[r][k]++;paint();
      });
      c.addEventListener('pointerdown',()=>{
        didLong=false;
        pressTimer=setTimeout(()=>{
          if(checked)return;
          const add=Math.min(5,9-have[r][k]);
          if(add<=0){toast('9 is the most!');return;}
          have[r][k]+=add;paint();didLong=true;toast('+'+add);
        },400);
      });
      c.addEventListener('pointerup',()=>clearTimeout(pressTimer));
      c.addEventListener('pointerleave',()=>clearTimeout(pressTimer));
      c.setAttribute('aria-label',lbl(r,k));
      cells[r].push(c);grid.append(c);
    });
    grid.append(h('button',{class:'erase','aria-label':'Erase the '+n+' row',html:ERASER,onclick:()=>{if(checked)return;have[r]=[0,0,0];paint();}}));
  });

  // separator spanning all columns
  grid.append(h('div',{class:'pv-sep'}));
  // carry badge row (one badge per place column, starts empty)
  grid.append(h('div'));
  PLACES.forEach((_,k)=>{const cb=h('div',{class:'carry-badge'});carryBadges.push(cb);grid.append(cb);});
  grid.append(h('div'));
  // sum row
  grid.append(h('div',{class:'num',style:'font-size:28px'},'='));
  PLACES.forEach((_,k)=>{const sc=h('div',{class:'cell '+PLACES[k][1]+' sum'});sumCells.push(sc);grid.append(sc);});
  grid.append(h('div'));

  const act=h('button',{class:'btn',onclick:()=>{
    if(!checked){
      checked=true;
      const right=have.every((row,r)=>row.every((x,k)=>x===want[r][k]));
      banner.hidden=false;banner.className='banner '+(right?'good':'bad');
      paint();
      if(right){
        banner.textContent='⭐ You got it!';act.textContent='OK ▶';act.className='btn ok';
        award('pv-add');animateSolution();
      } else {
        miss();banner.textContent='Almost! See the red and green.';act.textContent='OK ▶';act.className='btn ok';
        revealAns();
      }
    } else {nextProblem();render();}
  }},'Check');
  const render=()=>{v.replaceChildren();drawToAdd(v);};
  v.append(
    h('div',{style:'margin-bottom:12px'},h('button',{class:'btn ghost',onclick:()=>go('learn')},'← Learn')),
    h('div',{class:'card'},
      h('div',{class:'hint',style:'text-align:center;font-size:14px'},'Tap a box to draw a mark. Hold for +5.'),
      h('div',{class:'eq'},String(a),' ',h('span',{},'+'),' ',String(b)),
      grid,
      h('div',{class:'legend','aria-hidden':'true'},
        h('span',{},'Tap: ',h('b',{},'+1'),' · Hold: ',h('b',{},'+5')),
        h('span',{},h('b',{html:ERASER.replace('<svg ','<svg style="width:18px;height:18px;vertical-align:-4px" ')}),' clears row')),
      ansBox,
      banner,
      h('div',{class:'acts'},act)));
  paint();
}

/* ---------- Skill 2: Draw to Subtract ---------- */
const SUB_WORKSHEET=[[143,21],[165,32]];
function makeSubProblem(){
  for(;;){
    const a=100+rnd(1,89),b=rnd(11,89);
    const ad=digits(a),bd=digits(b);
    if(ad[2]<bd[2]||ad[1]<bd[1])continue;
    if(a%10===0||b%10===0)continue;
    if(S.pvs.cur&&S.pvs.cur[0]===a)continue;
    return [a,b];
  }
}
const nextSubProblem=()=>{const i=S.pvs.i||0;S.pvs.cur=i<SUB_WORKSHEET.length?SUB_WORKSHEET[i].slice():makeSubProblem();S.pvs.i=i+1;save();};

function drawToSubtract(v){
  if(!S.pvs.cur) nextSubProblem();
  const [a,b]=S.pvs.cur, startD=digits(a), subD=digits(b);
  const answer=a-b, ansD=digits(answer);
  let crossed=[0,0,0], checked=false;
  const cells=[], banner=h('div',{class:'banner',hidden:true});
  const paint=()=>cells.forEach((c,k)=>{
    c.innerHTML=subMarks(startD[k],crossed[k]);
    c.classList.toggle('right',checked&&crossed[k]===subD[k]);
    c.classList.toggle('fix',checked&&crossed[k]!==subD[k]);
  });
  const ansBox=h('div',{class:'ans-box','aria-live':'polite'});
  const ansSlots=ansD.map((_,i)=>{const slot=h('div',{class:'ans-slot'});ansBox.append(h('div',{class:'ans-dig'},slot,h('div',{class:'ans-lab'},PLACES[i][0])));return slot;});
  const revealAns=()=>ansD.forEach((d,i)=>setTimeout(()=>{const sp=h('span',{class:'ans-num pop'},String(d));ansSlots[i].replaceChildren(sp);ansSlots[i].classList.add('on');},300+i*160));
  const grid=h('div',{class:'pv',role:'group','aria-label':'Place value chart'},h('div'),PLACES.map(p=>h('div',{class:'hd'},p[0])),h('div'));
  grid.append(h('div',{class:'num'},String(a)));
  PLACES.forEach((p,k)=>{
    let pressTimer=null,didLong=false;
    const c=h('button',{class:'cell '+p[1]});
    c.addEventListener('click',()=>{
      if(checked||didLong){didLong=false;return;}
      if(crossed[k]>=startD[k]){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');toast('No more marks here!');return;}
      crossed[k]++;paint();
    });
    c.addEventListener('pointerdown',()=>{
      didLong=false;pressTimer=setTimeout(()=>{
        if(checked||crossed[k]<=0)return;
        crossed[k]--;paint();didLong=true;toast('Uncrossed 1');
      },400);
    });
    c.addEventListener('pointerup',()=>clearTimeout(pressTimer));
    c.addEventListener('pointerleave',()=>clearTimeout(pressTimer));
    cells.push(c);grid.append(c);
  });
  grid.append(h('div'));
  grid.append(h('div',{class:'pv-sep'}));
  grid.append(h('div',{class:'num',style:'font-size:22px'},String(b)));
  PLACES.forEach((p,k)=>grid.append(h('div',{class:'cell '+p[1]+' sum',style:'min-height:52px;border-style:dashed;display:grid;place-items:center;font:800 24px var(--fd);color:var(--mut)'},subD[k]>0?String(subD[k]):'')));
  grid.append(h('div'));
  const act=h('button',{class:'btn',onclick:()=>{
    if(!checked){
      checked=true;
      const right=crossed.every((x,k)=>x===subD[k]);
      banner.hidden=false;banner.className='banner '+(right?'good':'bad');
      paint();revealAns();
      if(right){banner.textContent='⭐ You got it!';act.textContent='OK ▶';act.className='btn ok';award('pv-sub');}
      else{miss();banner.textContent='Almost! Check the red boxes.';act.textContent='OK ▶';act.className='btn ok';}
    }else{nextSubProblem();render();}
  }},'Check');
  const render=()=>{v.replaceChildren();drawToSubtract(v);};
  v.append(
    h('div',{style:'margin-bottom:12px'},h('button',{class:'btn ghost',onclick:()=>go('learn')},'← Learn')),
    h('div',{class:'card'},
      h('div',{class:'hint',style:'text-align:center;font-size:14px'},'Tap marks to cross them out. Hold to un-cross.'),
      h('div',{class:'eq'},String(a),' ',h('span',{},'−'),' ',String(b)),
      grid,
      h('div',{class:'legend','aria-hidden':'true'},h('span',{},'Tap: cross out 1'),h('span',{},'Hold: un-cross 1')),
      ansBox,banner,
      h('div',{class:'acts'},act)));
  paint();
}

/* ---------- Skill 3: Skip Count by 10s ---------- */
const SKIP_WORKSHEET=[[25,10],[65,10],[145,-10]];
function makeSkipProblem(){const up=Math.random()<.7;return up?[rnd(10,89),10]:[rnd(90,169),-10];}
const nextSkipProblem=()=>{const i=S.skip.i||0;S.skip.cur=i<SKIP_WORKSHEET.length?SKIP_WORKSHEET[i].slice():makeSkipProblem();S.skip.i=i+1;save();};

function skipCountBy10(v){
  const totalRounds=8;
  if(!S.skip.cur || (S.skip.cur[1]<0 && S.skip.cur[0]+S.skip.cur[1]*totalRounds<0)) nextSkipProblem();
  const [start,by]=S.skip.cur;
  let current=start, roundNum=0, locked=false, missed=false;

  const progEl=h('div',{style:'text-align:center;font:400 14px var(--fb);color:var(--mut);margin-top:6px'},
    String(roundNum)+' / '+totalRounds);
  const celebWrap=h('div',{class:'sc-celeb'});
  const choicesRow=h('div',{style:'display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0'});
  const listEl=h('div',{class:'sc-list'});
  const addToList=n=>{
    listEl.querySelectorAll('.new').forEach(e=>e.classList.remove('new'));
    listEl.append(h('div',{class:'sc-li new'},String(n)));
  };
  addToList(start);
  const card=h('div',{class:'card'});

  const showRound=()=>{
    locked=false;
    const answer=current+by;
    const wrong=(answer<1||Math.random()<.5)?answer+1:answer-1;
    const leftIsRight=Math.random()<.5;
    const lVal=leftIsRight?answer:wrong, rVal=leftIsRight?wrong:answer;
    const lBtn=h('button',{class:'sc-choice'},String(lVal));
    const rBtn=h('button',{class:'sc-choice'},String(rVal));
    const orEl=h('div',{style:'font:800 20px/1 var(--fb);color:var(--mut)'},'or');
    const onChoice=(wasRight,btn)=>{
      if(locked) return;
      if(wasRight){
        locked=true;
        current=answer; roundNum++;
        progEl.textContent=String(roundNum)+' / '+totalRounds;
        addToList(answer);
        const f=h('div',{class:'sc-float'},'👍');
        celebWrap.append(f); setTimeout(()=>f.remove(),950);
        if(roundNum>=totalRounds){
          card.classList.add('sc-flash');
          award('skip-10'); if(!missed) giveFish(3,'✨ Perfect set!'); nextSkipProblem();
          setTimeout(()=>{if(!card.isConnected)return;v.replaceChildren();skipCountBy10(v);},1800);
        } else {
          setTimeout(showRound,320);
        }
      } else {
        missed=true; miss();
        btn.classList.add('shake');
        setTimeout(()=>btn.classList.remove('shake'),500);
      }
    };
    lBtn.addEventListener('click',()=>onChoice(leftIsRight,lBtn));
    rBtn.addEventListener('click',()=>onChoice(!leftIsRight,rBtn));
    choicesRow.replaceChildren(lBtn,orEl,rBtn);
  };

  showRound();
  card.append(h('div',{class:'sc-body'},
    listEl,
    h('div',{class:'sc-main'},
      h('div',{style:'text-align:center;margin-bottom:12px'},
        h('div',{style:'font:400 14px var(--fb);color:var(--mut);margin-bottom:2px'},'Start at'),
        h('div',{style:'font:800 52px/1 var(--fd);color:var(--pink)'},String(start)),
        h('div',{style:'font:400 14px var(--fb);color:var(--mut);margin:8px 0 2px'},'count by'),
        h('div',{style:'display:inline-flex;align-items:center;gap:6px'},
          h('span',{style:'font:800 52px/1 var(--fd);color:var(--pink)'},String(Math.abs(by))),
          h('span',{style:'font:800 40px/1 var(--fd);color:'+(by<0?'#ef4444':'#22c55e')},by<0?'↓':'↑'))),
      h('div',{style:'text-align:center;font:400 15px var(--fb);color:var(--mut);margin-bottom:4px'},'Which comes next?'),
      choicesRow,celebWrap,progEl)));
  v.append(
    h('div',{style:'margin-bottom:12px'},h('button',{class:'btn ghost',onclick:()=>go('learn')},'← Learn')),
    card);
}

/* ---------- Skill 4: Number Sense (addition) ---------- */
const NS_ADD_WORKSHEET=[{a:136,b:53},{a:142,b:47}];
function makeNSAddProblem(){for(;;){const a=100+rnd(1,89),b=rnd(11,89);if(a%10===0||b%10===0)continue;const ad=digits(a),bd=digits(b);if(ad[1]+bd[1]>=10||ad[2]+bd[2]>=10)continue;return {a,b};}}
const nextNSAddProblem=()=>{const i=S.ns.i||0;S.ns.cur=i<NS_ADD_WORKSHEET.length?NS_ADD_WORKSHEET[i]:makeNSAddProblem();S.ns.i=i+1;save();};
function numberSenseAdd(v){if(!S.ns.cur)nextNSAddProblem();const {a,b}=S.ns.cur;nsAdd(v,a,b);}

/* ---------- Skill 5: Number Sense (subtraction / combine) ---------- */
const NS_SUB_WORKSHEET=[{a:143,b:56},{a:165,b:48}];
function makeNSSubProblem(){for(;;){const a=100+rnd(1,89),b=rnd(11,89);if(a%10===0||b%10===0)continue;if(a-b<20)continue;return {a,b};}}
const nextNSSubProblem=()=>{const i=(S.nss||{}).i||0;if(!S.nss)S.nss={i:0,cur:null};S.nss.cur=i<NS_SUB_WORKSHEET.length?NS_SUB_WORKSHEET[i]:makeNSSubProblem();S.nss.i=i+1;save();};
function numberSenseSub(v){if(!S.nss||!S.nss.cur)nextNSSubProblem();const {a,b}=S.nss.cur;nsSub(v,a,b);}

function nsAdd(v,a,b){
  const aH=Math.floor(a/100)*100, aT=Math.floor(a/10)%10*10, aO=a%10;
  const bT=Math.floor(b/10)%10*10, bO=b%10;
  const tensSumVal=aT+bT, onesSumVal=aO+bO;

  let rootAOpen=false, rootBOpen=false;
  let tensState='none', onesState='none';
  let tensSumShown=false, onesSumShown=false;
  let sumATapped=false, sumBTapped=false;

  const svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible');
  const wrap=h('div',{style:'position:relative;min-height:350px;padding-bottom:8px'});
  wrap.append(svgEl);

  const drawLine=(fromEl,toEl,color,delay=0)=>{
    const cr=wrap.getBoundingClientRect();
    const a2=fromEl.getBoundingClientRect(), b2=toEl.getBoundingClientRect();
    const x1=a2.left+a2.width/2-cr.left, y1=a2.bottom-cr.top-1;
    const x2=b2.left+b2.width/2-cr.left, y2=b2.top-cr.top+1;
    const len=Math.hypot(x2-x1,y2-y1)+4;
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);
    ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);
    ln.setAttribute('stroke',color);ln.setAttribute('stroke-width','3.5');
    ln.setAttribute('stroke-linecap','round');
    ln.setAttribute('stroke-dasharray',len);ln.setAttribute('stroke-dashoffset',len);
    ln.style.transition='stroke-dashoffset 0.35s ease-out '+delay+'s';
    svgEl.append(ln);
    requestAnimationFrame(()=>requestAnimationFrame(()=>ln.setAttribute('stroke-dashoffset','0')));
  };

  const banner=h('div',{class:'banner',hidden:true});
  const actBtn=h('button',{class:'btn',hidden:true,onclick:()=>{nextNSAddProblem();v.replaceChildren();numberSenseAdd(v);}});

  const leafAH=h('div',{class:'ns2-leaf auto'},String(aH));
  const leafAT=h('div',{class:'ns2-leaf tens'},String(aT));
  const leafAO=h('div',{class:'ns2-leaf ones'},String(aO));
  const leafBT=h('div',{class:'ns2-leaf tens'},String(bT));
  const leafBO=h('div',{class:'ns2-leaf ones'},String(bO));
  const leavesA=h('div',{class:'ns2-leaves',style:'opacity:0'},leafAH,leafAT,leafAO);
  const leavesB=h('div',{class:'ns2-leaves',style:'opacity:0'},leafBT,leafBO);

  const rootA=h('div',{class:'ns2-root'},String(a));
  const rootB=h('div',{class:'ns2-root'},String(b));

  const tensSumEl=h('div',{class:'ns2-sum tens',style:'opacity:0'},
    String(aT),'+',String(bT),'=',h('u',{},String(tensSumVal)));
  const onesSumEl=h('div',{class:'ns2-sum ones',style:'opacity:0'},
    String(aO),'+',String(bO),'=',h('u',{},String(onesSumVal)));

  const finalEl=h('div',{class:'ns2-final',style:'opacity:0'},String(a+b));

  const compDefs=[];
  if(aH>0) compDefs.push({key:'h',val:aH,color:'#F48FBF'});
  compDefs.push({key:'t',val:tensSumVal,color:'var(--ok)'});
  compDefs.push({key:'o',val:onesSumVal,color:'#a855f7'});
  const compEls={};
  let compDone=0;

  const compTileEls=compDefs.map(d=>{
    const el=h('div',{class:'ns2-leaf',style:'cursor:default;border-color:'+d.color+';color:'+d.color+(d.key==='h'?';border-style:dashed;background:var(--pinkt)':'')},String(d.val));
    compEls[d.key]=el;
    el.addEventListener('click',()=>{
      if(el.dataset.tapped||el.style.cursor==='default') return;
      el.dataset.tapped='1';
      el.classList.remove('hint-target');
      el.classList.add('sel');
      el.style.transition='transform .2s ease-out';
      el.style.transform='scale(1.25)';
      el.style.cursor='default';
      compDone++;
      const rem=compTileEls.filter(t=>!t.dataset.tapped);
      if(rem.length>0) markNext(...rem);
      if(compDone===compDefs.length){
        setTimeout(()=>{
          finalEl.style.opacity='1';
          finalEl.style.animation='numPop .4s ease-out';
          compDefs.forEach((d2,i)=>drawLine(compEls[d2.key],finalEl,d2.color,i*0.1));
          setTimeout(()=>{
            banner.hidden=false;banner.className='banner good';
            banner.textContent='⭐ You got it!';
            actBtn.hidden=false;actBtn.textContent='OK ▶';actBtn.className='btn ok';
            award('ns-add');
          },700);
        },200);
      }
    });
    return el;
  });
  const compRow=h('div',{class:'ns2-row',style:'opacity:0;gap:10px'},...compTileEls);

  const getLeaf=(place,fromA)=>place==='tens'?(fromA?leafAT:leafBT):(fromA?leafAO:leafBO);

  const tryShowFinal=()=>{
    if(!sumATapped||!sumBTapped) return;
    compRow.style.transition='opacity .4s 0.1s';
    compRow.style.opacity='1';
    compTileEls.forEach(el=>{el.style.cursor='pointer';});
    drawLine(tensSumEl,compEls['t'],'var(--ok)',0.1);
    drawLine(onesSumEl,compEls['o'],'#a855f7',0.2);
    if(compEls['h']) drawLine(leafAH,compEls['h'],'#F48FBF',0.3);
    setTimeout(()=>markNext(...compTileEls),250);
  };

  tensSumEl.addEventListener('click',()=>{
    if(tensState!=='done'||sumATapped) return;
    sumATapped=true; tensSumEl.classList.add('tapped'); tensSumEl.classList.remove('hint-target');
    if(!sumBTapped) markNext(onesSumEl);
    tryShowFinal();
  });
  onesSumEl.addEventListener('click',()=>{
    if(onesState!=='done'||sumBTapped) return;
    sumBTapped=true; onesSumEl.classList.add('tapped'); onesSumEl.classList.remove('hint-target');
    if(!sumATapped) markNext(tensSumEl);
    tryShowFinal();
  });

  const tryShowSums=()=>{
    if(tensState==='done'&&!tensSumShown){
      tensSumShown=true;
      tensSumEl.style.opacity='1'; tensSumEl.classList.add('ready');
      drawLine(leafAT,tensSumEl,'var(--ok)');
      drawLine(leafBT,tensSumEl,'var(--ok)',0.12);
    }
    if(onesState==='done'&&!onesSumShown){
      onesSumShown=true;
      onesSumEl.style.opacity='1'; onesSumEl.classList.add('ready');
      drawLine(leafAO,onesSumEl,'#a855f7');
      drawLine(leafBO,onesSumEl,'#a855f7',0.12);
    }
    if(tensState==='done'&&onesState==='done'){
      setTimeout(()=>markNext(tensSumEl,onesSumEl),200);
    }
  };

  const handleLeafTap=(place,fromA)=>{
    const curS=place==='tens'?tensState:onesState;
    const otherS=place==='tens'?onesState:tensState;
    const setS=s=>{if(place==='tens')tensState=s;else onesState=s;};
    if(curS==='done') return;
    if(otherS!=='none'&&otherS!=='done'){toast('Finish the other pair first');return;}
    const lf=getLeaf(place,fromA);
    if(curS==='none'){
      setS(fromA?'selA':'selB'); lf.classList.add('sel');
      markNext(getLeaf(place,!fromA));
    } else if(curS===(fromA?'selA':'selB')){
      setS('none'); lf.classList.remove('sel');
      markNext(getLeaf(place,true),getLeaf(place,false));
    } else {
      setS('done');
      getLeaf(place,true).classList.remove('sel'); getLeaf(place,false).classList.remove('sel');
      getLeaf(place,true).classList.add('paired'); getLeaf(place,false).classList.add('paired');
      tryShowSums();
      const otherDone=place==='tens'?onesState==='done':tensState==='done';
      if(!otherDone){
        markNext(...(place==='tens'?[leafAO,leafBO]:[leafAT,leafBT]));
      }
    }
  };

  leafAT.addEventListener('click',()=>{if(!rootAOpen||!rootBOpen){toast('Tap both numbers first');return;}handleLeafTap('tens',true);});
  leafBT.addEventListener('click',()=>{if(!rootAOpen||!rootBOpen){toast('Tap both numbers first');return;}handleLeafTap('tens',false);});
  leafAO.addEventListener('click',()=>{if(!rootAOpen||!rootBOpen){toast('Tap both numbers first');return;}handleLeafTap('ones',true);});
  leafBO.addEventListener('click',()=>{if(!rootAOpen||!rootBOpen){toast('Tap both numbers first');return;}handleLeafTap('ones',false);});

  rootA.addEventListener('click',()=>{
    if(rootAOpen) return;
    rootAOpen=true; rootA.classList.add('open'); rootA.classList.remove('hint-target');
    leavesA.style.transition='opacity .3s'; leavesA.style.opacity='1';
    drawLine(rootA,leafAH,'#ccc'); drawLine(rootA,leafAT,'#ccc',0.08); drawLine(rootA,leafAO,'#ccc',0.16);
    if(rootBOpen) markNext(leafAT,leafBT); else markNext(rootB);
  });
  rootB.addEventListener('click',()=>{
    if(rootBOpen) return;
    rootBOpen=true; rootB.classList.add('open'); rootB.classList.remove('hint-target');
    leavesB.style.transition='opacity .3s'; leavesB.style.opacity='1';
    drawLine(rootB,leafBT,'#ccc'); drawLine(rootB,leafBO,'#ccc',0.08);
    if(rootAOpen) markNext(leafAT,leafBT); else markNext(rootA);
  });

function nsSub(v,a,b){
  const aStr=String(a), aTensStr=aStr.slice(0,-1), aOnesStr=aStr.slice(-1);
  const aOnes=a%10, bTens=Math.floor(b/10)*10, bOnes=b%10;
  const needSplit=bOnes>aOnes;
  const matchOnes=needSplit?aOnes:0;
  const remOnes=needSplit?bOnes-aOnes:bOnes;
  const parts=needSplit?[bTens,matchOnes,remOnes]:[bTens,bOnes];

  let runningTotal=a, attackIdx=0, phase=0, attackEls;
  const banner=h('div',{class:'banner',hidden:true});
  const actBtn=h('button',{class:'btn',hidden:true,onclick:()=>{nextNSSubProblem();v.replaceChildren();numberSenseSub(v);}});
  const container=h('div',{style:'position:relative'});
  const msg=h('div',{style:'text-align:center;font:700 16px var(--fb);color:var(--mut);min-height:24px;margin:6px 0'},'Tap the second number to break it apart!');

  const aEl=h('div',{class:'ns2-root',style:'cursor:default'},aStr);
  const bEl=h('div',{class:'ns2-root'},String(b));
  const topRow=h('div',{class:'ns2-row'},aEl,h('div',{class:'ns2-op'},'−'),bEl);

  const onesSpan=h('span',{class:'ns-dig'},aOnesStr);
  const aDup=h('div',{class:'ns-boss-num sm',style:'position:relative;z-index:5'},h('span',{},aTensStr),onesSpan);
  const mk=n=>{
    const el=h('div',{class:'ns-attacker'},String(n));
    el.addEventListener('click',()=>onAttackTap(attackEls.indexOf(el)));
    return el;
  };
  const tensEl=mk(bTens);
  let fiveEl=null, matchEl=null, remEl=null, onesEl=null;
  if(needSplit){ fiveEl=mk(bOnes); matchEl=mk(matchOnes); remEl=mk(remOnes); attackEls=[tensEl,matchEl,remEl]; }
  else { onesEl=mk(bOnes); attackEls=[tensEl,onesEl]; }
  const minus=h('div',{class:'ns2-op'},'−');
  const partsBox=h('div',{style:'display:flex;gap:8px'},tensEl,needSplit?fiveEl:onesEl);
  const row2=h('div',{class:'ns-row2',hidden:true},aDup,minus,partsBox);

  const startAttack=()=>{
    phase=4;
    onesSpan.classList.remove('blink-green');
    if(matchEl) matchEl.classList.remove('blink-green');
    msg.textContent='Tap the numbers to attack!';
    attackEls.forEach((el,i)=>el.classList.add(i===0?'ready':'waiting'));
    markNext(attackEls[0]);
  };

  const impact=(amt)=>{
    runningTotal-=amt;
    const bR=aDup.getBoundingClientRect(), cr=container.getBoundingClientRect();
    const hit=h('div',{class:'ns-hit-label',style:'left:'+(bR.left-cr.left+bR.width/2)+'px;top:'+(bR.top-cr.top)+'px'},'-'+amt);
    container.append(hit);
    setTimeout(()=>hit.remove(),1150);
    aDup.classList.remove('hurt'); void aDup.offsetWidth; aDup.classList.add('hurt');
    setTimeout(()=>{aDup.textContent=String(runningTotal);},170);
    if(attackIdx<attackEls.length){
      const nx=attackEls[attackIdx];
      nx.classList.remove('waiting'); nx.classList.add('ready');
      markNext(nx);
    } else {
      markNext();
      setTimeout(()=>{
        msg.textContent='';
        banner.hidden=false;banner.className='banner good';banner.textContent='⭐ You got it!';
        actBtn.hidden=false;actBtn.textContent='OK ▶';actBtn.className='btn ok';
        award('ns-sub');
      },900);
    }
  };

  const onAttackTap=(i)=>{
    if(phase!==4||i!==attackIdx) return;
    const el=attackEls[i], amt=parts[i];
    attackIdx++;
    el.classList.remove('ready'); markNext();
    el.style.visibility='hidden';
    const cr=container.getBoundingClientRect();
    const eR=el.getBoundingClientRect(), bR=aDup.getBoundingClientRect();
    const sx=eR.left-cr.left+eR.width/2, sy=eR.top-cr.top+eR.height/2;
    const tx=bR.left-cr.left+bR.width/2, ty=bR.top-cr.top+bR.height/2;
    const flyer=h('div',{style:'position:absolute;left:'+sx+'px;top:'+sy+'px;transform:translate(-50%,-50%);font:800 22px var(--fd);background:var(--cell);border:3px solid var(--ok);border-radius:10px;padding:4px 10px;pointer-events:none;z-index:10'},String(amt));
    container.append(flyer);
    const t0=performance.now(), dur=800;
    const tick=t=>{
      const p=Math.min(1,(t-t0)/dur), ep=p<.5?2*p*p:-1+(4-2*p)*p;
      flyer.style.left=(sx+(tx-sx)*ep)+'px';
      flyer.style.top=(sy+(ty-sy)*ep-Math.sin(Math.PI*ep)*34)+'px';
      if(p<1) requestAnimationFrame(tick);
      else{ flyer.remove(); impact(amt); }
    };
    requestAnimationFrame(tick);
  };

  bEl.addEventListener('click',()=>{
    if(phase!==0) return;
    phase=1; bEl.classList.add('open'); markNext();
    msg.textContent='';
    row2.hidden=false;
    const fr=aEl.getBoundingClientRect(), to=aDup.getBoundingClientRect();
    const dx=fr.left+fr.width/2-(to.left+to.width/2), dy=fr.top+fr.height/2-(to.top+to.height/2);
    aDup.style.transition='none';
    aDup.style.transform='translate('+dx+'px,'+dy+'px)';
    minus.style.opacity='0'; partsBox.style.opacity='0';
    void aDup.offsetWidth;
    aDup.style.transition='transform .8s ease-in-out';
    aDup.style.transform='translate(0,0)';
    minus.style.transition=partsBox.style.transition='opacity .5s';
    minus.style.opacity='1'; partsBox.style.opacity='1';
    setTimeout(()=>{aDup.style.transition='';aDup.style.transform='';},900);
    if(needSplit){
      setTimeout(()=>{
        phase=2; fiveEl.classList.add('blink'); onesSpan.classList.add('blink');
        msg.textContent='Tap the blinking number to break it apart!';
      },900);
    } else {
      setTimeout(startAttack,1500);
    }
  });

  if(needSplit){
    fiveEl.addEventListener('click',()=>{
      if(phase!==2) return;
      phase=3; msg.textContent='';
      fiveEl.classList.remove('blink'); onesSpan.classList.remove('blink');
      fiveEl.replaceWith(matchEl,remEl);
      matchEl.classList.add('blink-green'); onesSpan.classList.add('blink-green');
      setTimeout(startAttack,1500);
    });
  }

  container.append(topRow,msg,row2);
  markNext(bEl);

  v.append(
    h('div',{style:'margin-bottom:12px'},h('button',{class:'btn ghost',onclick:()=>go('learn')},'← Learn')),
    h('div',{class:'card'},container,banner,h('div',{class:'acts'},actBtn)));
}

async function showWhoIsPlaying() {
  sheet.hidden = true;
  const players = await CLOUD.listPlayers();
  if (!players.length) {
    // First time: create a player and link it
    const newP = await CLOUD.createPlayer();
    await CLOUD.linkPlayer(newP.playerId);
    activeKey = `${KEY}:${newP.playerId}`;
    // Upload existing local progress
    await syncNow();
    toast(`Welcome, ${newP.displayName}!`);
    go('club'); return;
  }
  const kids = h('div', {style:'display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px'});
  players.forEach(p => {
    const btn = h('button', {style:'background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:10px 14px;text-align:center;min-width:80px', onclick: async () => {
      sheet.hidden = true;
      syncMeta.playerId = p.playerId; saveSyncMeta();
      activeKey = `${KEY}:${p.playerId}`;
      // Load this player's local save if any, then sync
      const saved = loadState(activeKey);
      if (saved) Object.assign(S, fresh(), saved);
      await syncNow();
      grant(); paintStars(); paintPet(); go('club');
    }});
    btn.append(h('div', {style:'width:48px;height:48px;margin:0 auto', html:catSVG({coat:p.coat||0, wear:p.wear||[]})}), h('div', {style:'font:700 13px var(--fb);margin-top:4px'}, p.displayName));
    kids.append(btn);
  });
  kids.append(h('button', {style:'background:var(--soft);border:2px dashed var(--line);border-radius:18px;padding:10px 14px;min-width:80px', onclick: async () => {
    sheet.hidden = true;
    const newP = await CLOUD.createPlayer();
    await CLOUD.linkPlayer(newP.playerId);
    toast(`Welcome, ${newP.displayName}!`);
    go('club');
  }}, h('div', {style:'font-size:30px'}, '➕'), h('div', {style:'font:700 13px var(--fb);margin-top:4px'}, 'New player')));
  sheetBox.replaceChildren(h('h2', {id:'sheetT'}, '🐱 Who\'s playing?'), h('div', {class:'hint'}, 'Tap your kitten!'), kids);
  sheet.hidden = false;
}

  if (!VIEWS[t]) t = 'learn';
  if (cleanup){ cleanup(); cleanup = null; }
  dayTick();

  document.querySelectorAll('#nav button').forEach(b => { const on = b.dataset.t === t; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const v = $('#view'); v.replaceChildren(); VIEWS[t](v); window.scrollTo(0, 0);
}

}
