<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2nd-grade math practice with kittens: draw to add/subtract, earn cats, cloud save and friend clubs">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meow Math">
<meta name="theme-color" content="#FEF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A0F1E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Meow Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: a calm sapphire-blue room with soft star sparkles. A rounded blue header (name, star count, her first kitten), one white card at a time, big thumb-size buttons, five tabs at the bottom. Drawing marks look like pencil; red means "too many", green means "missing". The Litter is a little room where her kittens wander, nap, play and eat. */
:root{
  --bg:#3552A3; --bg2:#2A4389; --chrome:#24397A; --chrome-ink:#F3F6FF; --chrome-mut:#B9C6F0;
  --surf:#FFFFFF; --soft:#EEF2FF; --cell:#F6F8FF; --line:#D5DDF7; --ink:#1D2752; --mut:#5C6896;
  --pink:#F48FBF; --pinkt:#FDE6F1; --gold:#FFCF5A; --sky:#7FA6F5;
  --h100:#E9E3FB; --h10:#FCE4EF; --h1:#E2F0FB;
  --pencil:#2B3463; --ok:#1E9A55; --okt:#DDF5E7; --no:#D93A4A; --not:#FDE3E5; --shadow:rgba(14,24,62,.22);
  --wall:#DCE6FF; --floor:#F3E3CF; --trim:#B9C8F2; --brw:#C9A27F;
  --fd:'Fredoka',ui-rounded,system-ui,sans-serif; --fb:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#152049; --bg2:#0F183A; --chrome:#1B2858; --chrome-ink:#EEF2FF; --chrome-mut:#9FB0E3;
  --surf:#1E2A5A; --soft:#26346B; --cell:#22305F; --line:#34447E; --ink:#EEF2FF; --mut:#A9B6E3;
  --pink:#F49BC6; --pinkt:#4A2340; --gold:#FFD36B; --sky:#8FB2FA;
  --h100:#2C2F6A; --h10:#3A2A55; --h1:#203F63;
  --pencil:#E6EBFF; --ok:#5ED394; --okt:#173D2B; --no:#FF7A86; --not:#4A1F28; --shadow:rgba(0,0,0,.4); --wall:#2A3A73; --floor:#3A3150; --trim:#3D4F8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#152049; --bg2:#0F183A; --chrome:#1B2858; --chrome-ink:#EEF2FF; --chrome-mut:#9FB0E3;
  --surf:#1E2A5A; --soft:#26346B; --cell:#22305F; --line:#34447E; --ink:#EEF2FF; --mut:#A9B6E3;
  --pink:#F49BC6; --pinkt:#4A2340; --gold:#FFD36B; --sky:#8FB2FA;
  --h100:#2C2F6A; --h10:#3A2A55; --h1:#203F63;
  --pencil:#E6EBFF; --ok:#5ED394; --okt:#173D2B; --no:#FF7A86; --not:#4A1F28; --shadow:rgba(0,0,0,.4); --wall:#2A3A73; --floor:#3A3150; --trim:#3D4F8F; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:700 17px/1.4 var(--fb);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(3px 3px at 12% 18%,rgba(255,255,255,.55),transparent 60%),radial-gradient(2px 2px at 78% 12%,rgba(255,255,255,.5),transparent 60%),radial-gradient(2.5px 2.5px at 88% 46%,rgba(255,255,255,.45),transparent 60%),radial-gradient(2px 2px at 22% 64%,rgba(255,255,255,.4),transparent 60%),radial-gradient(3px 3px at 60% 82%,rgba(255,255,255,.4),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin:0 -16px 14px;padding:10px 16px;display:flex;align-items:center;gap:10px;background:var(--chrome);color:var(--chrome-ink);border-radius:0 0 22px 22px;box-shadow:0 4px 14px var(--shadow)}
.top .kick{font:700 12px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--chrome-mut)}
.top h1{margin:0;font:700 27px/1 var(--fd);letter-spacing:.01em}
.top h1 b{color:var(--pink);font-weight:700}
.top .grow{flex:1;min-width:0}
.stars{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);font:700 20px var(--fd)}
.stars i{font-style:normal}
.pet{width:46px;height:46px;flex:none;border-radius:50%;border:2px dashed var(--chrome-mut);background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0}
.pet svg{width:34px;height:34px}
.pet.has{border-style:solid;border-color:var(--pink);background:var(--surf);overflow:hidden}
.pet.has svg{width:44px;height:44px;margin-top:6px}

/* cards and buttons */
.card{background:var(--surf);border-radius:22px;padding:16px;box-shadow:0 6px 18px var(--shadow);margin-bottom:14px}
h2{margin:0 0 4px;font:600 22px var(--fd)}
.hint{color:var(--mut);font-weight:700;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:18px;background:var(--pink);color:#2A1030;font:600 22px var(--fd);box-shadow:0 4px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none;min-height:46px;font-size:18px;width:auto;padding:0 16px}
.skill{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--surf);border-radius:22px;padding:16px;box-shadow:0 6px 18px var(--shadow);margin-bottom:12px}
.skill .ico{width:62px;height:62px;flex:none;border-radius:18px;background:var(--pinkt);display:grid;place-items:center;font-size:34px}
.skill b{display:block;font:600 22px var(--fd)}
.skill .go{margin-left:auto;font:700 26px var(--fd);color:var(--pink)}
.soon{text-align:center;padding:28px 16px}
.soon .big{font-size:56px;line-height:1.1}

/* the place value chart */
.eq{text-align:center;font:600 38px/1.1 var(--fd);margin:0 0 10px;letter-spacing:.02em}
.eq span{color:var(--pink)}
.pv{display:grid;grid-template-columns:58px repeat(3,1fr) 46px;gap:6px;align-items:stretch}
.pv .hd{text-align:center;font:600 18px var(--fd);color:var(--mut);padding:2px 0}
.pv .num{display:grid;place-items:center;font:600 22px var(--fd);border-radius:14px;background:var(--soft)}
.cell{min-height:80px;border:2px solid var(--line);border-radius:14px;padding:4px 2px;display:grid;place-items:center}
.cell.c100{background:var(--h100)}.cell.c10{background:var(--h10)}.cell.c1{background:var(--h1)}
.cell:active{filter:brightness(.95)}
.cell svg{width:100%;height:58px;display:block}
.cell.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.cell.fix{border-color:var(--no)}
.erase{border:0;border-radius:14px;background:var(--soft);display:grid;place-items:center;padding:0}
.erase svg{width:28px;height:28px}
.legend{display:flex;justify-content:center;gap:16px;font-size:14px;color:var(--mut);margin-top:6px}
.legend b{font-weight:800}
.banner{margin:10px 0 0;padding:8px 10px;border-radius:16px;text-align:center;font:600 19px var(--fd)}
.banner.good{background:var(--okt);color:var(--ok)}
.banner.bad{background:var(--not);color:var(--no)}
.acts{margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}

/* bottom tabs (6 tabs) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:var(--chrome);border-radius:22px 22px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px var(--shadow)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;border-radius:14px;font-size:11px;font-weight:800;color:var(--chrome-mut)}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--chrome-ink);background:rgba(255,255,255,.12)}
nav button.on svg{stroke:var(--pink)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--surf);padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
/* the litter: a little room for her kittens */
.room{position:relative;height:262px;border-radius:22px;overflow:hidden;box-shadow:0 6px 18px var(--shadow);background:linear-gradient(180deg,var(--wall) 0 104px,var(--floor) 104px);margin-bottom:12px;user-select:none;-webkit-user-select:none}
.room .base{position:absolute;left:0;right:0;top:100px;height:8px;background:var(--trim)}
.room .win{position:absolute;left:7%;top:16px;width:74px;height:58px;border-radius:10px;background:linear-gradient(180deg,#9CC7FF,#D9ECFF);border:5px solid var(--surf);box-shadow:0 2px 0 var(--trim)}
.room .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--surf)}
.room .it{position:absolute;line-height:1;z-index:2}
.room .it svg{display:block}
.room .emo{font-size:34px}
.room .fly{animation:flutter 2.4s ease-in-out infinite alternate}
@keyframes flutter{to{transform:translate(10px,-8px) rotate(8deg)}}
.cat{position:absolute;width:60px;height:60px;transition:left 2.2s ease-in-out,top 2.2s ease-in-out;padding:0;border:0;background:none}
.cat .in{width:100%;height:100%;transform-origin:50% 100%}
.cat.flip .in{transform:scaleX(-1)}
.cat svg{width:100%;height:100%;display:block;overflow:visible}
.cat.walk svg{animation:hop .3s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-3px) rotate(2deg)}}
.cat .tl{transform-box:fill-box;transform-origin:0% 100%;animation:tail 1.5s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.cat .shut{display:none}.cat.sleep .eyes{display:none}.cat.sleep .shut{display:inline}
.cat.purr svg{animation:purr .1s linear 10}
@keyframes purr{50%{transform:translateX(1.5px)}}
.cat.jump svg{animation:jump .6s ease-out}
@keyframes jump{40%{transform:translateY(-16px)}}
.cat .tag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font:800 11px/1.4 var(--fb);background:var(--surf);color:var(--ink);border-radius:999px;padding:0 7px;white-space:nowrap;box-shadow:0 1px 3px var(--shadow)}
.cat.sel .tag{background:var(--pink);color:#2A1030}
.bub{position:absolute;top:-18px;left:50%;font-size:20px;pointer-events:none;animation:float 1.8s ease-out forwards;white-space:nowrap}
@keyframes float{from{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-22px)}}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dock .btn{min-height:54px;font-size:19px}
.dock .btn[disabled]{opacity:.5;box-shadow:none}
.dress{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipb{min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--soft);font:700 16px var(--fb);color:var(--ink)}
.chipb.on{background:var(--pinkt);border-color:var(--pink)}
.bar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--pink))}
.rw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rw div{border-radius:14px;background:var(--soft);padding:8px 2px 6px;text-align:center;font:700 11px/1.2 var(--fb);color:var(--mut)}
.rw div b{display:block;font-size:26px;line-height:1.2;filter:grayscale(1);opacity:.45}
.rw div.got{background:var(--pinkt);color:var(--ink)}.rw div.got b{filter:none;opacity:1}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(10,16,40,.55);display:grid;place-items:center;padding:20px}
.sheet{width:100%;max-width:360px;text-align:center;margin:0;animation:pop .3s ease-out}
.sheet .art{width:120px;height:120px;margin:0 auto 4px}
.sheet .art svg{width:100%;height:100%}
.sheet input{width:100%;min-height:54px;margin:12px 0;border-radius:16px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font:600 24px var(--fd);text-align:center;padding:0 12px}
.sheet input:focus{outline:none;border-color:var(--pink)}
@media (prefers-reduced-motion:reduce){.cat,.cat .tl,.cat.walk svg,.room .fly,.bub{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:360px){.eq{font-size:34px}.pv{grid-template-columns:50px repeat(3,1fr) 42px}}
/* club tab */
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:grid;grid-template-columns:28px 40px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:16px;background:var(--soft)}
.lb-row.me{background:var(--pinkt)}
.lb-row .rnk{font:800 15px var(--fd);color:var(--mut);text-align:center}
.lb-row .nm{font:700 15px/1.2 var(--fb);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sc{font:800 17px var(--fd);color:var(--gold);text-shadow:0 1px 3px var(--shadow);white-space:nowrap}
.lb-row .bd{font-size:13px;color:var(--mut)}
.lb-pin{margin-top:4px;padding-top:8px;border-top:1px solid var(--line)}
.toggle-row{display:flex;gap:6px;margin-bottom:10px}
.toggle-row button{flex:1;min-height:40px;border:2px solid var(--line);border-radius:12px;background:var(--soft);font:700 15px var(--fb);color:var(--ink)}
.toggle-row button.on{background:var(--pink);border-color:var(--pink);color:#2A1030}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.keypad button{min-height:52px;border:0;border-radius:14px;background:var(--soft);font:700 22px var(--fd);color:var(--ink)}
.keypad button:active{background:var(--pinkt)}
.code-display{font:800 32px var(--fd);letter-spacing:.15em;text-align:center;padding:10px;border-radius:16px;background:var(--soft);min-height:54px;margin:10px 0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-left:4px;vertical-align:middle}
.sync-dot.pending{background:var(--gold);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.4}}
nav button{font-size:10px}
</style>
<style>
/* hosted, full-screen app extras */
html{background:var(--bg)}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:536px;margin-inline:auto}
.a2hs svg{width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.a2hs button{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:rgba(127,127,127,.3);color:inherit;font-size:15px}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="grow"><div class="kick">Grade 2 · Math</div><h1>Meow <b>Math</b></h1></div>
    <div class="stars" aria-label="Stars"><i>⭐</i><span id="starN">0</span></div>
    <button class="pet" id="petSlot" aria-label="My kittens"></button>
  </header>
  <main id="view"></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="sheetwrap" hidden><div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="sheetT"></div></div>

<script>
(() => {
'use strict';
/* ---------- cloud config (inlined by build.sh) ---------- */
const __CFG__ = {"apiUrl": "https://ye4s7c5kf8.execute-api.us-west-2.amazonaws.com", "userPoolId": "us-west-2_LuiGQus4J", "clientId": "4tuo3rkbgh9rh0da2qtmeck9bc", "region": "us-west-2"};
const CLOUD_ACTIVE = !!((__CFG__.apiUrl||'') && (__CFG__.userPoolId||'') && (__CFG__.clientId||''));
const CLOUD_API = __CFG__.apiUrl || null;
const CLOUD_REGION = __CFG__.region || null;
const CLOUD_POOL = __CFG__.userPoolId || null;
const CLOUD_CLIENT = __CFG__.clientId || null;

/* ---------- saved progress (on this phone only) ---------- */
const KEY = 'kitty-math-g2-v1';
const fresh = () => ({tab:'learn', stars:0, solved:0, pv:{i:0, cur:null}, area:{}, catAreas:[], cats:[], got:0, sel:0, food:0, treats:0, water:0, streak:0, day:''});
let S = fresh();
// Initial state loaded from KEY; if signed in, overwritten below after syncMeta is restored
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(fresh(), s); } catch (e) {}
/* ---------- per-player localStorage key ---------- */
let activeKey = KEY; // updated after sign-in
const loadState = k => {
  try { const s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && typeof s === 'object') return s; } catch (e) {}
  return null;
};

const save = () => { try { localStorage.setItem(activeKey, JSON.stringify(S)); } catch (e) {} syncSoon(); };

/* ---------- CLOUD: auth + sync (inert when CLOUD_ACTIVE is false) ---------- */
const SYNC_KEY = 'meow-sync-v1';
let syncMeta = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null') || {}; } catch (e) { return {}; } })();
const saveSyncMeta = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncMeta)); } catch (e) {} };

const cognitoUrl = () => `https://cognito-idp.${CLOUD_REGION}.amazonaws.com/`;
async function cognitoCall(target, body) {
  const r = await fetch(cognitoUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-amz-json-1.1', 'X-Amz-Target': `AWSCognitoIdentityProviderService.${target}` },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok) throw Object.assign(new Error(data.message || target), { code: data.__type || 'Error' });
  return data;
}

function clientMerge(remote) {
  /* mirrors the server merge.ts logic */
  const L = S, R = remote;
  const stars = Math.max(L.stars, R.stars), solved = Math.max(L.solved, R.solved), got = Math.max(L.got, R.got);
  const area = { ...L.area }; for (const [k, v] of Object.entries(R.area || {})) area[k] = Math.max(area[k] || 0, v);
  const catAreas = [...new Set([...(L.catAreas || []), ...(R.catAreas || [])])];
  const len = Math.max((L.cats || []).length, (R.cats || []).length);
  const cats = Array.from({ length: len }, (_, i) => {
    const lc = (L.cats || [])[i], rc = (R.cats || [])[i];
    if (!lc) return { ...rc }; if (!rc) return { ...lc };
    return { name: lc.name || rc.name, coat: lc.coat, wear: [...new Set([...(lc.wear || []), ...(rc.wear || [])])] };
  });
  const useR = !L.day || R.day > L.day;
  const streak = useR ? R.streak : L.streak, day = useR ? R.day : L.day;
  const useCareR = !L._updatedAt || (R._updatedAt && R._updatedAt > L._updatedAt);
  const food = useCareR ? R.food : L.food, treats = useCareR ? R.treats : L.treats, water = useCareR ? R.water : L.water;
  return { ...L, stars, solved, area, catAreas, cats, got, streak, day, food, treats, water };
}

let syncTimer = null, syncDirty = false;
function syncSoon() {
  if (!CLOUD_ACTIVE || !syncMeta.playerId) return;
  syncDirty = true; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 3000);
}
async function syncNow() {
  if (!CLOUD_ACTIVE || !syncMeta.playerId) return;
  const tok = await CLOUD.getToken(); if (!tok) return;
  const { stars, solved, area, catAreas, cats, got, food, treats, water, streak, day } = S;
  const doc = { stars, solved, area, catAreas, cats, got, food, treats, water, streak, day };
  try {
    const r = await fetch(`${CLOUD_API}/v1/players/${syncMeta.playerId}/progress`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` },

const CLOUD = {

  async getToken() {
    if (!syncMeta.idToken) return null;
    // ID tokens last 1 hour; refresh if within 2 min of expiry
    if (syncMeta.idTokenExp && Date.now() / 1000 > syncMeta.idTokenExp - 120) {
      return await this.refresh();

  async refresh() {

      const ar = d.AuthenticationResult;
      syncMeta.idToken = ar.IdToken; syncMeta.idTokenExp = ar.ExpiresIn ? Date.now() / 1000 + ar.ExpiresIn : 0;

/* ---------- parent gate: "What is 7 × 8?" ---------- */
function parentGate(onPass) {
  const q = [[3,4],[4,5],[5,6],[6,7],[7,8],[8,9],[9,6],[4,8]][Math.floor(Math.random()*8)];
  const ans = String(q[0]*q[1]), entered = {v:''};
  const disp = h('div', {class:'code-display', style:'letter-spacing:0;font-size:28px'}, '?');
  const keypad = h('div', {class:'keypad'});
  const updateDisp = () => { disp.textContent = entered.v || '?'; };
  for (let i = 1; i <= 9; i++) keypad.append(h('button', {onclick: () => { if (entered.v.length < 3) { entered.v += i; updateDisp(); } }}, String(i)));
  keypad.append(h('button', {onclick: () => { entered.v = entered.v.slice(0,-1); updateDisp(); }}, '⌫'));
  keypad.append(h('button', {onclick: () => { if (entered.v.length < 3) { entered.v += '0'; updateDisp(); } }}, '0'));
  keypad.append(h('button', {class:'btn ok', style:'border-radius:14px', onclick: () => {
    if (entered.v === ans) { sheet.hidden = true; onPass(); }
    else { disp.style.color = 'var(--no)'; entered.v = ''; setTimeout(() => { disp.style.color = ''; disp.textContent = '?'; }, 700); }
  }}, '✓'));
  sheetBox.replaceChildren(h('h2', {id:'sheetT'}, `Ask a grown-up: ${q[0]} × ${q[1]} = ?`), h('div', {class:'hint'}, 'Type the answer to continue.'), disp, keypad);
  sheet.hidden = false;
}

/* hand out anything earned: a kitten for 10 in a new area, then rewards every 15 stars */
function grant(){
  Object.keys(S.area).forEach(area => {
    if (S.area[area] >= CAT_AT && !S.catAreas.includes(area)){
      S.catAreas.push(area); S.cats.push({name:'', coat:S.cats.length % COATS.length, wear:[]});
      queue.push({type:'name', i:S.cats.length - 1, first:S.cats.length === 1, from:AREAS[area]});

  });
  while (S.got < REWARDS.length && S.stars >= cost(S.got)){ queue.push({type:'reward', r:REWARDS[S.got]}); S.got++; }
  save(); paintStars(); paintPet(); showNext();
}

function dayTick(){
  const t = today(); if (S.day === t) return;
  const gap = S.day ? dayNum(t) - dayNum(S.day) : 1;
  if (gap < 0){ S.day = t; save(); return; }
  S.streak = S.day && gap === 1 ? (S.streak || 0) + 1 : 1;
  if (S.day) S.water = Math.max(0, (S.water || 0) - 20 * Math.min(gap, 5));

}

async function showWhoIsPlaying() {
  sheet.hidden = true;
  const players = await CLOUD.listPlayers();
  if (!players.length) {
    // First time: create a player and link it
    const newP = await CLOUD.createPlayer();
    await CLOUD.linkPlayer(newP.playerId);
    activeKey = `${KEY}:${newP.playerId}`;
    // Upload existing local progress
    await syncNow();
    toast(`Welcome, ${newP.displayName}!`);
    go('club'); return;
  }
  const kids = h('div', {style:'display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px'});
  players.forEach(p => {
    const btn = h('button', {style:'background:var(--surf);border:2px solid var(--line);border-radius:18px;padding:10px 14px;text-align:center;min-width:80px', onclick: async () => {
      sheet.hidden = true;
      syncMeta.playerId = p.playerId; saveSyncMeta();
      activeKey = `${KEY}:${p.playerId}`;
      // Load this player's local save if any, then sync
      const saved = loadState(activeKey);
      if (saved) Object.assign(S, fresh(), saved);
      await syncNow();
      grant(); paintStars(); paintPet(); go('club');
    }});
    btn.append(h('div', {style:'width:48px;height:48px;margin:0 auto', html:catSVG({coat:p.coat||0, wear:p.wear||[]})}), h('div', {style:'font:700 13px var(--fb);margin-top:4px'}, p.displayName));
    kids.append(btn);
  });
  kids.append(h('button', {style:'background:var(--soft);border:2px dashed var(--line);border-radius:18px;padding:10px 14px;min-width:80px', onclick: async () => {
    sheet.hidden = true;
    const newP = await CLOUD.createPlayer();
    await CLOUD.linkPlayer(newP.playerId);
    toast(`Welcome, ${newP.displayName}!`);
    go('club');
  }}, h('div', {style:'font-size:30px'}, '➕'), h('div', {style:'font:700 13px var(--fb);margin-top:4px'}, 'New player')));
  sheetBox.replaceChildren(h('h2', {id:'sheetT'}, '🐱 Who\'s playing?'), h('div', {class:'hint'}, 'Tap your kitten!'), kids);
  sheet.hidden = false;
}

function go(t){
  if (!VIEWS[t]) t = 'learn';
  if (cleanup){ cleanup(); cleanup = null; }
  dayTick();
  S.tab = t; save();
  document.querySelectorAll('#nav button').forEach(b => { const on = b.dataset.t === t; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const v = $('#view'); v.replaceChildren(); VIEWS[t](v); window.scrollTo(0, 0);
}
TABS.forEach(([k, l]) => $('#nav').append(h('button', {'data-t':k, onclick:() => go(k)}, h('span', {html:`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`}), l)));
S.cats.forEach((c, i) => { if (!c.name) queue.push({type:'name', i, first:i === 0}); });
grant();
paintStars(); paintPet(); go(S.tab);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { dayTick(); if (CLOUD.signedIn) syncNow(); } });
// Restore signed-in state: load the per-player key if one was active
if (CLOUD_ACTIVE && syncMeta.playerId) {
  activeKey = `${KEY}:${syncMeta.playerId}`;
  const saved = loadState(activeKey); if (saved) Object.assign(S, fresh(), saved);
  CLOUD.refresh().then(() => syncNow()).catch(() => {});
}
if (window.__TEST__) window.__T = {S:() => S, digits, makeProblem, marks, go, award, grant, dayTick, REWARDS, cost, catSVG, queue};
})();
