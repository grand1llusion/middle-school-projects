<style>
/* Layout: a soft lavender study room. Light purple ground with two blurred bubbles behind the page, a rounded header with the level ring, one column sized for a 375x667 phone, thumb-height tab bar. Fraction pieces: lavender for the first number, pink for the second, teal for new pieces; lemon highlighter marks every answer. */
:root{
  --bg:#EEE8F8; --hill1:#E3D8F5; --hill2:#D9CBF1; --surf:#FCFAFF; --chrome:#E4D9F6; --soft:#E9DFF8; --ink:#2A2140; --mut:#6A5E85; --line:#DCD0EE; --on:#FFFFFF;
  --w:#7550C4; --wt:#ECE3FA; --x:#B24E8C; --xt:#F7E2EF; --d:#2C7A88; --dt:#DCEFF2;
  --pa:#B39AEC; --pb:#F2A9CD; --pc:#86CDD8; --chz:#F8D77A; --crust:#D9973E; --brw:#9C6B4E; --brwk:#6E4632;
  --hl:#FFE47A; --hlk:#21183A; --cta:#B79CEB; --ctak:#21183A;
  --ok:#2E7D4F; --okt:#DCF1E3; --no:#B8434E; --not:#F8DFE2; --shadow:rgba(42,33,64,.08);
  --fd:'Baloo 2',ui-rounded,system-ui,sans-serif; --fb:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16111F; --hill1:#1D1629; --hill2:#241B33; --surf:#1E1729; --chrome:#251C33; --soft:#2C2240; --ink:#EEE8F8; --mut:#AA9EC2; --line:#352A47; --on:#16111F;
  --w:#B79CF0; --wt:#2D2346; --x:#EE9CCB; --xt:#3E2236; --d:#7CCAD7; --dt:#173439;
  --pa:#9C7FE0; --pb:#E48BB8; --pc:#5FB4C1; --chz:#E8C25E; --crust:#B9772C; --brw:#8A5D43; --brwk:#C9A27F;
  --hl:#F2D86A; --hlk:#21183A; --cta:#A588E2; --ctak:#16111F;
  --ok:#6CCB8E; --okt:#173A26; --no:#F08C8C; --not:#45201F; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16111F; --hill1:#1D1629; --hill2:#241B33; --surf:#1E1729; --chrome:#251C33; --soft:#2C2240; --ink:#EEE8F8; --mut:#AA9EC2; --line:#352A47; --on:#16111F;
  --w:#B79CF0; --wt:#2D2346; --x:#EE9CCB; --xt:#3E2236; --d:#7CCAD7; --dt:#173439;
  --pa:#9C7FE0; --pb:#E48BB8; --pc:#5FB4C1; --chz:#E8C25E; --crust:#B9772C; --brw:#8A5D43; --brwk:#C9A27F;
  --hl:#F2D86A; --hlk:#21183A; --cta:#A588E2; --ctak:#16111F;
  --ok:#6CCB8E; --okt:#173A26; --no:#F08C8C; --not:#45201F; --shadow:rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-inline:16px;padding-block:0 84px;background-color:var(--bg);background-image:radial-gradient(140% 60% at 112% 4%,var(--hill2) 0 30%,transparent 62%),radial-gradient(120% 55% at -18% 96%,var(--hill1) 0 34%,transparent 66%);background-attachment:fixed;color:var(--ink);font:16px/1.4 var(--fb);touch-action:manipulation;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--fd);font-weight:700;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin-inline:auto}
.u-w{--ac:var(--w);--at:var(--wt)}.u-x{--ac:var(--x);--at:var(--xt)}.u-d{--ac:var(--d);--at:var(--dt)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:-16px;padding:8px 16px 8px;display:flex;flex-direction:column;gap:6px;background:var(--chrome);border-bottom:1px solid var(--line);border-radius:0 0 20px 20px;box-shadow:0 2px 10px var(--shadow)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kick b{color:var(--w)}
.top h1{font-size:26px;line-height:1;font-weight:800;color:var(--w)}
.lv{font-size:11px;font-weight:700;color:var(--mut);text-align:right;line-height:1.25;white-space:nowrap}
.ring{position:relative;width:42px;height:42px;flex:none}
.ring svg{width:42px;height:42px;transform:rotate(-90deg)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;min-width:0;box-shadow:0 1px 2px var(--shadow)}
.pad{padding:12px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.c{text-align:center}
.big-out{font:600 21px/1.2 var(--fd);color:var(--ac,var(--ink));text-align:center;min-height:26px}
.hl{background:var(--hl);color:var(--hlk);border-radius:6px;padding:0 6px;font-weight:700}
.fx{display:block;width:100%;height:auto}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.chip{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 12px;border-radius:20px;border:2px solid transparent;background:var(--at,var(--bg));color:var(--ink);font-weight:700;line-height:1.2}

.back{min-height:38px;align-self:flex-start;padding:0 14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--chrome);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}

nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Learn */

.unit h2::after{content:"";flex:1;height:1px;background:var(--line)}
.tp{overflow:hidden;scroll-margin-top:64px}
.tp>button{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border:0;background:none;text-align:left;font-weight:700;font-size:16px}
.ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--at);font-size:19px}
.tp .dot{margin-left:auto;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.tp .dot.m{background:var(--ok);border-color:var(--ok)}
.tp .dot.h{border-color:var(--ac);background:linear-gradient(90deg,var(--ac) 50%,transparent 50%)}
.tp .body{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.stage{border-radius:14px;background:var(--at);overflow:hidden}
.rule{padding:9px 12px;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:700;text-align:center;font-size:15px;border:1px solid var(--line)}
input[type=range]{width:100%;height:34px;accent-color:var(--ac,var(--x))}
.tile{min-height:52px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surf);font-weight:700;line-height:1.2;text-align:center;display:grid;place-items:center;font-size:15px}
.tile.sel{border-color:var(--ac,var(--ink));background:var(--at,var(--bg))}
.tile.good{border-color:var(--ok);background:var(--okt)}.tile.bad{border-color:var(--no);background:var(--not)}
.tile.dim{opacity:.35}
.def{padding:12px;border-radius:14px;background:var(--at);display:flex;flex-direction:column;gap:4px;min-height:92px}
.def b{font:600 20px var(--fd);color:var(--ac)}
.num-t{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.num-t span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surf);border:2px solid var(--line);font:600 20px var(--fd);transition:transform .25s}
.num-t span.mid{background:var(--hl);border-color:var(--hlk);color:var(--hlk)}
.num-t span.mo{border-color:var(--ac);background:var(--at)}

.fc{perspective:1000px;height:260px;position:relative;touch-action:pan-y}
.fc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}

.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;border-radius:20px;border:2px solid var(--ac);background:var(--surf);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:var(--at)}
.face .q{font:600 30px/1.1 var(--fd)}
.face .a{font:700 19px/1.3 var(--fb)}
.face .tapn{position:absolute;bottom:10px;font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac,var(--x));border-radius:99px;transition:width .3s}

/* Practice engine */
.dots{display:flex;gap:3px}
.dots i{flex:1;height:7px;border-radius:99px;background:var(--line)}
.dots i.g{background:var(--ok)}.dots i.b{background:var(--no)}.dots i.c{background:var(--ink)}.dots i.m{background:var(--x)}
.ctx{padding:10px 12px;border-radius:14px;background:var(--at);display:flex;flex-direction:column;gap:6px;font-size:15px}
.pq{font:600 19px/1.22 var(--fd)}
.opt{display:block;width:100%;min-height:48px;padding:8px 14px;text-align:left;border:2px solid var(--line);background:var(--surf);border-radius:14px;font-weight:700;font-size:16px;line-height:1.25}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.good{border-color:var(--ok);background:var(--okt)}
.opt.bad{border-color:var(--no);background:var(--not)}
.opts{display:grid;gap:8px}
.opts.g2{grid-template-columns:1fr 1fr}.opts.g2 .opt{text-align:center;padding:8px 6px;font-size:15px}
.opts.big .opt{min-height:72px;font-size:18px;text-align:center}
.ord{display:flex;flex-direction:column;gap:5px}
.ord .slot{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border-radius:12px;border:2px dashed var(--line);font-weight:700}
.ord .slot i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--at,var(--bg));font-size:13px;flex:none}
.ord .slot.full{border-style:solid;border-color:var(--ac,var(--ink));background:var(--surf)}
.ord .slot.good{border-color:var(--ok);background:var(--okt)}.ord .slot.bad{border-color:var(--no);background:var(--not)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:42px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font-weight:700;font-size:15px}
.pick button.sel{border-color:var(--ink);background:var(--hl);color:var(--hlk)}
.pick button.good{border-color:var(--ok);background:var(--okt)}.pick button.bad{border-color:var(--no);background:var(--not)}
.pick button:disabled{opacity:.35}
.blank{min-width:64px;min-height:42px;padding:4px 12px;border-radius:12px;border:2px dashed var(--mut);background:var(--surf);font:600 19px var(--fd);color:var(--ink);vertical-align:middle}
.blank.on{border:2px solid var(--w);box-shadow:0 0 0 3px var(--wt)}
.blank.good{border:2px solid var(--ok);background:var(--okt)}.blank.bad{border:2px solid var(--no);background:var(--not)}
.blank:empty::before{content:"?";color:var(--mut)}
.fld{display:flex;align-items:center;gap:8px;font-weight:700}
.fld .lab{min-width:62px}.fld .post{font-weight:700}
.flds3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flds3 .fld{flex-direction:column;align-items:stretch;gap:3px}.flds3 .fld .lab{min-width:0;font-size:13px;text-align:center;color:var(--mut)}.flds3 .blank{width:100%;min-width:0}
.pick.g2{display:grid;grid-template-columns:1fr 1fr}.pick.g2 button{font-size:14px;line-height:1.2}
.pad4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad4 button{min-height:40px;border-radius:12px;background:var(--surf);border:2px solid var(--line);font:600 20px var(--fd)}
.pad4 button:active{background:var(--cta);color:var(--ctak)}
.pad4 .sm{font-size:15px}
.padhint{font-size:12px;color:var(--mut);text-align:center}
.fb{padding:10px 12px;border-radius:14px;font-weight:700}
.fb.good{background:var(--okt);border:2px solid var(--ok)}
.fb.bad{background:var(--not);border:2px solid var(--no)}
table.tb{border-collapse:collapse;font-weight:700;margin:2px auto}
.tb th,.tb td{border:1px solid var(--mut);padding:4px 9px;text-align:center;min-width:40px}
.tb th{background:var(--bg);font-family:var(--fd);font-weight:600}
.hpbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}

.score{font:700 58px/1 var(--fd);text-align:center}
.mrow{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center;padding:8px 12px}
.mrow .nm{font-weight:700;font-size:15px;line-height:1.2}
.pct{font-size:13px;font-weight:700;text-align:right;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:700;font-size:15px}
.chk:last-child{border-bottom:0}
.chk i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:15px}
.chk.on i{background:var(--ok);border-color:var(--ok);color:var(--on)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.78em;margin-inline:1px}
.fr i{font-style:normal;padding:0 2px}.fr i:first-child{border-bottom:2px solid currentColor}
.ex{font:700 26px/1.25 var(--fd);white-space:nowrap}
.exs{font:700 20px/1.3 var(--fd)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.opts.viz .opt{padding:4px 6px}
.work{font:600 17px/1.5 var(--fd);display:flex;flex-direction:column;gap:2px}

.kcc{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.kcc span{min-width:58px;min-height:58px;padding:4px 10px;border-radius:14px;display:grid;place-items:center;border:2px solid var(--line);background:var(--surf);font:800 26px var(--fd);transition:all .25s}
.kcc span.k{border-color:var(--ok);background:var(--okt)}.kcc span.c{border-color:var(--hlk);background:var(--hl);color:var(--hlk)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.wl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:nowrap}
.wl .hint{font-family:var(--fb);text-align:right;font-size:12.5px}
.work .on{background:var(--hl);color:var(--hlk);border-radius:6px;padding:0 4px}
.fb4{display:flex;align-items:center;justify-content:center;gap:10px;font:800 26px var(--fd)}
.fbx{display:flex;flex-direction:column;align-items:center;gap:4px}
.fbx i{display:block;width:58px;height:3px;border-radius:2px;background:var(--ink)}
.bx{width:54px;height:46px;border-radius:12px;border:2px dashed var(--mut);background:var(--surf);font:800 24px var(--fd);color:var(--ink)}
.bx.on{border:2px solid var(--w);box-shadow:0 0 0 3px var(--wt)}
.bx.good{border:2px solid var(--ok);background:var(--okt)}.bx.bad{border:2px solid var(--no);background:var(--not)}
.tiles6{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiles6 button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font:800 22px var(--fd)}
.tiles6 button:active{background:var(--cta)}
.tiles6 .sm{font:700 15px var(--fb);grid-column:span 2}
.pad4 .zero{grid-column:span 2}

.blank .fr{font-size:.82em}
.grid3 .tile{min-height:60px}
.ctx.blk{display:block;line-height:1.5}
.opt .fr{font-size:.95em}
.chip .fr{font-size:.85em}
:focus-visible{outline:3px solid var(--w);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    if (r.cross) for (let k = r.cross[0]; k < r.cross[1]; k++){ const x = x0 + k * pw, m = Math.min(5, pw * .25); s += `<path d="M${r2(x + m)} ${y + 5}L${r2(x + pw - m)} ${y + BH - 5}M${r2(x + pw - m)} ${y + 5}L${r2(x + m)} ${y + BH - 5}" stroke="var(--no)" stroke-width="2.2" stroke-linecap="round"/>`; }
    s += `<rect x="${x0}" y="${y}" width="${r2(bw)}" height="${BH}" rx="3" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
    if (r.lab) s += r.lab.d === 1 || r.lab.n >= r.lab.d ? sMx(LW / 2, y + BH / 2, r.lab, r.col || 'var(--ink)', 12) : sFr(LW / 2, y + BH / 2, r.lab.n, r.lab.d, r.col || 'var(--ink)', 12);
    if (r.tag) s += `<text x="${r2(x1 + 6)}" y="${y + BH / 2 + 5}" font-size="13" font-weight="800" fill="var(--ink)">${r.tag}</text>`;
  });
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label || 'Fraction bars'}" data-bars="${rows.map(r => r.parts + ':' + (typeof r.on === 'number' ? r.on : (r.on || []).length)).join(',')}">${s}</svg>`;
}

/* n pizzas (or brownies), each cut into k equal pieces. Friend 1's piece of each one is colored. */
function pies(n, k, sq){
  const W = 320, per = n <= 5 ? n : Math.ceil(n / 2), rows = Math.ceil(n / per), cell = Math.min(62, (W - 8) / per), R = cell / 2 - 5, H = rows * cell + 6;
  let s = '';
  for (let i = 0; i < n; i++){
    const r = Math.floor(i / per), c = i % per, inRow = r === rows - 1 ? n - per * (rows - 1) : per, cx = (W - inRow * cell) / 2 + c * cell + cell / 2, cy = 3 + r * cell + cell / 2;
    if (sq){
      const x = cx - R, y = cy - R, sw = 2 * R / k;
      s += `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(2 * R)}" height="${r2(2 * R)}" rx="5" fill="var(--brw)"/><rect x="${r2(x)}" y="${r2(y)}" width="${r2(sw)}" height="${r2(2 * R)}" rx="3" fill="var(--x)"/>`;
      for (let j = 1; j < k; j++) s += `<line x1="${r2(x + j * sw)}" x2="${r2(x + j * sw)}" y1="${r2(y)}" y2="${r2(y + 2 * R)}" stroke="var(--surf)" stroke-width="1.6"/>`;
      s += `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(2 * R)}" height="${r2(2 * R)}" rx="5" fill="none" stroke="var(--brwk)" stroke-width="2"/>`;
    } else {
      const P = a => [cx + R * Math.cos(a), cy + R * Math.sin(a)], a0 = -Math.PI / 2, a1 = a0 + 2 * Math.PI / k, [x0, y0] = P(a0), [x1, y1] = P(a1);
      s += `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(R)}" fill="var(--chz)" stroke="var(--crust)" stroke-width="3"/>`;
      s += `<path d="M${r2(cx)} ${r2(cy)}L${r2(x0)} ${r2(y0)}A${r2(R)} ${r2(R)} 0 ${k < 2 ? 1 : 0} 1 ${r2(x1)} ${r2(y1)}Z" fill="var(--x)"/>`;
      for (let j = 0; j < k; j++){ const [x, y] = P(a0 + j * 2 * Math.PI / k); s += `<line x1="${r2(cx)}" y1="${r2(cy)}" x2="${r2(x)}" y2="${r2(y)}" stroke="var(--crust)" stroke-width="1.6"/>`; }
    }
  }
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="${n} ${sq ? 'brownies' : 'pizzas'}, each cut into ${k} equal pieces" data-share="${n}/${k}">${s}</svg>`;
}

/* number line with fraction ticks. o: {min, max, den, w, arr:[{a, b, c, t}], pts:[{x, t, c}]} (a, b, x are fractions {n,d}) */
function nlF(o){
  const W = o.w || 320, P = 14, hasArc = (o.arr || []).length, y0 = hasArc ? (o.arcLab === false ? 52 : 76) : 30, H = y0 + 30;
  const X = v => P + (v - o.min) / (o.max - o.min) * (W - 2 * P), n = Math.round((o.max - o.min) * o.den);
  let s = `<rect width="${W}" height="${H}" rx="10" fill="var(--surf)"/><line x1="5" x2="${W - 5}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-width="2"/><path d="M3 ${y0}l7-5v10zM${W - 3} ${y0}l-7-5v10z" fill="var(--ink)"/>`;
  for (let k = 0; k <= n; k++){
    const v = o.min + k / o.den, big = k % o.den === 0, x = r2(X(v));
    s += `<line x1="${x}" x2="${x}" y1="${y0 - (big ? 8 : 5)}" y2="${y0 + (big ? 8 : 5)}" stroke="var(--ink)" stroke-width="${big ? 1.8 : 1.1}"/>`;
    if (big) s += `<text x="${x}" y="${y0 + 23}" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">${Math.round(v)}</text>`;
  }
  (o.arr || []).forEach(a => {
    const x1 = X(qv(a.a)), x2 = X(qv(a.b)), mx = (x1 + x2) / 2, cy = y0 - 46, c = a.c || 'var(--x)';
    const ex = x2 - 1, ey = y0 - 4, dx = ex - mx, dy = ey - cy, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    s += `<path d="M${r2(x1)} ${y0 - 3}Q${r2(mx)} ${cy} ${r2(ex - ux * 7)} ${r2(ey - uy * 7)}" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>`;
    s += `<path d="M${r2(ex)} ${r2(ey)}L${r2(ex - ux * 10 - uy * 5)} ${r2(ey - uy * 10 + ux * 5)}L${r2(ex - ux * 10 + uy * 5)} ${r2(ey - uy * 10 - ux * 5)}Z" fill="${c}"/>`;
    if (a.t && o.arcLab !== false) s += sMx(mx, y0 - 58, a.t, c, 11);
  });
  (o.pts || []).forEach(p => { const x = X(qv(p.x)); s += `<circle cx="${r2(x)}" cy="${y0}" r="5.5" fill="${p.c || 'var(--ink)'}" stroke="var(--surf)" stroke-width="1.5"/>`; if (p.t) s += `<text x="${r2(x)}" y="${y0 - 11}" font-size="12" font-weight="800" text-anchor="middle" fill="${p.c || 'var(--ink)'}">${p.t}</text>`; });
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line from ${o.min} to ${o.max} in ${unitName(o.den)}" data-arr="${(o.arr || []).map(a => MXt(a.a) + '>' + MXt(a.b)).join(',')}">${s}</svg>`;
}
/* a number line that fits these values, or null when the ticks would be too crowded */
function fitLine(vals, den, extra){
  const max = Math.max(1, Math.ceil(Math.max(...vals.map(qv)) - 1e-9));
  return max * den <= 48 ? nlF(Object.assign({min:0, max, den}, extra || {})) : null;
}

/* tape diagram. rows: [{lab, segs:[{v, t, c, dash}]}], all drawn to one scale */
function tape(rows, o){
  o = o || {};
  const W = o.w || 320, LW = o.lw || 74, BH = 30, G = 10, max = o.max || Math.max(...rows.map(r => r.segs.reduce((s, g) => s + qv(g.v), 0))), sc = (W - LW - 6) / max, H = rows.length * (BH + G) - G + 6;
  let s = '';
  rows.forEach((r, i) => {
    const y = 3 + i * (BH + G); let x = LW;
    s += `<text x="${LW - 6}" y="${y + BH / 2 + 4}" font-size="11.5" font-weight="700" text-anchor="end" fill="var(--ink)">${r.lab}</text>`;
    r.segs.forEach(g => {
      const w = qv(g.v) * sc;
      s += `<rect x="${r2(x)}" y="${y}" width="${r2(w)}" height="${BH}" rx="5" fill="${g.dash ? 'var(--surf)' : g.c || 'var(--wt)'}" stroke="var(--ink)" stroke-width="1.6"${g.dash ? ' stroke-dasharray="5 3"' : ''}/>`;
      if (g.t) s += `<text x="${r2(x + w / 2)}" y="${y + BH / 2 + 5}" font-size="12.5" font-weight="800" text-anchor="middle" fill="${g.dash ? 'var(--ink)' : 'var(--hlk)'}">${g.t}</text>`;
      x += w;
    });
  });
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label || 'Tape diagram'}">${s}</svg>`;
}

/* ---------- QUESTIONS ---------- */
const MC = o => Object.assign({type:'mc'}, o);
const shufMC = (o, correct, wrongs) => { const all = shuffle([correct, ...wrongs]); return MC(Object.assign(o, {choices:all, answer:all.indexOf(correct)})); };
const NUM = (o, q, extra) => Object.assign({type:'num', blanks:[Object.assign({answer:qv(q), show:MX(q)}, extra || {})]}, o);
/* wrong answers that are real, positive, and all different from the right one and each other */
const uniqVals = (right, list, n) => { const seen = [right], out = []; for (const w of list){ if (w && w.n > 0 && w.d > 0 && !seen.some(s => qeq(s, w))){ seen.push(w); out.push(w); } if (out.length === (n || 3)) break; } return out; };
const cap = s => s[0].toUpperCase() + s.slice(1);
const WHO = [['Miss Song','she'],['Mr. Diaz','he'],['Coach Lee','she'],['Grandpa Joe','he'],['Aunt Rosa','she'],['Mr. Patel','he']];

/* 1 · fair shares: a ÷ b = a/b */
const SHARE = [
  {k:'pizza', t:(a,b) => `🍕 <b>${a}</b> pizza${a > 1 ? 's are' : ' is'} shared equally by <b>${b}</b> friends.`, q:'How much pizza does each friend get?', post:'pizza', fig:true},

function g1(){
  const r = Math.random(); let a, b; do { a = rnd(1, 12); b = rnd(2, 9); } while (a % b === 0);

    return NUM({skill:1, title:'Share it', ctx:T.t(a, b), fig:T.fig ? pies(a, b) : null, prompt:T.q, why:whyShare(a, b), kind:'num', chk:{e:`${a} ÷ ${b}`}}, Q(a, b), {post:T.post});
  }
  if (r < .82){

    add(fr(a, b), true); add(`${a} ÷ ${b}`, true); add(fr(b, a), false); add(`${b} ÷ ${a}`, false);
    if (s.d !== b){ add(fr(s.n, s.d), true); add(fr(s.d, s.n), false); } else { add(fr(a * 2, b * 2), true); add(fr(b * 2, a * 2), false); }
    if (a > b) add(MX(s), true);
    const T = pick(SHARE.slice(1)), order = shuffle(opts.map((_, i) => i));

}

/* 2 · like units */
function g2(){
  const r = Math.random(), [a, b] = unlike(DEN, 40), L = lcm(a.d, b.d), A = up(a, L), B = up(b, L);

/* 6 · subtract mixed numbers (rename a whole) */
function g6(){

/* 7 · estimate and compare */
const HALF = Q(1, 2), BENCH = ['Close to 0','Close to ½','Close to 1'], DS = [3,4,5,6,8,10,12];
const lessHalf = () => { let f; do f = rfrac(DS); while (qcmp(f, HALF) >= 0); return f; };
const moreHalf = () => { let f; do f = rfrac(DS); while (qcmp(f, HALF) <= 0); return f; };
const ITEMS = [['the gold chain','the silver chain','in.'],['the red ribbon','the blue ribbon','in.'],['Mia’s rope','Leo’s rope','ft'],['the purple yarn','the green yarn','yd']];
function g7(){
  const r = Math.random();
  if (r < .3){
    let f, near; for (;;){ f = rfrac([3,4,5,6,7,8,9,10,12]); const v = qv(f), ds = [v, Math.abs(v - .5), 1 - v]; near = ds.indexOf(Math.min(...ds)); const s = ds.slice().sort((x, y) => x - y); if (s[1] - s[0] >= 1 / 12 - 1e-9) break; }
    const why = near === 0 ? `${f.n} is much less than half of ${f.d} (${half(f.d)}), so ${FR(f)} is close to 0.` : near === 1 ? `${f.n} is close to half of ${f.d} (${half(f.d)}), so ${FR(f)} is close to ½.` : `${f.n} is almost all of ${f.d}, so ${FR(f)} is close to 1.`;
    return MC({skill:7, title:'Benchmark', prompt:`Is ${EX(FR(f))} closest to 0, ½, or 1?`, choices:BENCH, answer:near, why:why + nlF({min:0, max:1, den:f.d, pts:[{x:f, c:'var(--x)'}]}), kind:'bench', chk:{f:[f.n, f.d]}});
  }
  if (r < .56){
    const [n1, n2, unit] = pick(ITEMS), W = rnd(2, 5), lowFirst = Math.random() < .5;
    const mk = (fn) => { const wa = rnd(0, W); return [qadd(Q(wa), fn()), qadd(Q(W - wa), fn())]; };
    const low = mk(lessHalf), high = mk(moreHalf), sets = lowFirst ? [low, high] : [high, low], win = lowFirst ? 1 : 0, names = [n1, n2], wn = names[win], ln = names[1 - win];
    const list = s => s.map(x => `<b>${MX(x)}</b> ${unit}`).join(' and ');
    const right = `${cap(wn)} is longer. Both have ${W} wholes, but the fractions in ${wn} are each more than ½, so together they make more than 1. The fractions in ${ln} are each less than ½.`;
    const wrongs = [`${cap(ln)} is longer. Its fractions have bigger bottom numbers, so they are bigger pieces.`, `They are the same, because both have ${W} wholes.`, `You can’t tell without adding them all.`];
    return Object.assign(shufMC({skill:7, title:'Compare', ctx:`⛓️ ${cap(n1)}: ${list(sets[0])}<br>⛓️ ${cap(n2)}: ${list(sets[1])}`, prompt:'Without finding the actual sums, which is longer in all?', why:right}, right, wrongs), {kind:'cmp', chk:{sets:sets.map(s => s.map(x => [x.n, x.d])), names, win}});
  }
  if (r < .78){
    const less = Math.random() < .5; let a, b; do { a = less ? lessHalf() : moreHalf(); b = less ? lessHalf() : moreHalf(); } while (a.d === b.d);
    return MC({skill:7, title:'More or less than 1?', prompt:`Without adding: is ${EX(FR(a), '+', FR(b))} more or less than 1?`, choices:['Less than 1','More than 1'], answer:less ? 0 : 1, layout:'g2', why:`${FR(a)} and ${FR(b)} are both ${less ? 'less' : 'more'} than ½, so the sum is ${less ? 'less' : 'more'} than ½ + ½ = 1. (It is ${MX(qadd(a, b))}.)`, kind:'vs1', chk:{a:[a.n, a.d], b:[b.n, b.d]}});
  }
  const near = () => { let f; do f = rfrac([4,5,6,8,10,12]); while (qcmp(f, Q(1, 4)) > 0 && qcmp(f, Q(3, 4)) < 0); return f; };
  let a, b, est; for (;;){ a = qadd(Q(rnd(1, 7)), near()); b = qadd(Q(rnd(1, 7)), near()); est = Math.round(qv(a)) + Math.round(qv(b)); if (Math.abs(qv(qadd(a, b)) - est) < .5 - 1e-9) break; }
  const vals = shuffle([est, est + 1, est - 1, est + 2]);
  return MC({skill:7, title:'Estimate', prompt:`${EX(MX(a), '+', MX(b))} is about…`, choices:vals.map(v => 'about ' + v), answer:vals.indexOf(est), layout:'g2', why:`${MX(a)} is close to ${Math.round(qv(a))} and ${MX(b)} is close to ${Math.round(qv(b))}. ${Math.round(qv(a))} + ${Math.round(qv(b))} = <b>${est}</b>. (Exact: ${MX(qadd(a, b))}.)`, kind:'est', chk:{a:[a.n, a.d], b:[b.n, b.d], vals}});
}

/* 9 · mistake detective */
const DET = ['Added the denominators','Forgot the whole numbers','Didn’t rename a whole first','Flipped the division','Nothing! The work is right'];
const DETK = ['den','whole','rename','flip','ok'];
function detCase(type){
  const [who] = pick(WHO), ok = type === 'ok', base = ok ? pick(['den','whole','rename','flip']) : type;
  if (base === 'den'){
    const [a, b] = unlike(DEN, 24), L = lcm(a.d, b.d), A = up(a, L), B = up(b, L), s = qadd(a, b);
    return {who, lines:[`${FR(a)} + ${FR(b)}`, `= ${fr(A, L)} + ${fr(B, L)}`, ok ? `= ${fr(A + B, L)}` : `= ${fr(A + B, 2 * L)}`], fin:ok ? Q(A + B, L) : Q(A + B, 2 * L), right:s, e:`${MXt(a)} + ${MXt(b)}`,
      why:ok ? `Every line checks out: ${fr(A, L)} + ${fr(B, L)} = ${fr(A + B, L)}.` : `Line 3 added the denominators. ${cap(unitName(L))} plus ${unitName(L)} are still ${unitName(L)}: ${fr(A, L)} + ${fr(B, L)} = <b>${MX(s)}</b>.`};
  }
  if (base === 'whole'){
    let a, b, L, P; do { const [f1, f2] = unlike(DEN, 24); L = lcm(f1.d, f2.d); a = qadd(Q(rnd(1, 6)), f1); b = qadd(Q(rnd(1, 6)), f2); P = up(f1, L) + up(f2, L); } while (P >= L);
    const s = qadd(a, b), W = whole(a) + whole(b);
    return {who, lines:[`${MX(a)} + ${MX(b)}`, `= ${MXL(whole(a), up(part(a), L), L)} + ${MXL(whole(b), up(part(b), L), L)}`, ok ? `= ${MXL(W, P, L)}` : `= ${fr(P, L)}`], fin:ok ? s : Q(P, L), right:s, e:`${MXt(a)} + ${MXt(b)}`,
      why:ok ? `Wholes ${whole(a)} + ${whole(b)} = ${W}, fractions ${fr(P, L)}. Right!` : `The fractions are right, but the wholes ${whole(a)} + ${whole(b)} = ${W} went missing. The answer is <b>${MX(s)}</b>.`};
  }
  if (base === 'rename'){
    let a, b, L, pa, pb; do { const [f1, f2] = unlike(DEN, 24); L = lcm(f1.d, f2.d); a = qadd(Q(rnd(3, 9)), f1); b = qadd(Q(rnd(1, whole(a) - 1)), f2); pa = up(f1, L); pb = up(f2, L); } while (pa >= pb);
    const wa = whole(a), wb = whole(b), s = qsub(a, b);
    return {who, lines:[`${MX(a)} − ${MX(b)}`, `= ${MXL(wa, pa, L)} − ${MXL(wb, pb, L)}`, ok ? `= ${MXL(wa - 1, pa + L, L)} − ${MXL(wb, pb, L)}` : `= ${MXL(wa - wb, pb - pa, L)}`].concat(ok ? [`= ${MXL(wa - 1 - wb, pa + L - pb, L)}`] : []), fin:ok ? s : Q((wa - wb) * L + pb - pa, L), right:s, e:`${MXt(a)} − ${MXt(b)}`,
      why:ok ? `${fr(pa, L)} is too small, so 1 whole was renamed. Every line checks out.` : `${fr(pa, L)} is less than ${fr(pb, L)}, so the last line took ${pa} from ${pb} instead. Rename first: ${MXL(wa, pa, L)} = ${MXL(wa - 1, pa + L, L)}. The answer is <b>${MX(s)}</b>.`};
  }
  let N0, k; do { N0 = rnd(3, 12); k = rnd(2, 8); } while (N0 === k || N0 % k === 0 || k % N0 === 0);
  return {who, ctx:`<b>${N0}</b> cups of water are poured equally into <b>${k}</b> glasses. How much is in each glass?`, lines:ok ? [`${N0} ÷ ${k}`, `= ${fr(N0, k)}`] : [`${k} ÷ ${N0}`, `= ${fr(k, N0)}`], fin:ok ? Q(N0, k) : Q(k, N0), right:Q(N0, k), e:`${N0} ÷ ${k}`,
    why:ok ? `${N0} cups shared by ${k} glasses is ${N0} ÷ ${k} = ${fr(N0, k)}. Right!` : `It should be cups ÷ glasses: ${N0} ÷ ${k} = <b>${MX(Q(N0, k))}</b>. ${N0 > k ? 'More cups than glasses, so each glass gets more than 1 cup.' : 'Fewer cups than glasses, so each glass gets less than 1 cup.'}`};
}
function g9(){
  const type = pick(['den','den','whole','rename','rename','flip','ok']), c = detCase(type);
  const work = `${c.ctx ? `<div>${c.ctx}</div>` : ''}<div class="work" style="font-size:16px"><div class="hint">🕵️ ${c.who}’s work</div>${c.lines.map((l, i) => `<div>Line ${i + 1}: ${l}</div>`).join('')}</div>`;
  if (type !== 'ok' && Math.random() < .3) return NUM({skill:9, title:'Fix it', ctx:work, prompt:'Something is wrong. What is the right answer?', why:c.why, kind:'num', chk:{e:c.e}}, c.right);
  return MC({skill:9, title:'What went wrong?', ctx:work, prompt:'What went wrong?', choices:DET, answer:DETK.indexOf(type), why:c.why, kind:'det', chk:{type, e:c.e, fin:[c.fin.n, c.fin.d]}});
}

const partMax = p => p.type === 'boxes' ? 1 : p.type === 'rows' ? p.rows.length : p.type === 'num' ? p.blanks.length : p.type === 'multi' && !p.all ? p.pick : 1;
/* what a student types: 4, −3.5, 3/4, −3 1/3 */
function parseNum(t){
  let s = String(t == null ? '' : t).replace(/−/g,'-').trim(); if (!s) return NaN;
  let sg = 1; if (s[0] === '-'){ sg = -1; s = s.slice(1).trim(); }
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[3] ? sg * (+m[1] + m[2] / m[3]) : NaN;
  m = s.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/); if (m) return +m[2] ? sg * m[1] / m[2] : NaN;
  return /^\d*\.?\d+$|^\d+\.$/.test(s) ? sg * Number(s) : NaN;
}
/* boxes: r = [top1, bottom1, top2, bottom2]; any pair that makes the target counts */
const boxesRight = (p, r) => !!r && r.length === 4 && r.every(v => v > 0) && (r[0] * r[3] + r[2] * r[1]) * p.target.d === p.target.n * r[1] * r[3];
const isRight = (typed, b) => { const u = parseNum(typed); return isFinite(u) && Math.abs(u - b.answer) <= (b.tol || 1e-6); };
function grade(p, r){
  const max = partMax(p);
  if (p.type === 'mc') return {got: r === p.answer ? 1 : 0, max};
  if (p.type === 'boxes') return {got: boxesRight(p, r) ? 1 : 0, max};
  if (p.type === 'rows') return {got: p.rows.filter((row,i) => r && r[i] === row.a).length, max};
  if (p.type === 'num') return {got: p.blanks.filter((b,i) => r && isRight(r[i], b)).length, max};
  if (p.type === 'order') return {got: r && r.length === p.items.length && r.every((v,i) => v === i) ? 1 : 0, max};
  if (p.all) return {got: r && r.length === p.correct.length && r.every(i => p.correct.includes(i)) ? 1 : 0, max};
  return {got: Math.min(p.pick, (r || []).filter(i => p.correct.includes(i)).length), max};
}

const pretty = v => { const t = String(v == null ? '' : v); let m = t.match(/^(\d+) (\d+)\/(\d+)$/); if (m) return m[1] + fr(m[2], m[3]); m = t.match(/^(\d+)\/(\d+)$/); if (m) return fr(m[1], m[2]); return t.replace(/ /g, '&nbsp;'); };
function answerText(p){
  if (p.type === 'mc') return p.choices[p.answer];
  if (p.type === 'boxes') return p.show;
  if (p.type === 'rows') return p.rows.map(r => `${r.h} ${r.opts[r.a]}`).join(' · ');
  if (p.type === 'num') return p.blanks.map(b => `${b.label ? b.label + ' ' : ''}${b.pre || ''}${b.show || N(b.answer)}${b.post ? ' ' + b.post : ''}`).join(' · ');
  if (p.type === 'order') return p.items.join(' → ');
  return (!p.all && p.correct.length > p.pick ? `Any ${p.pick}: ` : '') + p.correct.map(i => p.choices[i]).join(' and ');
}
function userText(p, r){
  if (r == null || (Array.isArray(r) && !r.length)) return '(no answer)';
  if (p.type === 'mc') return p.choices[r];
  if (p.type === 'boxes') return r.every(v => v != null) ? `${fr(r[0], r[1])} + ${fr(r[2], r[3])}` : '(not finished)';
  if (p.type === 'rows') return p.rows.map((row,i) => `${row.h} ${r[i] != null ? row.opts[r[i]] : '–'}`).join(' · ');
  if (p.type === 'num') return p.blanks.map((b,i) => `${b.label ? b.label + ' ' : ''}${pretty(r[i]) || '–'}`).join(' · ');
  if (p.type === 'order') return r.map(i => p.items[i]).join(' → ');
  return r.map(i => p.choices[i]).join(', ');
}

function gmHalf(){
  if (Math.random() < .6){
    let f; do f = rfrac([3,4,5,6,7,8,9,10,12]); while (!qcmp(f, HALF));
    const more = qcmp(f, HALF) > 0;
    return {prompt:`${EX(FR(f))}`, sub:'More or less than ½?', choices:['Less than ½','More than ½'], answer:more ? 1 : 0, cols:2, big:true, why:`Half of ${f.d} is ${half(f.d)}. ${f.n} is ${more ? 'more' : 'less'}.`, val:[f.n, f.d, 'h']};
  }
  const less = Math.random() < .5; let a, b; do { a = less ? lessHalf() : moreHalf(); b = less ? lessHalf() : moreHalf(); } while (a.d === b.d);
  return {prompt:`${EX(FR(a), '+', FR(b))}`, sub:'More or less than 1?', choices:['Less than 1','More than 1'], answer:less ? 0 : 1, cols:2, big:true, why:`Both are ${less ? 'less' : 'more'} than ½, so the sum is ${less ? 'less' : 'more'} than 1.`, val:[a.n, a.d, b.n, b.d]};
}
function gmPizza(){
  let n, k; do { n = rnd(1, 8); k = rnd(2, 6); } while (n === k || n % k === 0);
  const pool = [[n, k]]; [[k, n], [n, k + 1], [n + 1, k], [n - 1, k], [n, k - 1], [n + 2, k]].forEach(([a, b]) => { if (pool.length < 4 && a > 0 && b > 1 && a !== b && !pool.some(([x, y]) => x * b === a * y)) pool.push([a, b]); });
  const all = shuffle(pool), lab = all.map(([a, b]) => fr(a, b));
  return {prompt:`🍕 ${n} pizza${n > 1 ? 's' : ''}, ${k} friends. How much does each friend get?`, fig:pies(n, k), choices:lab, answer:all.findIndex(([a, b]) => a === n && b === k), cols:2, why:whyShare(n, k), val:[n, k]};
}
function gmPotion(){
  let a, c, T; for (;;){ const [x, y] = unlike([2,3,4,5,6,8,12], 24); a = x; c = y; T = qadd(a, c); if (qcmp(T, Q(1)) <= 0) break; }
  const L0 = lcm(a.d, c.d), wrongs = uniqVals(c, [Q(T.n - a.n, T.d - a.d), qadd(c, Q(1, L0)), Q(c.n, c.d + 1), qsub(c, Q(1, L0)), Q(c.n + 1, c.d)]).map(FR), all = shuffle([FR(c), ...wrongs]);
  const fig = bars([{parts:L0, on:up(a, L0), col:PA, lab:a}, {parts:L0, fills:Array.from({length:L0}, (_, k) => k < up(T, L0) ? 'var(--hl)' : 'var(--surf)'), lab:T}], {bh:22});
  return {prompt:`🧪 The cauldron has ${EXs(FR(a))}. Fill it to exactly ${EXs(FR(T))}. Which bottle?`, fig, choices:all, answer:all.indexOf(FR(c)), cols:2, why:`${FR(T)} − ${FR(a)}: in ${unitName(L0)}, ${fr(up(T, L0), L0)} − ${fr(up(a, L0), L0)} = ${fr(up(c, L0), L0)} = ${FR(c)}.`, val:[a.n, a.d, T.n, T.d, c.n, c.d]};
}

function playGame(box, G, exit){
  const st = {n:0, score:0, streak:0, best:0, tl:G.time || 0, over:false};
  let timer = null, adv = null, locked = false;
  const stop = () => { clearInterval(timer); clearTimeout(adv); timer = adv = null; };
  cleanup = stop;
  const back = backBtn('Games', () => { stop(); cleanup = null; exit(); });
  const hud = h('div',{class:'row sp',style:'font-weight:700'}), area = h('div',{class:'col'}), bar = G.time ? h('div',{class:'bar'}, h('i',{style:'width:100%;transition:width 1s linear'})) : null;

    const q = G.gen(); st.n++; locked = false; paintHud();

    q.choices.forEach((c,k) => { const b = h('button',{class:'opt',html:c,onclick:() => choose(k)}); btns.push(b); list.append(b); });
    function choose(k){
      if (locked || st.over) return; locked = true;
      const ok = k === q.answer; btns[q.answer].classList.add('good');
      if (ok){ st.score++; st.streak++; st.best = Math.max(st.best, st.streak); btns[k].classList.add('pop'); } else { st.streak = 0; btns[k].classList.add('bad','shake'); }
      paintHud();
      if (!(ok && G.time)) area.append(h('div',{class:'fb ' + (ok ? 'good' : 'bad'),html:(ok ? (st.streak >= 3 ? `🔥 ${st.streak} in a row! ` : '✓ ') : '✗ ') + q.why}));
      if (ok) adv = setTimeout(next, G.time ? 300 : 1100); else if (G.time) adv = setTimeout(next, 1500); else area.append(h('button',{class:'btn',onclick:next}, isLast() ? 'See results' : 'Next'));

    st.over = true; stop(); cleanup = null;
    const sc = st.score, prev = S.hs[G.id] || 0, nb = sc > prev; if (nb) S.hs[G.id] = sc;
    xp(sc * 3); bump(G.skill, Math.round(8 * Math.min(1, sc / G.par))); save();
    box.replaceChildren(back, h('div',{class:'card pad col c'}, h('div',{class:'lbl'}, G.name), h('div',{class:'score'}, G.rounds ? `${sc}/${G.rounds}` : String(sc)),
      h('div',{class:'big-out'}, nb && prev > 0 ? 'New best! 🎉' : sc >= G.par ? 'Great run!' : 'Nice try'), h('div',{class:'hint'}, `Best: ${S.hs[G.id]} · longest streak: ${st.best} · +${sc * 3} XP`)),
      h('div',{class:'grid2'}, h('button',{class:'btn hlb',onclick:() => playGame(box, G, exit)},'Play again'), h('button',{class:'btn ghost',onclick:exit},'All games')));
    window.scrollTo(0,0);

VIEWS.me = v => {
  const into = S.xp % 100;
  v.append(h('div',{class:'card pad col'}, h('div',{class:'row sp'}, h('b',{style:'font:600 24px var(--fd)'}, 'Level ' + lvl()), h('span',{class:'hint'}, `${S.xp} XP · ${100 - into} to next`)), h('div',{class:'bar'}, h('i',{style:`width:${into}%`})),
    h('div',{class:'grid2'}, h('div',{class:'card pad c'}, h('div',{class:'lbl'},'Mastery'), h('b',{style:'font:600 26px var(--fd)'}, overall() + '%')), h('div',{class:'card pad c'}, h('div',{class:'lbl'},'Best boss'), h('b',{style:'font:600 26px var(--fd)'}, bossStat().runs ? bossStat().best + '%' : '–')))));
  const weak = SKILLS.slice().sort((a,b) => mast(a.id) - mast(b.id))[0];
  v.append(h('button',{class:'btn hlb',onclick:() => { S.focus = weak.id; go('learn'); }}, `Practice next: ${weak.e} ${weak.n}`));
  const list = h('div',{class:'card'}), C = chk(), n = () => READY.filter((_,i) => C[i]).length, head = h('div',{class:'lbl',style:'padding:10px 12px 0'});
  const paintHead = () => head.textContent = `Before the test · ${n()} of ${READY.length} checked`;
  list.append(head, ...READY.map((t,i) => { const b = h('button',{class:'chk' + (C[i] ? ' on' : ''),onclick:() => { C[i] = !C[i]; b.classList.toggle('on', C[i]); b.firstChild.textContent = C[i] ? '✓' : ''; save(); paintHead(); if (n() === READY.length) toast('Ready for the test! 🎉'); }}, h('i',{}, C[i] ? '✓' : ''), h('span',{html:t})); return b; }));
  paintHead(); v.append(list);
  Object.entries(UNITS).forEach(([u,name]) => {
    v.append(h('div',{class:'unit u-' + u}, h('h2',{}, name)));
    SKILLS.filter(t => t.u === u).forEach(t => v.append(h('button',{class:'card mrow u-' + t.u,style:'width:100%;text-align:left',onclick:() => { S.focus = t.id; go('learn'); }},
      h('span',{class:'ico'}, t.e), h('div',{}, h('div',{class:'nm'}, t.n), h('div',{class:'bar',style:'margin-top:5px'}, h('i',{style:`width:${mast(t.id)}%`}))), h('span',{class:'pct'}, mast(t.id) + '%'))));
  });
  const rs = h('button',{class:'btn ghost',style:'color:var(--no)'},'Reset my progress'); let armed = false, to;
  rs.addEventListener('click', () => {
    if (!armed){ armed = true; rs.textContent = 'Tap again to erase everything'; clearTimeout(to); to = setTimeout(() => { armed = false; rs.textContent = 'Reset my progress'; }, 3000); return; }
    const keep = MODE; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, {m:{}, tab:'me', xp:0, best:0, bossRuns:0, hs:{}, chk:{}, chkM:{}, gp:{}, mode:keep});
    save(); drawRing(); toast('Progress reset'); v.replaceChildren(); VIEWS.me(v);
  });
  v.append(rs);
};
