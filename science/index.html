<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="6th grade Scientific Method study lab: lessons, study guide practice, a boss quiz, and games.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Science Lab">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15241C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Scientific Method Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a lab notebook. Ruled-paper header with a red margin line, one column sized for a 375x667 phone, thumb-height tab bar, highlighter yellow for every answer reveal. */
:root{
  --bg:#EDF2EE; --surf:#FFFFFF; --ink:#12261D; --mut:#566F63; --line:#D1DDD5; --on:#FFFFFF; --rule:rgba(47,110,190,.16); --margin:rgba(214,64,86,.45);
  --w:#6B3FD6; --wt:#ECE6FD; --x:#0A8273; --xt:#D3F0EA; --d:#C42F78; --dt:#FBE2EE;
  --hl:#FFD84D; --hlk:#12261D;
  --ok:#14804A; --okt:#D8F1E3; --no:#C43333; --not:#F9DEDE;
  --fd:'Fredoka',ui-rounded,system-ui,sans-serif; --fb:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1712; --surf:#15241C; --ink:#E4EFE8; --mut:#93AA9D; --line:#27392F; --on:#0D1712; --rule:rgba(140,180,255,.10); --margin:rgba(255,120,140,.35);
  --w:#AE92FF; --wt:#2A2150; --x:#3FD3BE; --xt:#103D37; --d:#FF7DB8; --dt:#4A1C33;
  --hl:#F2C830; --hlk:#12261D; --ok:#4BD38B; --okt:#123D29; --no:#FF8585; --not:#451C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1712; --surf:#15241C; --ink:#E4EFE8; --mut:#93AA9D; --line:#27392F; --on:#0D1712; --rule:rgba(140,180,255,.10); --margin:rgba(255,120,140,.35);
  --w:#AE92FF; --wt:#2A2150; --x:#3FD3BE; --xt:#103D37; --d:#FF7DB8; --dt:#4A1C33;
  --hl:#F2C830; --hlk:#12261D; --ok:#4BD38B; --okt:#123D29; --no:#FF8585; --not:#451C1C; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-inline:16px;padding-block:0 84px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--fb);touch-action:manipulation;overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--fd);font-weight:600;margin:0;text-wrap:balance}
.wrap{max-width:560px;margin-inline:auto}
.u-w{--ac:var(--w);--at:var(--wt)}.u-x{--ac:var(--x);--at:var(--xt)}.u-d{--ac:var(--d);--at:var(--dt)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:-16px;padding:7px 16px 7px 36px;display:flex;align-items:center;justify-content:space-between;gap:10px;background-color:var(--surf);background-image:linear-gradient(90deg,transparent 24px,var(--margin) 24px,var(--margin) 26px,transparent 26px),repeating-linear-gradient(180deg,transparent 0 15px,var(--rule) 15px 16px);border-bottom:1px solid var(--line)}
.kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kick b{color:var(--d)}
.top h1{font-size:22px;line-height:1.1}
.lv{font-size:11px;font-weight:700;color:var(--mut);text-align:right;line-height:1.25}
.ring{position:relative;width:42px;height:42px;flex:none}
.ring svg{width:42px;height:42px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--fb)}
main{padding-block:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;min-width:0}
.pad{padding:12px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.c{text-align:center}
.big-out{font:600 21px/1.2 var(--fd);color:var(--ac,var(--ink));text-align:center;min-height:26px}
.hl{background:var(--hl);color:var(--hlk);border-radius:6px;padding:0 6px;font-weight:700}
.fx{display:block;width:100%;height:auto}
svg text{font-family:var(--fb)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.chip{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:6px 12px;border-radius:20px;border:2px solid transparent;background:var(--at,var(--bg));color:var(--ink);font-weight:700;line-height:1.2}
.chip.sel,button.chip.on{border-color:var(--ac,var(--ink))}
.btn{min-height:48px;padding:0 16px;border:0;border-radius:14px;background:var(--ac,var(--ink));color:var(--on);font-weight:700;font-size:16px}
.btn.ghost{background:var(--at,var(--surf));color:var(--ink);border:1px solid var(--line)}
.btn.hlb{background:var(--hl);color:var(--hlk)}
.btn:disabled{opacity:.4}
.back{min-height:38px;align-self:flex-start;padding:0 14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.seg button{flex:1 1 0;min-height:38px;padding:0 6px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;border:0;background:none;border-radius:12px;font-size:11px;font-weight:700;color:var(--mut)}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);background:var(--bg)}
nav button.on svg{stroke:var(--x)}

/* Learn */
.unit h2{font-size:15px;color:var(--ac);display:flex;align-items:center;gap:8px;padding-top:4px}
.unit h2::after{content:"";flex:1;height:1px;background:var(--line)}
.tp{overflow:hidden;scroll-margin-top:64px}
.tp>button{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 12px;border:0;background:none;text-align:left;font-weight:700;font-size:16px}
.ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--at);font-size:19px}
.tp .dot{margin-left:auto;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.tp .dot.m{background:var(--ok);border-color:var(--ok)}
.tp .dot.h{border-color:var(--ac);background:linear-gradient(90deg,var(--ac) 50%,transparent 50%)}
.tp .body{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.stage{border-radius:14px;background:var(--at);overflow:hidden}
.rule{padding:8px 12px;border-radius:12px;background:var(--hl);color:var(--hlk);font-weight:700;text-align:center;font-size:15px}
input[type=range]{width:100%;height:34px;accent-color:var(--ac,var(--x))}
.tile{min-height:52px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--surf);font-weight:700;line-height:1.2;text-align:center;display:grid;place-items:center;font-size:15px}
.tile.sel{border-color:var(--ac,var(--ink));background:var(--at,var(--bg))}
.tile.good{border-color:var(--ok);background:var(--okt)}.tile.bad{border-color:var(--no);background:var(--not)}
.tile.dim{opacity:.35}
.def{padding:12px;border-radius:14px;background:var(--at);display:flex;flex-direction:column;gap:4px;min-height:92px}
.def b{font:600 20px var(--fd);color:var(--ac)}
.num-t{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.num-t span{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surf);border:2px solid var(--line);font:600 20px var(--fd);transition:transform .25s}
.num-t span.mid{background:var(--hl);border-color:var(--hlk);color:var(--hlk)}
.num-t span.mo{border-color:var(--ac);background:var(--at)}

/* Cards */
.fc{perspective:1000px;height:260px;position:relative;touch-action:pan-y}
.fc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;border-radius:20px;border:2px solid var(--ac);background:var(--surf);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg);background:var(--at)}
.face .q{font:600 30px/1.1 var(--fd)}
.face .a{font:700 19px/1.3 var(--fb)}
.face .tapn{position:absolute;bottom:10px;font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac,var(--x));border-radius:99px;transition:width .3s}

/* Practice engine */
.dots{display:flex;gap:3px}
.dots i{flex:1;height:7px;border-radius:99px;background:var(--line)}
.dots i.g{background:var(--ok)}.dots i.b{background:var(--no)}.dots i.c{background:var(--ink)}.dots i.m{background:var(--x)}
.ctx{padding:10px 12px;border-radius:14px;background:var(--at);display:flex;flex-direction:column;gap:6px;font-size:15px}
.pq{font:600 19px/1.22 var(--fd)}
.opt{display:block;width:100%;min-height:48px;padding:8px 14px;text-align:left;border:2px solid var(--line);background:var(--surf);border-radius:14px;font-weight:700;font-size:16px;line-height:1.25}
.opt.sel{border-color:var(--ink);background:var(--bg)}
.opt.good{border-color:var(--ok);background:var(--okt)}
.opt.bad{border-color:var(--no);background:var(--not)}
.opts{display:grid;gap:8px}
.opts.g2{grid-template-columns:1fr 1fr}.opts.g2 .opt{text-align:center;padding:8px 6px;font-size:15px}
.opts.big .opt{min-height:72px;font-size:18px;text-align:center}
.ord{display:flex;flex-direction:column;gap:5px}
.ord .slot{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 10px;border-radius:12px;border:2px dashed var(--line);font-weight:700}
.ord .slot i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--at,var(--bg));font-size:13px;flex:none}
.ord .slot.full{border-style:solid;border-color:var(--ac,var(--ink));background:var(--surf)}
.ord .slot.good{border-color:var(--ok);background:var(--okt)}.ord .slot.bad{border-color:var(--no);background:var(--not)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:42px;padding:4px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surf);font-weight:700;font-size:15px}
.pick button.sel{border-color:var(--ink);background:var(--hl);color:var(--hlk)}
.pick button.good{border-color:var(--ok);background:var(--okt)}.pick button.bad{border-color:var(--no);background:var(--not)}
.pick button:disabled{opacity:.35}
.blank{min-width:64px;min-height:42px;padding:4px 12px;border-radius:12px;border:2px dashed var(--mut);background:var(--surf);font:600 19px var(--fd);color:var(--ink);vertical-align:middle}
.blank.on{border:2px solid var(--x);box-shadow:0 0 0 3px var(--xt)}
.blank.good{border:2px solid var(--ok);background:var(--okt)}.blank.bad{border:2px solid var(--no);background:var(--not)}
.blank:empty::before{content:"?";color:var(--mut)}
.fld{display:flex;align-items:center;gap:8px;font-weight:700}
.fld>span:first-child{min-width:62px}
.flds3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flds3 .fld{flex-direction:column;align-items:stretch;gap:3px}.flds3 .fld>span:first-child{min-width:0;font-size:13px;text-align:center;color:var(--mut)}.flds3 .blank{width:100%;min-width:0}
.pick.g2{display:grid;grid-template-columns:1fr 1fr}.pick.g2 button{font-size:14px;line-height:1.2}
.pad4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pad4 button{min-height:44px;border-radius:12px;background:var(--surf);border:2px solid var(--line);font:600 20px var(--fd)}
.pad4 button:active{background:var(--hl);color:var(--hlk)}
.pad4 .wide{grid-column:span 2;font-size:15px}
.fb{padding:10px 12px;border-radius:14px;font-weight:700}
.fb.good{background:var(--okt);border:2px solid var(--ok)}
.fb.bad{background:var(--not);border:2px solid var(--no)}
table.tb{border-collapse:collapse;font-weight:700;margin:2px auto}
.tb th,.tb td{border:1px solid var(--mut);padding:4px 9px;text-align:center;min-width:40px}
.tb th{background:var(--bg);font-family:var(--fd);font-weight:600}
.hpbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;border:2px solid var(--ink)}
.hpbar i{display:block;height:100%;background:var(--no);transition:width .5s}
.score{font:700 58px/1 var(--fd);text-align:center}
.mrow{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center;padding:8px 12px}
.mrow .nm{font-weight:700;font-size:15px;line-height:1.2}
.pct{font-size:13px;font-weight:700;text-align:right;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:700;font-size:15px}
.chk:last-child{border-bottom:0}
.chk i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-style:normal;font-size:15px}
.chk.on i{background:var(--ok);border-color:var(--ok);color:var(--on)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .35s}@keyframes pp{50%{transform:scale(1.06)}}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:9px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;max-width:90vw}
:focus-visible{outline:3px solid var(--x);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* hosted, full-screen app extras */
html{background:var(--bg)}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:536px;margin-inline:auto}
.a2hs svg{width:16px;height:16px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.a2hs button{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:rgba(127,127,127,.3);color:inherit;font-size:15px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div><div class="kick" id="kick">6th Grade Science</div><h1>Science Lab</h1></div>
    <div class="row" style="flex-wrap:nowrap;gap:8px"><div class="lv" id="lv"></div><div class="ring" id="ring"></div></div>
  </header>
  <main id="view"></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<div class="toast" id="toast" hidden></div>
<script>
(()=>{'use strict';
/* ---------- CORE ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const N = x => String(Math.round(x*1000)/1000);

/* state */
const KEY = 'sci-method-lab-v1';
let S = { m:{}, tab:'learn', xp:0, best:0, bossRuns:0, hs:{}, chk:{} };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
S.hs = S.hs || {}; S.chk = S.chk || {}; S.m = S.m || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const mast = id => S.m[id] || 0;

const UNITS = { w:'Words & Observing', x:'Experiments', d:'Data & Conclusions' };
const SKILLS = [
  [1,'w','Science Words','🔤'],[2,'w','Observe or Infer?','👀'],
  [3,'x','Testable Questions','❓'],[4,'x','Fair Tests','⚖️'],[5,'x','Science Steps','🪜'],[6,'x','IV & DV','🎯'],
  [7,'d','Graphs & Patterns','📈'],[8,'d','Mean, Median, Mode','🧮'],[9,'d','Models & Conclusions','🌋']
].map(([id,u,n,e]) => ({id,u,n,e}));
const SK = Object.fromEntries(SKILLS.map(t => [t.id, t]));

/* test day: Wednesday, Oct 28, 2026 (from the class slides) */
function testLine(){
  const t = new Date(2026, 9, 28), now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.round((t - d0) / 864e5);
  if (days < 0) return '6th Grade Science';
  if (days === 0) return '<b>Test today!</b> You got this';
  if (days === 1) return '<b>Test tomorrow</b> · Wed Oct 28';
  return `<b>Test in ${days} days</b> · Wed Oct 28`;
}

const lvl = () => Math.floor(S.xp / 100) + 1;
const overall = () => Math.round(SKILLS.reduce((s,t) => s + mast(t.id), 0) / SKILLS.length);
function drawRing(){
  const p = overall(), C = 2*Math.PI*17;
  $('#ring').innerHTML = `<svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="17" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="21" cy="21" r="17" fill="none" stroke="var(--x)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/></svg><b>${p}%</b>`;
  $('#ring').setAttribute('role','img'); $('#ring').setAttribute('aria-label','Overall mastery ' + p + ' percent');
  $('#lv').innerHTML = `Level ${lvl()}<br>${S.xp} XP`;
  $('#kick').innerHTML = testLine();
}
function bump(id, d){ S.m[id] = Math.max(0, Math.min(100, mast(id) + d)); save(); drawRing(); }
function xp(n){ const was = lvl(); S.xp += n; save(); drawRing(); if (lvl() > was) toast('Level up! Level ' + lvl()); }
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1600); }

const ICONS = {
  learn:'<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/>',
  guide:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  boss:'<path d="M6 3v18M6 4h11l-2 4 2 4H6"/>',
  games:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13v7M13 16.5h7"/>',
  me:'<path d="M5 19V11M12 19V5M19 19v-5"/>'
};
const TABS = [['learn','Learn'],['guide','Study Guide'],['boss','Boss Quiz'],['games','Games'],['me','Progress']];
const VIEWS = {};
let cleanup = null;
function go(tab){
  if (cleanup){ cleanup(); cleanup = null; }
  S.tab = tab; save();
  document.querySelectorAll('#nav button').forEach(b => { const on = b.dataset.t === tab; b.classList.toggle('on', on); on ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'); });
  const v = $('#view'); v.replaceChildren(); VIEWS[tab](v);
  window.scrollTo(0,0);
}
function buildNav(){
  const n = $('#nav');
  TABS.forEach(([k,l]) => n.append(h('button',{'data-t':k,onclick:()=>go(k)}, h('span',{html:`<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`}), l)));
}
function seg(items, cur, fn){
  const el = h('div',{class:'seg'});
  items.forEach(([k,l]) => el.append(h('button',{class:k===cur?'on':'',onclick:ev => { el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === ev.currentTarget)); fn(k); }}, l)));

/* small line graph for patterns: xs labels, ys values */
function lineGraph(o){
  const W = 280, H = 170, L = o.bare ? 14 : 40, R = 12, T = o.title ? 26 : 12, B = o.bare ? 14 : 34, n = o.ys.length, ymax = o.ymax;
  const px = i => L + (i + .5) * (W - L - R) / n, py = y => H - B - y / ymax * (H - B - T);
  let s = `<rect width="${W}" height="${H}" rx="10" fill="var(--surf)"/>`;
  if (o.scale !== false) for (let y = 0; y <= ymax; y += o.ystep) s += `<line x1="${L}" x2="${W-R}" y1="${py(y)}" y2="${py(y)}" stroke="var(--line)"/>` + (o.bare ? '' : `<text x="${L-6}" y="${py(y)+4}" font-size="10" text-anchor="end" fill="var(--mut)">${y}</text>`);
  s += `<path d="M${L} ${T}V${H-B}H${W-R}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`;
  if (o.scale !== false && !o.bare) o.xs.forEach((x,i) => { s += `<text x="${px(i)}" y="${H-B+14}" font-size="10" text-anchor="middle" fill="var(--mut)">${x}</text>`; });
  s += `<polyline points="${o.ys.map((y,i) => px(i)+','+py(y)).join(' ')}" fill="none" stroke="var(--ac,var(--d))" stroke-width="3" stroke-linejoin="round"/>`;
  o.ys.forEach((y,i) => { s += `<circle cx="${px(i)}" cy="${py(y)}" r="4.5" fill="var(--ink)"/>`; });
  if (o.title) s += `<text x="${(L+W-R)/2}" y="17" font-size="13" font-weight="700" text-anchor="middle" fill="var(--ink)">${o.title}</text>`;
  if (o.xlab) s += `<text x="${(L+W-R)/2}" y="${H-4}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">${o.xlab}</text>`;
  if (o.ylab) s += `<text transform="translate(11 ${(T+H-B)/2}) rotate(-90)" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">${o.ylab}</text>`;
  return `<svg class="fx" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph">${s}</svg>`;
}

const MC = (o) => Object.assign({type:'mc'}, o);

function gWord(){
  const w = pick(WORDS), others = shuffle(WORDS.filter(x => x !== w)).slice(0,3);
  if (Math.random() < .55) return shufMC({skill:1, title:'Science words', prompt:`Which word means: <span class="hl">${w[1]}</span>`, layout:'g2', why:`${w[3]} <b>${w[0]}</b>: ${w[1]} Example: ${w[2]}`}, w[0], others.map(x => x[0]));
  return shufMC({skill:1, title:'Science words', prompt:`What does <span class="hl">${w[0]}</span> mean?`, why:`${w[3]} <b>${w[0]}</b>. Example: ${w[2]}`}, w[1], others.map(x => x[1]));
}
function gOI(){

function gTest(){
  const p = pick(TESTQ);
  return shufMC({skill:3, title:'Testable question', prompt:'Which question is <span class="hl">testable</span>?', why:`You can test it and measure ${p[2]}. “${p[1]}” is an opinion.`}, p[0], [p[1]]);
}
function gFair(){
  const f = pick(FAIR);
  if (Math.random() < .5){
    const ch = shuffle([...shuffle(f.same).slice(0,3), ...shuffle(f.bad).slice(0,2)]);
    return {type:'multi', skill:4, title:'Fair test', ctx:`${f.q} They change only the <b>${f.iv}</b>.`, prompt:'Pick <span class="hl">TWO</span> things to keep the same.', choices:ch, correct:ch.map((c,i) => f.same.includes(c) ? i : -1).filter(i => i >= 0), pick:2, why:`Keep everything the same except the ${f.iv}. Then you know the ${f.iv} caused the result.`};
  }
  const b = pick(f.bad);
  return shufMC({skill:4, title:'Fair test', ctx:`${f.q} They change only the <b>${f.iv}</b>.`, prompt:'Which choice would make the test <span class="hl">UNFAIR</span>?', why:`“${b}” changes a second thing. A fair test changes only one thing.`}, b, shuffle(f.same).slice(0,3));
}
function gSteps(){
  const r = Math.random();
  if (r < .4) return {type:'order', skill:5, title:'Science steps', prompt:'Put the steps in order. Tap them 1 to 6.', items:STEPS.map(s => s[0]), why:'Question → Hypothesis → Procedure → Experiment → Analyze → Conclusion.'};
  if (r < .7){ const i = rnd(0,4); return shufMC({skill:5, title:'Science steps', prompt:`What comes right after <span class="hl">${STEPS[i][0]}</span>?`, why:`Order: ${STEPS.map(s => s[0]).join(' → ')}.`}, STEPS[i+1][0], shuffle(STEPS.filter((s,k) => k !== i + 1 && k !== i).map(s => s[0])).slice(0,3)); }
  const i = rnd(0,5);
  return shufMC({skill:5, title:'Science steps', prompt:`Which step is this? <span class="hl">${STEPS[i][1]}</span>`, why:`${STEPS[i][0]}: ${STEPS[i][1]}`}, STEPS[i][0], shuffle(STEPS.filter((s,k) => k !== i).map(s => s[0])).slice(0,3));
}
function ivRows(f){

  return [{h:'IV (cause)', opts, a:opts.indexOf(f[2])}, {h:'DV (effect)', opts, a:opts.indexOf(f[3])}];
}

}
function gGraph(){
  if (Math.random() < .35){
    const ch = shuffle([...GRAPH_GOOD, ...shuffle(GRAPH_BAD).slice(0,2)]);
    return {type:'multi', skill:7, title:'Good graphs', prompt:'Pick <span class="hl">THREE</span> things a good science graph needs.', choices:ch, correct:ch.map((c,i) => GRAPH_GOOD.includes(c) ? i : -1).filter(i => i >= 0), pick:3, why:'A good graph has a title, labels on both axes, and an even scale.'};
  }
  const kind = pick(['up','up','down','same']), T = pick([['Seedling height','Week','Height (cm)'],['Ice cube size','Minute','Size (cm)'],['Puppy weight','Month','Weight (kg)']]);
  let ys = []; let y = kind === 'down' ? rnd(14,18) : kind === 'same' ? rnd(5,9) : rnd(2,4);
  for (let i = 0; i < 4; i++){ ys.push(y); y += kind === 'up' ? rnd(2,4) : kind === 'down' ? -rnd(2,4) : 0; }
  const right = {up:'It increases each time.', down:'It decreases each time.', same:'It stays the same.'}[kind];
  const ymax = Math.ceil((Math.max(...ys) + 2) / 5) * 5;
  return shufMC({skill:7, title:'Read the pattern', ctx:`${T[0]} over 4 ${T[1].toLowerCase()}s:`, fig:tbl([[T[1],1,2,3,4],[T[2],...ys]]) + `<div style="max-width:260px;margin:6px auto 0">${lineGraph({xs:[1,2,3,4], ys, ymax, ystep:5, xlab:T[1], ylab:T[2]})}</div>`, prompt:'What pattern do the data show?', why:`${ys.join(' → ')}. ${right}`}, right, Object.values({up:'It increases each time.', down:'It decreases each time.', same:'It stays the same.'}).filter(x => x !== right).concat(['It goes up, then down.']));
}
function mmmSet(){
  for (let t = 0; t < 500; t++){
    const noMode = Math.random() < .3; let a = [];
    if (noMode){ const s = new Set(); while (s.size < 5) s.add(rnd(1,14)); a = [...s]; }
    else { const m = rnd(1,12); a = [m, m]; while (a.length < 5){ const v = rnd(1,14); if (v !== m && !a.includes(v)) a.push(v); } }
    const sum = a.reduce((x,y) => x + y, 0); if (sum % 5) continue;
    const srt = a.slice().sort((x,y) => x - y), cnt = {}; a.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    const top = Math.max(...Object.values(cnt)), modes = Object.keys(cnt).filter(k => cnt[k] === top).map(Number);
    return {a, srt, mean:sum / 5, sum, median:srt[2], mode: top === 1 ? null : modes[0]};
  }
}
const mmmWhy = m => [`Mean: ${m.a.join(' + ')} = ${m.sum}. ${m.sum} ÷ 5 = ${m.mean}.`, `Median: in order ${m.srt.join(', ')}. The middle is ${m.median}.`, m.mode == null ? 'Mode: no number repeats, so there is no mode.' : `Mode: ${m.mode} shows up most often.`];
function gMMM(set){
  const m = set || mmmSet(), shown = Math.random() < .5 ? m.a : m.srt;
  return {type:'num', skill:8, title:'Mean, median, mode', ctx:'Numbers:', fig:numsHTML(shown), prompt:'Find the mean, median, and mode.', blanks:[{label:'Mean', answer:m.mean},{label:'Median', answer:m.median},{label:'Mode', answer:m.mode, none:true}], why:mmmWhy(m).join('<br>')};
}
function gModel(){
  if (Math.random() < .3) return MC({skill:9, title:'Honest results', prompt:'An experiment’s results do <span class="hl">NOT</span> support the hypothesis. What should the scientist do?', choices:['Change the results','Ignore the investigation','Report the evidence honestly and explain it','Repeat until it agrees'], answer:2, why:'Scientists report what really happened, even when the hypothesis was wrong.'});
  const s = pick(SEP);
  return MC({skill:9, title:'Science practices', ctx:s[0], prompt:'Which practice is being used?', choices:PRACTICES, answer:s[1], why:`${PRACTICES[s[1]]}.` + (s[1] === 1 ? ' A model represents something real.' : '')});
}
function conclusionScenario(){
  const T = pick([
    () => { const a = rnd(9,15), b = a - rnd(2,5); return {pred:'Students predicted that plants with 6 hours of light would grow taller than plants with 3 hours.', A:`6-hour plants averaged ${a} cm`, B:`3-hour plants averaged ${b} cm`, sup:true, ev:`Plants with 6 hours of light averaged ${a} cm, compared with ${b} cm for plants with 3 hours, a ${a - b} cm difference.`}; },
    () => { const hot = rnd(20,40), cold = hot + rnd(20,50), flip = Math.random() < .4; return flip
      ? {pred:'Students predicted that sugar would dissolve faster in cold water than in hot water.', A:`Hot water: ${hot} seconds`, B:`Cold water: ${cold} seconds`, sup:false, ev:`Sugar dissolved in ${hot} seconds in hot water but took ${cold} seconds in cold water, ${cold - hot} seconds slower.`}
      : {pred:'Students predicted that sugar would dissolve faster in hot water than in cold water.', A:`Hot water: ${hot} seconds`, B:`Cold water: ${cold} seconds`, sup:true, ev:`Sugar dissolved in ${hot} seconds in hot water and ${cold} seconds in cold water, ${cold - hot} seconds faster.`}; },
    () => { const lo = rnd(60,90), hi = lo + rnd(20,60); return {pred:'Students predicted that a higher ramp would make a toy car roll farther.', A:`High ramp: ${hi} cm`, B:`Low ramp: ${lo} cm`, sup:true, ev:`The car rolled ${hi} cm from the high ramp and ${lo} cm from the low ramp, ${hi - lo} cm farther.`}; },
    () => { const more = rnd(10,14), less = more + rnd(2,4); return {pred:'Students predicted that more fertilizer would make flowers grow taller.', A:`More fertilizer: ${more} cm`, B:`Less fertilizer: ${less} cm`, sup:false, ev:`Flowers with more fertilizer averaged ${more} cm, but flowers with less fertilizer averaged ${less} cm, ${less - more} cm taller.`}; }
  ]);
  return T();
}
function gConc(sc){

    `${say(c.sup)} ${c.ev}`, [`${say(!c.sup)} ${c.ev}`, 'My hypothesis was right.', 'I liked doing this experiment.']);
}

  function draw(){
    wrap.replaceChildren(h('div',{class:'row',style:'gap:6px'}, [['all','All'],['w','Words'],['x','Experiments'],['d','Data']].map(([k,l]) => h('button',{class:'chip' + (unit === k ? ' sel' : ''),style:'min-height:34px',onclick:() => { unit = k; S.cu = k; save(); build(); }}, l))));
    if (i >= deck.length){ wrap.append(h('div',{class:'card pad col c'}, h('h2',{style:'font-size:28px'},'Deck done! 🎉'), h('button',{class:'btn hlb',onclick:build},'Shuffle again'))); return; }
    const c = deck[i], t = SK[c[0]], toggle = () => { flip = !flip; card.classList.toggle('flip', flip); };
    const card = h('div',{class:'fc u-' + t.u + (flip ? ' flip' : ''),role:'button',tabindex:'0','aria-label':'Flashcard. Tap to flip.'},
      h('div',{class:'in'}, h('div',{class:'face'}, h('div',{class:'lbl'}, t.n), h('div',{class:'q',style:c[1].length > 24 ? 'font-size:23px' : '',html:c[1]}), h('div',{class:'tapn'},'tap to flip · swipe right = got it')),
        h('div',{class:'face back'}, h('div',{class:'a',html:c[2]}))));
    let x0 = null, y0 = 0;
    card.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; });
    card.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) next(dx > 0); else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) toggle(); });
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
    wrap.append(h('div',{class:'bar u-' + t.u}, h('i',{style:`width:${Math.round(i / deck.length * 100)}%`})), card,
      h('div',{class:'grid2'}, h('button',{class:'btn ghost',onclick:() => next(false)},'Again'), h('button',{class:'btn',onclick:() => next(true)},'Got it')), h('div',{class:'hint c'}, `${i + 1} / ${deck.length}`));
  }

}

function gmMMM(){
  const m = mmmSet(), w = pick(['mean','median','mode']), ans = w === 'mean' ? m.mean : w === 'median' ? m.median : m.mode;
  const pool = shuffle([m.mean, m.median, m.mode, m.mean + 1, m.median + 1, m.median - 1, m.sum, ...m.a]).filter(x => x != null && x > 0);
  const ch = [ans == null ? 'No mode' : String(ans)]; if (w === 'mode' && ans != null) ch.push('No mode');
  pool.forEach(x => { if (ch.length < 4 && !ch.includes(String(x))) ch.push(String(x)); });
  const all = shuffle(ch), wy = mmmWhy(m)[w === 'mean' ? 0 : w === 'median' ? 1 : 2];
  return {prompt:`What is the <span class="hl">${w}</span>?`, fig:numsHTML(m.a), choices:all, answer:all.indexOf(ans == null ? 'No mode' : String(ans)), cols:2, why:wy};
}

function playGame(box, G, exit){
  const st = {n:0, score:0, streak:0, best:0, tl:G.time || 0, over:false};
  let timer = null, adv = null, locked = false;
  const stop = () => { clearInterval(timer); clearTimeout(adv); timer = adv = null; };
  cleanup = stop;
  const back = backBtn('Games', () => { stop(); cleanup = null; exit(); });
  const hud = h('div',{class:'row sp',style:'font-weight:700'}), area = h('div',{class:'col'}), bar = G.time ? h('div',{class:'bar'}, h('i',{style:'width:100%;transition:width 1s linear'})) : null;
  const paintHud = () => { hud.replaceChildren(h('span',{}, G.rounds ? `Round ${Math.min(st.n, G.rounds)}/${G.rounds}` : `Streak ${st.streak} 🔥`), h('span',{class:'hl'}, `Score ${st.score}`), h('span',{}, G.time ? `${st.tl}s` : '')); if (bar) bar.firstChild.style.width = (st.tl / G.time * 100) + '%'; };
  const isLast = () => G.rounds && st.n >= G.rounds;
  function next(){
    clearTimeout(adv); if (st.over) return; if (isLast()) return end();
    const q = G.gen(); st.n++; locked = false; paintHud();
    const btns = [], list = h('div',{class:'opts' + (q.cols === 2 ? ' g2' : '') + (q.big ? ' big' : '')});
    q.choices.forEach((c,k) => { const b = h('button',{class:'opt',html:c,onclick:() => choose(k)}); btns.push(b); list.append(b); });
    function choose(k){
      if (locked || st.over) return; locked = true;
      const ok = k === q.answer; btns[q.answer].classList.add('good');
      if (ok){ st.score++; st.streak++; st.best = Math.max(st.best, st.streak); btns[k].classList.add('pop'); } else { st.streak = 0; btns[k].classList.add('bad','shake'); }
      paintHud();
      if (!(ok && G.time)) area.append(h('div',{class:'fb ' + (ok ? 'good' : 'bad'),html:(ok ? (st.streak >= 3 ? `🔥 ${st.streak} in a row! ` : '✓ ') : '✗ ') + q.why}));
      if (ok) adv = setTimeout(next, G.time ? 300 : 1100); else if (G.time) adv = setTimeout(next, 1500); else area.append(h('button',{class:'btn',onclick:next}, isLast() ? 'See results' : 'Next'));
    }
    area.replaceChildren(...[h('div',{class:'pq',html:q.prompt,style:q.big ? 'font-size:22px;min-height:84px' : ''}), q.fig ? h('div',{html:q.fig}) : null, list].filter(Boolean));
  }
  function end(){
    st.over = true; stop(); cleanup = null;
    const sc = st.score, prev = S.hs[G.id] || 0, nb = sc > prev; if (nb) S.hs[G.id] = sc;
    xp(sc * 3); bump(G.skill, Math.round(8 * Math.min(1, sc / G.par))); save();
    box.replaceChildren(back, h('div',{class:'card pad col c'}, h('div',{class:'lbl'}, G.name), h('div',{class:'score'}, G.rounds ? `${sc}/${G.rounds}` : String(sc)),
      h('div',{class:'big-out'}, nb && prev > 0 ? 'New best! 🎉' : sc >= G.par ? 'Great run!' : 'Nice try'), h('div',{class:'hint'}, `Best: ${S.hs[G.id]} · longest streak: ${st.best} · +${sc * 3} XP`)),
      h('div',{class:'grid2'}, h('button',{class:'btn hlb',onclick:() => playGame(box, G, exit)},'Play again'), h('button',{class:'btn ghost',onclick:exit},'All games')));
    window.scrollTo(0,0);
  }
  box.replaceChildren(back, hud, ...(bar ? [bar] : []), area); paintHud();
  if (G.time) timer = setInterval(() => { st.tl--; paintHud(); if (st.tl <= 0) end(); }, 1000);
  next();
}

/* a stopwatch shared by the timed puzzles; lower time is better */
function stopwatch(el){ const t0 = Date.now(); let pen = 0; const iv = setInterval(() => { el.textContent = `⏱ ${((Date.now() - t0) / 1000 + pen).toFixed(0)}s`; }, 250); return {add:s => pen += s, stop:() => { clearInterval(iv); return Math.round(((Date.now() - t0) / 1000 + pen) * 10) / 10; }, kill:() => clearInterval(iv)}; }
function timeResult(box, id, name, secs, exit, again, extra){
  const prev = S.hs[id], nb = !prev || secs < prev; if (nb) S.hs[id] = secs; xp(15); save();
  box.replaceChildren(backBtn('Games', exit), h('div',{class:'card pad col c'}, h('div',{class:'lbl'}, name), h('div',{class:'score'}, secs + 's'), h('div',{class:'big-out'}, nb && prev ? 'New record! 🎉' : nb ? 'First record set!' : 'Done!'), h('div',{class:'hint'}, `Best: ${S.hs[id]}s · ${extra} · +15 XP`)),
    h('div',{class:'grid2'}, h('button',{class:'btn hlb',onclick:again},'Play again'), h('button',{class:'btn ghost',onclick:exit},'All games')));
}

const SHORT = {Hypothesis:'A testable prediction', Quantitative:'Uses numbers or measurements', Qualitative:'Describes with words: color, shape, texture', Inference:'An explanation of what you observe', Observation:'What you notice with senses or tools', Model:'A representation of something real', Properties:'Traits that help identify materials', Science:'Knowledge from observations and experiments', 'Controlled experiment':'Only one variable changes', Conclusion:'Explains the results using evidence', Variable:'A factor that can affect results'};
function matchGame(box, exit){
  const clock = h('b',{}), area = h('div',{class:'col'}), rounds = shuffle(Object.keys(SHORT));
  let r = 0, miss = 0, sel = null; const sw = stopwatch(clock); cleanup = sw.kill;
  box.replaceChildren(backBtn('Games', () => { sw.kill(); cleanup = null; exit(); }), h('div',{class:'row sp'}, h('span',{class:'hint'},'Tap a word, then its meaning.'), clock), area);
  const deal = () => {
    const words = rounds.slice(r*4, r*4 + 4), left = h('div',{class:'col',style:'gap:6px'}), right = h('div',{class:'col',style:'gap:6px'}); let left4 = words.length;
    shuffle(words).forEach(w => { const b = h('button',{class:'tile u-w',style:'min-height:60px',onclick:() => { if (b.disabled) return; left.querySelectorAll('.tile').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = w; }}, w); left.append(b); });
    shuffle(words).forEach(w => { const b = h('button',{class:'tile',style:'min-height:60px;font-size:13px',onclick:() => {
      if (b.disabled || !sel) return;
      const lb = [...left.children].find(x => x.textContent === sel);
      if (sel === w){ [lb, b].forEach(x => { x.classList.remove('sel'); x.classList.add('good'); x.disabled = true; }); sel = null; if (--left4 === 0){ r++; if (r * 4 >= rounds.length){ const s = sw.stop(); cleanup = null; bump(1, 10); timeResult(box, 'match', 'Word Match', s, exit, () => matchGame(box, exit), `${miss} miss${miss === 1 ? '' : 'es'}`); } else setTimeout(deal, 350); } }
      else { miss++; sw.add(2); [lb, b].forEach(x => x.classList.add('bad','shake')); setTimeout(() => [lb, b].forEach(x => x.classList.remove('bad','shake')), 450); toast('+2 seconds'); }
    }}, SHORT[w]); right.append(b); });
    area.replaceChildren(h('div',{class:'lbl'}, `Round ${r + 1} of ${Math.ceil(rounds.length / 4)}`), h('div',{class:'grid2'}, left, right));

}
function stepGame(box, exit){
  const clock = h('b',{}), slots = h('div',{class:'ord'}), pk = h('div',{class:'pick'}); let nxt = 0, miss = 0; const sw = stopwatch(clock); cleanup = sw.kill;
  const paint = () => slots.replaceChildren(...STEPS.map((s,k) => h('div',{class:'slot' + (k < nxt ? ' good' : '')}, h('i',{}, k + 1), k < nxt ? s[0] : '')));
